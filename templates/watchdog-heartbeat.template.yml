# TEMPLATE (agent-pipeline): copiar al repo consumidor y sustituir
# __DEFAULT_BRANCH__ por la rama por defecto. NO es workflow_call a propósito:
# el vigilante del vigilante debe correr en infraestructura independiente de
# lo que vigila (runner GitHub-hosted, cero LLM) y sin dependencia del central.
name: Watchdog Heartbeat

# Latido del vigilante (2026-07-07): el régimen autónomo depende de que
# watchdog.yml corra, pero nadie vigilaba al vigilante. Su cron es
# best-effort (observado: 2 runs en 5h pese al */20) y workflow_run solo
# dispara si ALGO corre — silencio total del pipeline es su punto ciego.
#
# Este workflow, con cron propio e independiente, hace tres cosas baratas
# y deterministas (cero LLM):
#
#   1. REVIVIR: si el último run del Watchdog envejece > STALE_MIN,
#      re-dispararlo vía workflow_dispatch (autoreparación, cero humano)
#      y verificar en la misma corrida que el run nace. Solo si el
#      dispatch falla o el run no aparece (vigilante muerto e
#      irreanimable — p. ej. workflow deshabilitado) abre issue
#      `human-needed`. Única vía nueva a humano, y genuinamente
#      terminal: un watchdog irreanimable suele implicar tocar
#      workflows, que es gate humano de todas formas.
#
#   1-bis. CONCLUSIONES (AP-059, repesca finplan#1684 / aud. fp#1700): la
#      EDAD del último run no distingue «vivo» de «corre y falla». El
#      2026-07-27 el `detect` del Watchdog de finplan murió en todos los
#      ticks durante ~1 h (permiso del cap del job, AP-056): el run nacía
#      fresco cada 20 min, este heartbeat lo veía VIVO y el revival por
#      dispatch habría sido inútil de todas formas (el run nace y vuelve
#      a morir). Coste: 48 min de cadena parada + des-stall humano. Ahora,
#      además de la edad, se mira la CONCLUSIÓN: K corridas completadas
#      consecutivas en rojo ⇒ escalada por la MISMA vía `escalate()`, sin
#      intentar revival (no aplica a este modo). El reusable del central
#      lleva su propio belt `if: failure()` en el job `detect`, más rápido
#      (~K ticks) y con el error citado; ESTE es el belt de 2º orden que
#      cubre el residual en que aquel muere con el runner o el run entero
#      no llega a arrancar (`startup_failure` — clase AP-022/#57). Ambos
#      comparten marcador de dedupe: no pueden duplicar el issue.
#      La rama exige racha en rojo Y run FRESCO (`age <= STALE_MIN`): la
#      frescura es la propiedad definitoria del modo, y sin ella la racha
#      —historial inmutable— canibalizaría el revival del punto 1, que es
#      el único mecanismo capaz de producir el `success` que la resetea.
#
#   2. DIGEST: sincroniza los comentarios <!-- autonomous-decision --> y
#      <!-- derived-decision --> recientes al issue-registro (label
#      `registro-decisiones`, creado idempotentemente, pinnearlo es
#      cosmético). Convierte el veto asíncrono en ejercible: un solo
#      lugar que mirar, en vez de comentarios dispersos por issues.
#
# GITHUB_TOKEN basta para todo: workflow_dispatch y repository_dispatch
# son las dos excepciones documentadas del anti-loop de GitHub (eventos
# del GITHUB_TOKEN no disparan otros workflows, SALVO estos dos). El
# issue-digest no necesita disparar nada.

on:
  schedule:
    # Cada 30 min, minutos desplazados: los crons en :00/:20/:30 sufren
    # más throttling por congestión de la cola compartida de GitHub.
    - cron: '13,43 * * * *'
  workflow_dispatch: {}

permissions:
  actions: write     # listar runs del watchdog + dispatch de revival
  issues: write      # issue de escalada + digest

concurrency:
  group: watchdog-heartbeat
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Revivir watchdog si está muerto (o escalar si corre y falla)
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const WF = 'watchdog.yml';
            const STALE_MIN = 90;   // watchdog: cron */20 + workflow_run → 90 min de silencio = muerto
            const STREAK_K = 3;     // AP-059: corridas COMPLETADAS consecutivas en rojo ⇒ «corre y falla»
            const now = Date.now();
            const MARK = '<!-- watchdog-heartbeat-escalation -->';   // dedupe COMPARTIDO con el belt del reusable
            const MODE_RED = '<!-- watchdog-detect-red-streak -->';  // modo «corre y FALLA»
            const MODE_DEAD = '<!-- watchdog-dead-unrevivable -->';  // modo «parado e irreanimable»

            // Conclusiones que cuentan como «el watchdog está roto». `success`
            // es el ÚNICO reset. `cancelled`/`skipped` NO cuentan y NO rompen
            // la racha: el grupo de concurrencia del watchdog poda su cola en
            // cada ráfaga de eventos y produce cancelaciones RUTINARIAS —
            // tratarlas como reset dejaría este belt indisparable justo en los
            // picos de actividad. `startup_failure` sí cuenta, y es el valor
            // añadido de mirar desde AQUÍ: un run que muere antes de crear
            // ningún job (permiso nuevo del reusable que el stub no concede,
            // clase AP-022/#57) nace fresco, luego pasa el chequeo de edad, y
            // el belt `if: failure()` del propio reusable no llega a existir.
            const HARD = new Set(['failure', 'timed_out', 'startup_failure']);

            async function latestRunAgeMin() {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: WF, per_page: 1 });
              if (!data.workflow_runs.length) return Infinity;
              return (now - new Date(data.workflow_runs[0].created_at).getTime()) / 60000;
            }

            // Racha de corridas COMPLETADAS en rojo (aquí no hay run propio que
            // contar: el que corre es este heartbeat, no el watchdog).
            async function redStreak() {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: WF, status: 'completed', per_page: 20 });
              let n = 0;
              for (const r of (data.workflow_runs || [])) {
                if (r.conclusion === 'success') break;
                if (!HARD.has(r.conclusion)) continue;
                n++;
                if (n >= STREAK_K) break;
              }
              return n;
            }

            // Dedupe por MARCADOR y con listForRepo, no por título ni con la
            // API de búsqueda (AP-059): (a) hay dos modos de escalada con
            // títulos distintos y UN solo issue debe existir — el marcador es
            // el canal común, también con el belt del reusable, que escala por
            // su cuenta; (b) el índice de búsqueda tarda minutos en ver un
            // issue recién creado, y belt y heartbeat pueden coincidir dentro
            // de esa ventana. `listForRepo` lee estado, no índice.
            //
            // El listado va en `try/catch`, SIMÉTRICO al belt del reusable: un
            // throw aquí propagaría por `escalate()` y mataría el step, y el
            // rojo de ESTE workflow no tiene consumidor (el heartbeat es el
            // suelo de la pila de vigilancia). Degradación declarada: prefiero
            // duplicar a callar.
            async function openEscalation() {
              let open = [];
              try {
                open = await github.paginate(github.rest.issues.listForRepo,
                  { owner, repo, labels: 'human-needed', state: 'open', per_page: 100 });
              } catch (e) {
                core.warning(`no se pudo listar escaladas abiertas (${e.message}): sigo, prefiero duplicar a callar.`);
                return null;
              }
              return open.find(i => !i.pull_request && (i.body || '').includes(MARK)) || null;
            }

            // Transición de MODO sin duplicar el issue. El marcador de dedupe
            // es COMÚN a los tres emisores, luego una escalada abierta en el
            // modo A silenciaba por completo el modo B (rojo ⇒ muerto, y al
            // revés): un cambio de estado del vigilante perdido justo donde el
            // valor declarado es «fallo SILENCIOSO ⇒ estado DECLARADO con
            // dueño». «UN solo issue a la vez» se mantiene; lo que deja de
            // perderse es la transición, que entra como COMENTARIO con el
            // marcador del modo nuevo (idempotente por ese mismo marcador).
            async function declareMode(issue, mode, texto) {
              if ((issue.body || '').includes(mode)) return;
              let comments = [];
              try {
                comments = await github.paginate(github.rest.issues.listComments,
                  { owner, repo, issue_number: issue.number, per_page: 100 });
              } catch (e) {
                core.warning(`no se pudieron listar los comentarios de #${issue.number} (${e.message}): no comento (aquí sí prefiero callar a repetir cada tick).`);
                return;
              }
              if (comments.some(c => (c.body || '').includes(mode))) return;
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number,
                body: `${texto}\n\n${mode}` });
              core.warning(`Watchdog: transición de modo declarada en #${issue.number}.`);
            }

            async function escalate(title, body, mode, transicion) {
              const abierta = await openEscalation();
              if (abierta) {
                core.info(`escalada de watchdog ya abierta (#${abierta.number}), no duplico`);
                await declareMode(abierta, mode, transicion);
                return;
              }
              await github.rest.issues.create({ owner, repo, title,
                labels: ['human-needed'], body: `${body}\n\n${mode}\n${MARK}` });
              core.warning(`Watchdog: escalada abierta — ${title}`);
            }

            const DEAD_TITLE = 'Watchdog muerto e irreanimable — intervención humana';
            const deadBody = reason =>
              `El heartbeat detectó el Watchdog parado (último run hace >${STALE_MIN} min) y el revival automático falló: ${reason}\n\nComprobar: Actions → Watchdog (¿workflow deshabilitado?), quota, y los runs recientes de este heartbeat.`;
            const DEAD_TRANSITION =
              `**Transición de modo.** El Watchdog ha pasado al modo «parado e IRREANIMABLE» (último run hace >${STALE_MIN} min y el revival por \`workflow_dispatch\` no lo levantó) mientras esta escalada seguía abierta por otro modo. Un solo issue a propósito; esto declara el cambio de estado en vez de silenciarlo.`;

            const age = await latestRunAgeMin();
            core.info(`Último run del watchdog: hace ${Math.round(age)} min`);

            // Belt de 2º orden ANTES del chequeo de edad, pero CONDICIONADO a
            // la frescura del run: el modo «corre y falla» es indistinguible
            // de la salud POR EDAD (el run es FRESCO), y ahí el revival por
            // dispatch no aplica — nacería y volvería a morir. Es un modo
            // TERMINAL-humano.
            //
            // La conjunción con `age <= STALE_MIN` NO es defensiva: la
            // frescura es la propiedad DEFINITORIA del modo. `redStreak()` se
            // computa sobre historial INMUTABLE, luego sin ella la condición
            // sería permanentemente verdadera hasta que existiera un run
            // `success` — y con `return` duro delante del gate de edad dejaría
            // MUERTO el revival por `workflow_dispatch`, que es el único
            // mecanismo capaz de producir ese `success`. «Rojo antiguo +
            // silencio» sería un punto fijo: cron throttleado (observado: 2
            // runs en 5h pese al */20) ⇒ ningún run nuevo ⇒ ningún reset, y la
            // escalada además diagnosticaría el modo EQUIVOCADO («corre y
            // falla» sobre un watchdog que no está corriendo en absoluto).
            // Con la conjunción: fresco+rojo ⇒ escalada sin revival (intención
            // intacta); parado+rojo ⇒ se intenta el revival, y si el run nace
            // y vuelve a morir, el tick siguiente ya lo ve fresco+rojo y
            // escala. Ninguna cobertura se pierde; el revival deja de
            // canibalizarse.
            const streak = await redStreak();
            core.info(`Corridas completadas consecutivas en rojo: ${streak} · umbral K=${STREAK_K}`);
            if (streak >= STREAK_K && age <= STALE_MIN) {
              core.warning(`Watchdog corre pero FALLA (${streak} corridas en rojo). Escalo sin intentar revival.`);
              await escalate('Watchdog roto: el detector corre y FALLA — intervención humana', [
                `El Watchdog **corre y falla**: sus últimas **${streak} corridas completadas** concluyeron en rojo (umbral K=${STREAK_K}). El evento dispara, el run nace y el run muere.`,
                ``,
                `Este heartbeat lo veía VIVO hasta AP-059 porque solo miraba la EDAD del último run — y el revival por \`workflow_dispatch\` no aplica a este modo: el run nacería y volvería a morir. Precedente: finplan#1684, 48 min de cadena parada y des-stall humano.`,
                ``,
                `**Consecuencia mientras dure.** Las capas 2 y 3 de vigilancia están caídas: todo ítem \`stalled\` cuyo único consumidor es architect-resolve espera a un resolutor que no va a llegar.`,
                ``,
                `**Qué comprobar.** Actions → Watchdog → el último run en rojo, y el step que falla: (1) \`Resource not accessible by integration\` ⇒ permisos (el cap del job del reusable, o este stub concediendo menos que \`permissions_required\` del contrato — AP-056, AP-022/#57); (2) \`SyntaxError\` ⇒ script embebido del reusable; (3) el run muere SIN jobs (\`startup_failure\`) ⇒ el stub no concede algún permiso que el reusable pide.`,
                ``,
                `Terminal-humano a propósito: arreglar esto suele exigir tocar \`.github/workflows/**\` o permisos (gate humano de todas formas).`,
                ``,
                `**Cerrar este issue NO resetea la racha.** La racha se deriva de la \`conclusion\` de las corridas, no del estado de los issues: cerrar esto solo retira el supresor de dedupe. El ÚNICO reset es una corrida \`success\` del Watchdog. Si lo cierras con el detector aún en rojo, el siguiente tick reabrirá la escalada.`,
              ].join('\n'), MODE_RED,
                `**Transición de modo.** El Watchdog ha pasado al modo «corre y FALLA» (${streak} corridas completadas en rojo, umbral K=${STREAK_K}) mientras esta escalada seguía abierta por otro modo. Un solo issue a propósito; esto declara el cambio de estado en vez de silenciarlo.`);
              return;
            }

            if (age <= STALE_MIN) return;

            core.warning(`Watchdog parado (${Math.round(age)} min). Intento revival via workflow_dispatch.`);
            try {
              await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: WF, ref: '__DEFAULT_BRANCH__' });
            } catch (e) { await escalate(DEAD_TITLE, deadBody(`el dispatch lanzó error: ${e.message}`), MODE_DEAD, DEAD_TRANSITION); return; }

            // Verificar que el run nace (hasta ~2 min). Si no, escalar.
            let revived = false;
            for (let i = 0; i < 8; i++) {
              await new Promise(r => setTimeout(r, 15000));
              if (await latestRunAgeMin() < STALE_MIN) { revived = true; break; }
            }
            if (revived) core.notice('Watchdog revivido por dispatch.');
            else await escalate(DEAD_TITLE, deadBody('el dispatch no produjo ningún run en 2 min.'), MODE_DEAD, DEAD_TRANSITION);

      - name: Digest de decisiones autónomas
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const MARKERS = ['<!-- autonomous-decision -->', '<!-- derived-decision -->'];
            const WINDOW_H = 26;   // ventana generosa; el dedupe por URL evita duplicados

            // 1. Localizar (o crear, idempotente) el issue-registro.
            let digest = null;
            const { data: regs } = await github.rest.issues.listForRepo({
              owner, repo, labels: 'registro-decisiones', state: 'open', per_page: 1 });
            if (regs.length) digest = regs[0];
            else {
              const { data: created } = await github.rest.issues.create({ owner, repo,
                title: 'Registro de decisiones autónomas (digest)',
                labels: ['registro-decisiones'],
                body: 'Digest mecánico de comentarios `<!-- autonomous-decision -->` y `<!-- derived-decision -->` de todo el repo, sincronizado por watchdog-heartbeat.yml. Veto asíncrono: revisar aquí, revertir en origen. No cerrar: el heartbeat lo recrearía.' });
              digest = created;
              core.notice(`Issue-registro creado: #${digest.number}`);
            }

            // 2. Comentarios recientes de TODO el repo (issues y PRs) con marcador.
            const since = new Date(Date.now() - WINDOW_H * 3600000).toISOString();
            const recent = await github.paginate(github.rest.issues.listCommentsForRepo,
              { owner, repo, since, per_page: 100 });
            const decisions = recent.filter(c =>
              MARKERS.some(m => (c.body || '').includes(m)) &&
              !(c.html_url || '').includes(`/issues/${digest.number}#`));
            if (!decisions.length) { core.info('Sin decisiones nuevas en la ventana.'); return; }

            // 3. Dedupe por URL contra lo ya registrado en el digest.
            const logged = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number: digest.number, per_page: 100 });
            const loggedText = logged.map(c => c.body || '').join('\n');
            const fresh = decisions.filter(c => !loggedText.includes(c.html_url));
            if (!fresh.length) { core.info('Todas las decisiones recientes ya registradas.'); return; }

            // 4. Un comentario-digest por corrida con las entradas nuevas.
            const lines = fresh.map(c => {
              const kind = (c.body || '').includes(MARKERS[0]) ? 'AUTONOMOUS' : 'DERIVED';
              const excerpt = (c.body || '').replace(/<!--[^>]*-->/g, '').trim()
                .replace(/\s+/g, ' ').slice(0, 300);
              return `- **[${kind}]** ${c.html_url}\n  > ${excerpt}…`;
            });
            await github.rest.issues.createComment({ owner, repo, issue_number: digest.number,
              body: `Sincronización ${new Date().toISOString().slice(0, 16)}Z — ${fresh.length} decisión(es) nueva(s):\n\n${lines.join('\n')}` });
            core.notice(`${fresh.length} decisiones añadidas al digest #${digest.number}.`);
