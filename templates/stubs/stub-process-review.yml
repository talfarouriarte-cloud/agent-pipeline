# STUB (agent-pipeline).
name: Process Reviewer
on:
  issues:
    types: [labeled]
permissions:
  contents: read
  issues: write
concurrency:
  group: process-reviewer
  cancel-in-progress: false
jobs:
  call:
    uses: talfarouriarte-cloud/agent-pipeline/.github/workflows/process-review.yml@main
    with:
      runner: ubuntu-latest
      default_branch: main
      # `process_max_turns` y `timeout_minutes` NO se pinean (AP-052), y desde
      # AP-060 son LESSON-BEARING declarados (80/35): presupuestos de sesión
      # calibrados por incidente, no verdad de instancia. Un template que copia
      # el default lo congela en el consumidor el día que el central lo mueve —
      # la máquina que produjo el pin 50 de finplan, y otra vez el pin 20 de su
      # stub de process-review (AP-060: 2 ciclos con anuncios `autonomous-
      # decision` muertos entre el anuncio y el commit). Píneálos solo eligiendo
      # otro valor a propósito, con anotación (motivo + AP); por debajo del
      # default el reusable emite `::notice` + tabla en el job summary.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      REVIEWER_GITHUB_TOKEN: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
