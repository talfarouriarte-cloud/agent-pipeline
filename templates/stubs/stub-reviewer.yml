# STUB (agent-pipeline). concurrency AQUÍ y con cancel-in-progress: false
# (obligatorio: un labeled espurio no puede matar una review en vuelo).
name: Opus Reviewer
on:
  pull_request:
    types: [opened, labeled]
permissions:
  contents: read
  pull-requests: write
  issues: write
concurrency:
  group: reviewer-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  call:
    uses: talfarouriarte-cloud/agent-pipeline/.github/workflows/reviewer.yml@main
    with:
      runner: ubuntu-latest
      # `reviewer_max_turns` y `timeout_minutes` NO se pinean (AP-052, repesca
      # finplan#1674): son inputs LESSON-BEARING — su default del central (80/22)
      # codifica una lección aprendida (AP-025), no una preferencia de instancia.
      # Este stub los pineaba a 50/15, los valores PREVIOS a esa lección: el fix
      # estaba desplegado en el central y no regía aquí, y costó 3 muertes del
      # Reviewer sin veredicto + 2 intervenciones humanas. Sin línea = rige el
      # default del central, y las lecciones futuras llegan solas.
      #
      # Desde AP-061 (repesca finplan#1704) el aviso ya no es lo único que pasa:
      # un pin POR DEBAJO del default **no rige** — el reusable toma
      # `max(pin, default)` y anota el desenlace (`[clamp→N]`). Motivo: con solo
      # el aviso de AP-052 la clase recurrió con otro parámetro y una línea más
      # abajo (`timeout_minutes: 15` vs 22), y la sesión murió a los 12m45s
      # emitiendo su propio `pin-divergente`. Un fix que hace VISIBLE la omisión
      # sin PREVENIRLA es parcial.
      #
      # Si tu repo NECESITA de verdad MENOS presupuesto (control de coste
      # deliberado), la palanca es `budget_pin_forzado: true` + el pin: honra el
      # valor bajo tu responsabilidad y la anotación pasa a `[pin forzado]`. La
      # regla de alta no cambia: pin CON anotación que diga por qué ESTE repo
      # pisa un input lesson-bearing (no solo por qué el valor es el que es) +
      # referencia AP y fecha. La anotación en sí nada la verifica — el reusable
      # recibe valores, nunca estos comentarios; lo que sí es mecánico es el
      # clamp. Un pin igual o por encima del default sigue siendo invisible.
      # Ver `MIGRATION.md` §4 para los límites exactos.
      agent_branch_prefix: claude/
      review_context: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      REVIEWER_GITHUB_TOKEN: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
