# STUB (agent-pipeline). Los nombres de workflows del pipeline de ESTE repo
# van en workflow_run Y en los inputs *_workflow_name (el detector compara).
name: Watchdog
on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]
  schedule:
    - cron: '*/20 * * * *'
  workflow_run:
    workflows: ["Claude Code", "Opus Reviewer", "Epic Merge"]
    types: [completed]
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write
  id-token: write
  statuses: write   # exigido por el job detect del reusable (espejo watchdog/turno, 2026-07-10)
concurrency:
  group: watchdog
  cancel-in-progress: false
jobs:
  call:
    uses: talfarouriarte-cloud/agent-pipeline/.github/workflows/watchdog.yml@main
    with:
      runner: ubuntu-latest
      default_branch: main
      ci_workflow_name: CI
      creator_workflow_name: Claude Code
      reviewer_workflow_name: Opus Reviewer
      epic_merge_workflow_name: Epic Merge
      extra_pipeline_workflows: ""
      epic_label: epica
      # `resolve_max_turns` y `lookback_min` NO se pinean (AP-052): replicaban
      # verbatim el default del central (40/45), presupuestos calibrados tras
      # incidentes, no verdad de instancia. Un template que copia el default lo
      # congela en el consumidor el día que el central lo mueve — la máquina que
      # produjo el pin 50 de finplan. Píneálos solo eligiendo otro valor a
      # propósito, con anotación (motivo).
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      REVIEWER_GITHUB_TOKEN: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
