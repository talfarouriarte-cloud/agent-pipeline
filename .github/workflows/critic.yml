# Critic — crítica del issue ANTES del arm (AP-113, 2026-10-12; AP-115: ADR entera en épicas)
#
# P0 del propietario: se perdía trabajo porque los defectos del encargo (deshacer
# decisiones ya tomadas, instrucciones indefinidas, contradicciones con ADR,
# falta de invariantes) se descubrían DESPUÉS del arm — enmiendas en vuelo,
# escalados, PRs descartados. Este rol los paga antes, con un comentario.
#
# Flujo: el Architect publica el issue con `critica:pendiente` y NO lo arma.
# Este reusable se dispara por el `labeled`, lee issue + ADR citadas +
# epic-context y publica UNA crítica por ronda (máx. 3, AP-119) con veredicto:
#   BLOQUEANTE → `critica:hallazgos` (ronda 3: `critica-na` y ARMA igual, AP-117)
#   LGTM       → `critica:lgtm` y ARMA al Creator (ping de confianza por PAT)
# AP-128 (central#359): las labels y el arm NO los pone la sesión, los
# materializa el post-step «Verificación de presencia del resultado» desde el
# marcador del veredicto (`vendored/scripts/critica.cjs`): labels en el issue y
# en los eslabones de `critica-cubre`, y re-emisión del arm que el gate retuvo
# (`arm-retenido`), también en épica.
# El Architect vigila solo las labels (tarea programada cada 5 min, ver
# vendored/docs-agents/architect.md § 7) y borra su tarea con `critica:lgtm`.
#
# Fuera del régimen serial: no produce PRs ni toma `serial-activo`. El guard
# serial lo ejerce el arm del Creator que este rol dispara, no este run.
# Mandato: vendored/docs-agents/critic.md (servido por el graft, AP-009).
name: Critic

# CALLABLE (agent-pipeline): trigger y concurrency en el stub
# (concurrency group critic-<issue>, cancel-in-progress: false).
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      default_branch:
        type: string
        default: main
      critic_model:
        type: string
        default: claude-opus-5-5
        # AP-112: la variable de repo/org `PIPELINE_CRITIC_MODEL` del CONSUMIDOR, si
        # existe y no está vacía, prevalece sobre este input en `claude_args`.
      critic_fallback_model:
        type: string
        default: claude-fable-5-1  # mismo par que el resto de roles; con precio en model-costs.json
      critic_max_turns:
        # 80 y no 40 (AP-117, finplan#2946 el primer día): la primera sesión real
        # murió en `error_max_turns` a los 40 con 2,6M tokens de caché leídos y
        # la crítica sin publicar. Va con la disciplina de lectura del mandato
        # (§ 1: cláusulas citadas, no volúmenes). Se calibra con los 10 primeros.
        type: number
        default: 80
      timeout_minutes:
        type: number
        default: 30  # AP-117: 20 → 30, acompaña al bump de turnos
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      REVIEWER_GITHUB_TOKEN:
        required: true

permissions:
  contents: read
  issues: write

jobs:
  critic:
    name: Crítica del issue
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    # Solo el `labeled` de `critica:pendiente`. `pause-agents` = hold humano.
    if: |
      github.event_name == 'issues'
      && github.event.label.name == 'critica:pendiente'
      && !contains(github.event.issue.labels.*.name, 'pause-agents')
    steps:
      - name: Checkout (registro de decisiones + docs de agentes)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.default_branch }}

      - name: Graft vendored (capa común servida desde el central — AP-009)
        uses: talfarouriarte-cloud/agent-pipeline/.github/actions/graft-vendored@main

      # Idempotencia y tope de rondas, DETERMINISTA (cero LLM): si el issue ya
      # tiene un marcador `critica: ronda=3`, el ciclo está cerrado; si tiene
      # `critica:lgtm`, ya pasó. En ambos casos el run sale verde sin sesión.
      - name: Ronda y gate
        id: ronda
        uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
        with:
          github-token: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
          script: |
            const O = { owner: context.repo.owner, repo: context.repo.repo };
            const num = context.payload.issue.number;
            const labels = (context.payload.issue.labels || []).map(l => l.name);
            if (labels.includes('critica:lgtm')) { core.notice('critica:lgtm ya presente: nada que hacer.'); core.setOutput('run', 'false'); return; }
            const cs = await github.paginate(github.rest.issues.listComments, { ...O, issue_number: num, per_page: 100 });
            const RE = /<!--\s*critica:\s*ronda=(\d)\s+veredicto=(bloqueante|lgtm)\s*-->/g;
            let maxRonda = 0;
            for (const c of cs) for (const m of (c.body || '').matchAll(RE)) maxRonda = Math.max(maxRonda, Number(m[1]));
            if (maxRonda >= 3) {
              core.notice(`ronda 3 ya publicada: ciclo cerrado. Sin sesión.`);
              core.setOutput('run', 'false'); return;
            }
            core.setOutput('run', 'true');
            core.setOutput('ronda', String(maxRonda + 1));
            core.info(`ronda ${maxRonda + 1}/3 sobre #${num}`);

      - name: Asegurar ~/.local/bin (instalador nativo de Claude Code)
        if: steps.ronda.outputs.run == 'true'
        run: mkdir -p "$HOME/.local/bin"

      - name: Run critic
        id: critic
        if: steps.ronda.outputs.run == 'true'
        # Pin a SHA completo (AP-085/AP-087): mismo pin que el resto de reusables.
        uses: anthropics/claude-code-action@8cf3482550831fb35a4fc3fbf7ca139cf8028b4c # v1.0.233
        env:
          # Blindaje OAuth-only: si OAuth Max falla, rojo en vez de facturar por API key.
          ANTHROPIC_API_KEY: ""
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "claude"
          # PAT: los comentarios salen con autoría del propietario ⇒ el marcador
          # del veredicto cuenta como de confianza para el post-step (AP-128).
          github_token: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
          claude_args: |
            --model ${{ vars.PIPELINE_CRITIC_MODEL || inputs.critic_model }}
            --fallback-model ${{ inputs.critic_fallback_model }}
            --effort high
            --max-turns ${{ inputs.critic_max_turns }}
            --allowedTools "Read,Glob,Grep,Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh api:*),Bash(ls:*),Bash(test:*)"
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: ${{ github.event.issue.number }}
            RONDA: ${{ steps.ronda.outputs.ronda }}/3
            RAMA POR DEFECTO: ${{ inputs.default_branch }}

            Eres el Critic del pipeline de agentes de este repo. Tu mandato
            completo está en `docs/agents/critic.md` (léelo ENTERO antes de
            nada; si existe `docs/agents/critic-annex.md`, también). Resumen
            vinculante:

            1. Lee el issue (`gh issue view ISSUE --comments`), las ADR que
               cita en el registro de decisiones del repo, la skill
               `epic-context-<ADR>` si existe, `docs/agents/protocol.md` y
               `docs/agents/creator.md`. Si lleva la label `epica`, lee también
               por `gh api` el body de cada eslabón de su cadena `launch-next`.
            2. Aplica la checklist A–I del mandato § 2 (en épica: J–N sobre la
               ADR, O y P sobre la cadena, y A–I sobre CADA eslabón). Un
               hallazgo sin ancla textual no existe. La ausencia del bloque de
               invariantes (A) es bloqueante SIEMPRE.
            3. Publica UN comentario (§ 3) con la cabecera
               `**Crítica · ronda RONDA/3 · <BLOQUEANTE|LGTM>**` y el marcador
               `<!-- critica: ronda=RONDA veredicto=bloqueante|lgtm -->` en
               línea propia. En épica, en línea propia también
               `<!-- critica-cubre: #<eslabón> #<eslabón> … -->` (en TODO
               veredicto). Con LGTM, o en ronda 3, una línea de talla pre por
               issue cubierto (§ 3, skill `talla-issue`). NO pongas labels:
               las pone el post-step desde tu marcador (AP-128).
            4. En ronda ≥ 2 (AP-119): relee tu crítica anterior. Cada hallazgo
               repetido lleva «(ronda N, sin resolver)»; cada uno nuevo, «(nuevo)»;
               lo resuelto se lista en una línea «Resueltos: …» y NO cuenta.
               Solo bloquean los «sin resolver» y los «nuevos».
               Si RONDA es 3 y el veredicto es BLOQUEANTE (AP-117): publica la
               crítica igual; el post-step pone `critica-na` y re-emite el arm
               con tus hallazgos sin resolver. Nunca `human-needed`.
            5. NUNCA armas (AP-128): el arm que el gate retuvo lo re-emite el
               post-step tras tu veredicto. No escribas la mención de arm en
               ningún texto; si tienes que nombrarla, escribe «arroba + claude».

            No edites el body, no cierres nada, no toques ADR, no abras PR.

      - name: Anotar el consumo LLM (model-usage, AP-099)
        if: always() && steps.critic.outcome != 'skipped' && steps.critic.outcome != 'cancelled'
        uses: actions/github-script@v7
        env:
          EXEC_FILE: ${{ steps.critic.outputs.execution_file }}
        with:
          script: |
            const fs = require('fs');
            const f = process.env.EXEC_FILE || `${process.env.RUNNER_TEMP || '/tmp'}/claude-execution-output.json`;
            let d = null;
            try { d = JSON.parse(fs.readFileSync(f, 'utf8')); } catch (e) { core.info(`execution file ilegible (${e.message}): sin dato.`); return; }
            const msgs = Array.isArray(d) ? d : (d ? [d] : []);
            const r = [...msgs].reverse().find(m => m && m.type === 'result') || null;
            const mu = r && r.modelUsage;
            if (!mu || typeof mu !== 'object' || Object.keys(mu).length === 0) { core.info('sin modelUsage con uso: sin dato.'); return; }
            const tok = Object.fromEntries(Object.entries(mu).map(([m, u]) => [m, {
              in: Number(u && u.inputTokens) || 0, out: Number(u && u.outputTokens) || 0,
              cr: Number(u && u.cacheReadInputTokens) || 0, cw: Number(u && u.cacheCreationInputTokens) || 0 }]));
            core.notice(`model-usage: ${JSON.stringify({ num_turns: r.num_turns, models: tok })}`);

      # El exit code del step de sesión MIENTE (finplan#1326): se verifica el
      # estado MATERIALIZADO. Sin marcador de esta ronda ⇒ la sesión murió sin
      # publicar. FAIL-OPEN (AP-117, decisión del propietario 2026-10-13: «prefiero
      # que siga la cadena a un human-needed que lo para todo»): se pone
      # `critica-na` con marcador `critica-no-realizada` y se ARMA al Creator. Se
      # pierde la crítica de ESTE issue, no la cadena; el marcador deja rastro
      # para la mensual (tasa de muertes del Critic = su propio criterio).
      # AP-128 (central#359): con marcador, este step es el DUEÑO de la
      # transición (antes la hacía la sesión por `gh api`, y a veces no:
      # asesoramiento#2985). Lógica en `scripts/critica.cjs` (grafteado):
      #   bloqueante r<3 ⇒ `critica:hallazgos`; bloqueante r3 ⇒ `critica-na` en el
      #   issue y en los `critica-cubre`; lgtm ⇒ `critica:lgtm` en el issue y en
      #   los `critica-cubre`; sin marcador ⇒ `critica-na` y, en `epica`, también
      #   en la cadena `launch-next` parseada del body.
      # Arm: tras lgtm o r3, re-emite el ÚLTIMO `arm-retenido` del gate sin arm
      # posterior (en línea propia), con su marcador de origen y
      # `arm-reemitido` (el Watchdog no lo cuenta como re-arm nuevo). Sin
      # `arm-retenido` ⇒ sin arm. Holds (`pause-agents`, `pausa-cola`,
      # `human-needed`) ⇒ labels sí, arm no. Banco: scripts/check-critica.mjs.
      - name: Verificación de presencia del resultado
        if: always() && steps.ronda.outputs.run == 'true'
        uses: actions/github-script@v7
        env:
          RONDA: ${{ steps.ronda.outputs.ronda }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
          script: |
            const O = { owner: context.repo.owner, repo: context.repo.repo };
            const num = context.payload.issue.number;
            const C = require(`${process.env.GITHUB_WORKSPACE}/scripts/critica.cjs`);
            const ronda = Number(process.env.RONDA);
            const cs = await github.paginate(github.rest.issues.listComments, { ...O, issue_number: num, per_page: 100 });
            // Labels frescas: las del payload son las del `labeled` que disparó el run.
            const { data: iss } = await github.rest.issues.get({ ...O, issue_number: num });
            const labels = (iss.labels || []).map(l => (typeof l === 'string' ? l : l.name));
            const v = C.leerVeredicto(cs, ronda);
            const plan = C.planLabels(v, ronda, labels);
            let cubiertos = v ? v.cubre.filter(n => n !== num) : [];
            if (!v) {
              core.warning(`ronda ${ronda}: la sesión terminó sin publicar su crítica — fail-open (AP-117).`);
              if (labels.includes('epica')) {
                try {
                  const r = await C.cadenaDesdeBody(iss.body, async n => (await github.rest.issues.get({ ...O, issue_number: n })).data.body);
                  cubiertos = r.eslabones;
                  if (!r.completa) core.notice(`cadena launch-next de #${num} incompleta (sin epic-audit): critica-na solo en ${cubiertos.length} eslabón(es) leídos.`);
                } catch (e) { cubiertos = []; core.notice(`cadena launch-next de #${num} ilegible (${e.message}): critica-na solo en la épica.`); }
              }
              await github.rest.issues.createComment({ ...O, issue_number: num,
                body: `**critic · post-step**: la sesión del Critic (ronda ${ronda}) terminó sin publicar su crítica ([run](${process.env.RUN_URL})). Fail-open (AP-117): \`critica-na\`${cubiertos.length ? ` (también en ${cubiertos.map(n => `#${n}`).join(', ')})` : ''} y arm al Creator sin crítica. Este issue NO ha sido criticado.\n\n<!-- critica-no-realizada: ronda=${ronda} -->` });
            } else core.info(`ronda ${ronda} materializada: ${v.veredicto} (${plan.caso}).`);
            for (const n of plan.issue.quitar) {
              try { await github.rest.issues.removeLabel({ ...O, issue_number: num, name: n }); } catch (e) { core.info(`removeLabel ${n}: ${e.message}`); }
            }
            if (plan.issue.poner.length) await github.rest.issues.addLabels({ ...O, issue_number: num, labels: plan.issue.poner });
            if (plan.cubiertos) for (const n of cubiertos) {
              for (const q of plan.cubiertos.quitar) {
                try { await github.rest.issues.removeLabel({ ...O, issue_number: n, name: q }); } catch (e) { /* no la tenía */ }
              }
              try { await github.rest.issues.addLabels({ ...O, issue_number: n, labels: plan.cubiertos.poner }); }
              catch (e) { core.warning(`#${n} (critica-cubre): no pude poner ${plan.cubiertos.poner.join(', ')} (${e.message}).`); }
            }
            if (!plan.arm) return;
            // AP-121: un ruling de la cola mensual solo lo arma la cola.
            if (labels.includes('mensual:aprobada')) { core.notice('mensual:aprobada: el arm es de self-mensual-queue (AP-121). Sin arm.'); return; }
            const ret = C.armRetenido(cs);
            if (v && !ret) { core.notice(`#${num}: sin arm-retenido vigente (crítica pedida por label o arm ya posterior): sin arm.`); return; }
            const hold = C.HOLDS.filter(n => labels.includes(n));
            if (hold.length) {
              await github.rest.issues.createComment({ ...O, issue_number: num,
                body: `**critic · post-step**: \`${plan.cierre}\` puesta; hold presente (${hold.map(h => `\`${h}\``).join(', ')}): sin arm. Quien retire el hold arma.` });
              core.notice(`hold presente (${hold.join(', ')}): ${plan.cierre} puesta, sin arm.`); return;
            }
            const hallazgos = plan.caso === 'ronda3' ? C.hallazgosAbiertos(v.comentario.body) : [];
            await github.rest.issues.createComment({ ...O, issue_number: num,
              body: C.textoReemision({ origen: ret ? ret.origen : 'manual', ronda, caso: plan.caso, hallazgos }) });
            core.notice(`#${num}: arm re-emitido (${plan.caso}, origen ${ret ? ret.origen : 'manual'}).`);
