# Process Reviewer — evaluación de proceso post-auditoría (2026-07-07)
#
# Se dispara al aplicarse la label `auditoria-completa` (2026-07-10: los
# issues de auditoría y las process-proposal quedan ABIERTOS como panel
# vivo de la épica hasta que el Architect limpia la cola al lanzar la
# épica siguiente — cerrados desaparecían de la vista y el humano no los
# leía; el trigger por `closed` habría disparado esta revisión en el
# momento equivocado). Lee el
# pipeline-map, las métricas de proceso de los últimos informes de auditoría
# y publica como máximo 2 issues `process-proposal` con evidencia y
# coste/riesgo — o comenta «Sin propuestas» en la auditoría.
#
# Separación de poderes: este agente PROPONE, nunca aplica. No modifica
# ficheros, no arma nada, y sus bodies JAMÁS contienen la mención de arm.
# El humano decide; docs los aplica el Architect; yml el humano.
name: Process Reviewer

# CALLABLE (agent-pipeline): trigger y concurrency en el stub
# (concurrency group process-reviewer, cancel-in-progress: false).
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      default_branch:
        type: string
        default: main
      process_model:
        type: string
        default: claude-fable-5
      process_fallback_model:
        type: string
        default: claude-opus-5
      process_max_turns:
        # LESSON-BEARING (AP-052): este default NO es una preferencia de
        # instancia — es una lección aprendida. Si lo cambias, actualiza EN EL
        # MISMO PR las otras TRES declaraciones: la tabla del step «Divergencia
        # pin↔default» (abajo), el bloque `lesson_bearing` de
        # templates/workflow-contracts.json, y el literal de cada expresión de
        # CLAMP donde se consume el input (AP-061). check-contracts exige
        # fidelidad de las cuatro.
        #
        # 80 y no 60 (AP-060). Linaje: 30 → 60 el 2026-07-09 al entrar el loop
        # de skills (ADR-212), tras morir en `error_max_turns` el run inaugural.
        # 60 → 80 al entrar el SWEEP de anuncios pendientes al paso 6 (AP-060),
        # que añade lecturas de las auditorías previas, verificación de árbol y
        # hasta 2 retomadas con su integridad post-commit. Regla del pipeline-map
        # (failure class mandate/budget drift): al ampliar un mandato, ampliar
        # herramientas Y presupuestos en el mismo cambio. Sólo se paga si se usa.
        type: number
        default: 80
      timeout_minutes:
        # LESSON-BEARING (AP-052) — ver nota de `process_max_turns`.
        #
        # 35 y no 20 (AP-060, repesca finplan#1703): 20 era el ÚNICO presupuesto
        # que NUNCA se auditó mientras el paso 6 crecía (publicar-antes-de-
        # commitear #1258 + integridad post-commit + evaluación de reverts).
        # Medido en el ciclo aud. finplan#1700: el run arrancó ~01:17Z y publicó
        # el anuncio `autonomous-decision` a las 01:36:50Z — 19.8 min de un
        # presupuesto de 20, o sea que los pasos 1-5 lo consumían ENTERO y el
        # trabajo de commit del paso 6 corría con cero headroom. Los dos replaces
        # anunciados jamás se commitearon. 35 = ~20 (medido, pasos 1-5) + ~8
        # (commits Git Data + integridad + edición de comentario) + ~7 (sweep).
        # A diferencia del bump de turns, éste ataca la causa MEDIDA.
        type: number
        default: 35
      budget_pin_forzado:
        # VÁLVULA del clamp de presupuesto (AP-061, repesca finplan#1704) —
        # gemela de la de `reviewer.yml`, misma semántica.
        #
        # Por defecto el reusable toma `max(pin, default)` en todo input
        # lesson-bearing: un `with:` que pinea por debajo ya no pisa la lección,
        # y la divergencia se sigue anotando como registro con su desenlace.
        # `true` honra el pin bajo responsabilidad del consumidor (control de
        # coste deliberado) — no apaga la anotación, la cambia a `[pin forzado]`.
        #
        # Instancia viva el día del merge: el stub de finplan pinea
        # `timeout_minutes: 20` (el valor PRE-AP-060, fichero congelado por
        # ADR-020) y con esto pasa a correr con los 35 que el central calibró.
        type: boolean
        default: false
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      REVIEWER_GITHUB_TOKEN:
        required: true

permissions:
  contents: read
  issues: write

jobs:
  review:
    name: Process review
    runs-on: ${{ inputs.runner }}
    # CLAMP de presupuesto (AP-061). `timeout-minutes` de JOB se resuelve antes
    # de que corra ningún step ⇒ el clamp va en la expresión, no en un step.
    # Forma canónica gateada por check-contracts (ver `reviewer.yml`).
    timeout-minutes: ${{ (inputs.budget_pin_forzado && inputs.timeout_minutes) || (inputs.timeout_minutes >= 35 && inputs.timeout_minutes) || 35 }}
    if: |
      github.event.label.name == 'auditoria-completa'
      && contains(github.event.issue.labels.*.name, 'auditoria')
      && !contains(github.event.issue.labels.*.name, 'pause-agents')
    steps:
      - name: Checkout (pipeline-map + docs de agentes)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.default_branch }}

      - name: Graft vendored (capa común servida desde el central — AP-009)
        uses: talfarouriarte-cloud/agent-pipeline/.github/actions/graft-vendored@main

      # finplan#1326 (2026-07-13): el grupo de concurrencia global con
      # cancel-in-progress:false ENCOLA un run por cada label de cualquier
      # issue del repo. Este guard hace idempotentes los duplicados: si el
      # panel ya tiene el marcador de resultado, el run sale verde sin
      # quemar sesión (skill quota-tokens).
      - name: Guard de idempotencia (¿revisión ya materializada?)
        id: idem
        env:
          GH_TOKEN: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
        run: |
          CUERPOS=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
               --paginate --jq '.[].body')
          # No usar `gh | grep -q` con pipefail: el SIGPIPE del primer match
          # da pipeline no-cero y un falso "no encontrado".
          if grep -q 'process-review-done' <<< "$CUERPOS"; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "::notice::El panel ya tiene revisión de proceso materializada (marcador presente) — run duplicado, salgo verde sin sesión."
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Divergencia pin↔default (AP-052; primer sujeto fuera de reviewer.yml) ─
      # AP-052 dejó este step declarado como extensión MECÁNICA a los demás
      # reusables, pero sin sujeto: «hoy ningún input de esos reusables tiene
      # lección declarada, así que sería un mecanismo sin sujeto». AP-060 crea el
      # sujeto — y con él la trampa que AP-052 modela: el stub de finplan pinea
      # `timeout_minutes: 20` (fichero congelado, territorio HUMANO por ADR-020),
      # que es EXACTAMENTE el valor pre-lección que este AP abandona. Sin este
      # step, subir el default a 35 en el central es un fix desplegado que no rige
      # en el consumidor donde se midió el fallo, y sin dejar rastro legible: la
      # máquina finplan#1674, reproducida.
      #
      # Determinista, cero LLM, cero coste marginal, cero labels. `continue-on-
      # error` + try/catch ⇒ fail-open total: el aviso jamás puede impedir una
      # revisión de proceso (un `if:` sin función de estado implica `success()`,
      # así que un throw aquí saltaría la sesión y los post-steps).
      - name: Divergencia pin↔default (inputs con lección AP — AP-052)
        id: pindiv
        if: steps.idem.outputs.done != 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          LESSON_BEARING: |
            [
              {"input": "process_max_turns", "default": 80, "ap": "AP-060", "leccion": "finplan#1700 — el sweep de anuncios pendientes amplía el mandato del paso 6; presupuesto y mandato se mueven juntos"},
              {"input": "timeout_minutes",   "default": 35, "ap": "AP-060", "leccion": "finplan#1700 — los pasos 1-5 consumían los 20 min ENTEROS (anuncio a 19.8 min) y el commit del paso 6 corría con cero headroom"}
            ]
          # `toJSON()` y no interpolación desnuda: emite `35` para un number y
          # `"claude-fable-5"` para un string. Con la interpolación a pelo, el
          # primer input lesson-bearing NO numérico produciría JSON inválido, el
          # `JSON.parse` de abajo lanzaría y el catch dejaría el aviso inerte para
          # TODOS los inputs del reusable. `check-contracts` exige esta forma.
          PINS_RECIBIDOS: |
            {
              "process_max_turns": ${{ toJSON(inputs.process_max_turns) }},
              "timeout_minutes": ${{ toJSON(inputs.timeout_minutes) }}
            }
          # Estado de la válvula (AP-061). Decide el DESENLACE que se anota, no
          # si se anota: una divergencia se registra siempre.
          FORZADO: ${{ toJSON(inputs.budget_pin_forzado) }}
        with:
          script: |
            try {
              const tabla = JSON.parse(process.env.LESSON_BEARING || '[]');
              const pins = JSON.parse(process.env.PINS_RECIBIDOS || '{}');
              // La válvula se lee CERRADA salvo `true` exacto (AP-061): el
              // desenlace anotado tiene que ser el que las expresiones de clamp
              // ejecutan de verdad, y ésas solo honran el pin con el booleano
              // puesto.
              let forzado = false;
              try { forzado = JSON.parse(process.env.FORZADO || 'false') === true; } catch { forzado = false; }
              const div = [];
              for (const e of tabla) {
                const got = pins[e.input];
                if (got === undefined || got === null || got === '') continue;
                const nGot = Number(got), nDef = Number(e.default);
                // Numérico ⇒ solo POR DEBAJO diverge: un pin por encima del
                // default es sobre-aprovisionamiento deliberado, no pérdida de
                // la lección (acota falsos positivos). No numérico ⇒ distinto.
                const esNum = Number.isFinite(nGot) && Number.isFinite(nDef);
                const diverge = esNum ? nGot < nDef : String(got) !== String(e.default);
                if (!diverge) continue;
                // `max(pin, default)` solo está definido sobre un tipo ORDENADO.
                // check-contracts exige que todo lesson-bearing sea numérico,
                // justo para que el clamp no prometa lo que no hace.
                const clampado = !forzado && esNum;
                div.push({ ...e, recibido: got, efectivo: clampado ? e.default : got, clampado });
              }
              if (!div.length) {
                core.info('AP-052: sin divergencia pin↔default en los inputs lesson-bearing.');
                core.setOutput('linea', '');
                core.setOutput('efecto', '');
                return;
              }
              // Formato fijo de AP-052 — `input=<recibido> (default central:
              // <def>, <AP>)` — con el DESENLACE de AP-061 detrás. El prefijo NO
              // se toca: lo citan el 5-whys del Auditor y los greps de la flota.
              const linea = 'pin-divergente: ' + div
                .map(d => `${d.input}=${d.recibido} (default central: ${d.default}, ${d.ap}) ${d.clampado ? `[clamp→${d.efectivo}]` : '[pin forzado]'}`)
                .join('; ');
              const hayForzado = div.some(d => !d.clampado);
              const cola = hayForzado
                ? `\`budget_pin_forzado\` HONRA el pin: este ciclo corre con el presupuesto PRE-lección, bajo responsabilidad del consumidor.`
                : `el reusable ELEVÓ el presupuesto al default del central (clamp AP-061): el pin no rige y la lección no se ha perdido. Retirar la línea del \`with:\` del stub apaga este aviso.`;
              const msg = `AP-052/AP-061 · ${linea} — ${cola} Los stubs son territorio HUMANO (ADR-020): ningún agente los edita.`;
              // Un clamp es operativa NORMAL (el pin no llegó a regir): `info`.
              // Un pin forzado sí es presupuesto pre-lección corriendo: `notice`.
              if (hayForzado) core.notice(msg); else core.info(msg);
              await core.summary
                .addHeading('Divergencia pin↔default (AP-052 · clamp AP-061)', 3)
                .addRaw(`El stub de este repo pinea ${div.length} input(s) *lesson-bearing* por debajo del default del central. Columna **Efectivo** = presupuesto con el que este job corre de verdad:`)
                .addTable([
                  [{ data: 'Input', header: true }, { data: 'Pin del stub', header: true }, { data: 'Default central', header: true }, { data: 'Efectivo', header: true }, { data: 'Desenlace', header: true }, { data: 'AP', header: true }, { data: 'Lección', header: true }],
                  ...div.map(d => [d.input, String(d.recibido), String(d.default), String(d.efectivo), d.clampado ? 'clamp ↑' : 'pin forzado', d.ap, d.leccion || '']),
                ])
                .addRaw('Los stubs son territorio humano (ADR-020): ningún agente los edita. Un presupuesto *lesson-bearing* no se pinea (se hereda); pinarlo por debajo exige `budget_pin_forzado: true` para que rija, y anotación con motivo y fecha — ver `MIGRATION.md` §A5.')
                .write();
              core.setOutput('linea', linea);
              core.setOutput('efecto', hayForzado ? 'forzado' : 'clamp');
            } catch (e) {
              // Fail-open: sin aviso, pero la revisión sigue. Nunca al revés.
              // El clamp NO depende de este step (vive en las expresiones de los
              // puntos de uso): aquí se pierde el REGISTRO, jamás la prevención.
              core.warning(`AP-052: comparación pin↔default no evaluable (${e.message}) — se continúa sin aviso.`);
              core.setOutput('linea', '');
              core.setOutput('efecto', '');
            }

      - name: Run process review
        if: steps.idem.outputs.done != 'true'
        uses: anthropics/claude-code-action@v1
        env:
          # Blindaje OAuth-only (mismo patrón que reviewer.yml): si OAuth Max
          # falla, el job da rojo en lugar de facturar por API key.
          ANTHROPIC_API_KEY: ""
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Los issues de auditoría los cierra el bot/PAT.
          allowed_bots: "claude"
          # PAT para que los issues creados salgan con autoría del usuario.
          # Sus bodies NUNCA llevan la mención de arm, así que no disparan nada.
          github_token: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
          claude_args: |
            --model ${{ inputs.process_model }}
            --fallback-model ${{ inputs.process_fallback_model }}
            # LESSON-BEARING: el linaje del valor (30 → 60 → 80) y la regla que
            # lo gobierna viven JUNTO al default, en el bloque `workflow_call`
            # de arriba — una segunda copia de la justificación aquí es la
            # deriva que AP-052 gatea. No la dupliques.
            # CLAMP AP-061 (forma canónica — ver el job `timeout-minutes`).
            --max-turns ${{ (inputs.budget_pin_forzado && inputs.process_max_turns) || (inputs.process_max_turns >= 80 && inputs.process_max_turns) || 80 }}
            --allowedTools "Read,Glob,Grep,Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue create:*),Bash(gh issue comment:*),Bash(gh api:*)"
          prompt: |
            REPO: ${{ github.repository }}
            AUDIT ISSUE: ${{ github.event.issue.number }}

            Eres el process-reviewer del pipeline de agentes de este repo.
            Tu única función: proponer mejoras de PROCESO (autonomía y
            eficiencia del loop de agentes) basadas en EVIDENCIA métrica.
            Jamás propones cambios de producto, modelo financiero o código
            de la aplicación.

            Protocolo:
            1. Lee `.claude/skills/pipeline-map/SKILL.md` (mapa del sistema
               y clases de fallo conocidas) y `docs/agents/protocol.md`.
            2. Con `gh issue list --label auditoria --state all --limit 4`
               y `gh issue view <n> --comments`, lee los informes de las
               últimas auditorías, en especial sus bloques
               «## Métricas de proceso» y «## Observaciones de proceso».
               `--state all`, no `closed`, por el MISMO motivo que el sweep
               6a: una auditoría cuyo ciclo murió puede seguir ABIERTA (el
               gate de co-presencia de marcadores no la auto-archiva), y son
               justo esos ciclos los que más tienen que decir sobre
               regresiones. Los dos pasos deben leer el MISMO conjunto: una
               métrica que no leíste no puede explicarte el anuncio que 6a te
               obliga a retomar.
            3. Compara métricas entre épicas. Busca REGRESIONES o fricciones
               repetidas (≥2 épicas): PRs/issue al alza, rondas de review al
               alza, stalls, intervenciones humanas que el sistema debería
               absorber, intervenciones repetidas del Watchdog por la misma
               causa.
            3b. REPESCAS = FIX OBLIGATORIO (2026-07-13, decisión del
               propietario). Lee el bloque «## Análisis de repescas (5 whys)»
               de las auditorías. Cada causa raíz de repesca (Watchdog,
               creator-muerto-sin-pr, re-arm humano) exige una propuesta de
               fix AUNQUE sea instancia única — el umbral de ≥2 épicas del
               paso 3 NO aplica aquí: una repesca es el fallback trabajando,
               y el fallback trabajando ES el failure del camino primario.
               El fix ataca la causa raíz del 5-whys (materializar la
               transición que faltó), no el síntoma. Si hay más causas raíz
               que el cap de issues del paso 5, prioriza repescas y lista
               las restantes en el comentario del issue de auditoría.
            4. Si NO hay regresión, ni patrón ≥2 épicas, NI repescas sin fix
               propuesto: comenta en el issue de auditoría exactamente
               `Sin propuestas.` con una línea de métricas comparadas, y
               termina. NO inventes mejoras para justificarte — un informe
               vacío es un resultado válido. El comentario TERMINA con DOS
               líneas de marcador: `<!-- process-proposals: 0 -->` y
               `<!-- process-review-done -->` (marcador que consume
               el fail-safe de presencia de este workflow; sin él, tu
               revisión consta como NO hecha — protocol.md).
            5. Si hay patrón: crea COMO MÁXIMO 2 issues (cap total), cada
               uno con: título `process-proposal · <resumen>`; el patrón con
               evidencia citada (issue/PR/métrica concretos, ≥2 épicas); la
               propuesta concreta (qué doc/hook/workflow cambiaría y cómo);
               coste y riesgo (incluido el riesgo de la interacción con el
               resto del pipeline — revisa «Known failure classes» del
               pipeline-map); y a quién toca aplicarla.
               **ROUTING POR EJE (2026-07-14, decisión del propietario —
               la cola vive donde se arregla):**
               - Si el fix cambiaría ficheros de `agent-pipeline` (mandatos
                 `vendored/`, hooks, workflows reusables, composite actions,
                 templates, guards/post-steps): la propuesta va AL CENTRAL —
                 `gh issue create --repo talfarouriarte-cloud/agent-pipeline
                 --label process-proposal`, y el body EMPIEZA con
                 `Origen: <repo>#<auditoría>` (enlace a la evidencia; el
                 cierre cross-repo lo usará) seguido de `@claude` en su
                 propia línea — **el issue nace ARMADO** (2026-07-15,
                 decisión del propietario): su Creator lo ejecuta al
                 instante, o el guard serial lo encola (`en-cola`) si hay
                 serie ocupada y el merge humano armará el siguiente (FIFO).
               - Si el fix cambiaría ficheros de ESTE repo (annexes, docs
                 locales, `ci.yml` propio, skills del repo, dominio): issue
                 LOCAL (`gh issue create --label process-proposal`), también
                 con `@claude` en su propia línea al inicio del body — nace
                 ARMADO igual; mismo régimen de cola serial.
               - Si el create cross-repo FALLA (403/404: token sin alcance),
                 NO lo pierdas en silencio: créala LOCAL con el prefijo
                 `[PARA-CENTRAL]` en el título y anota el fallo en el
                 comentario del issue de auditoría.
               Después comenta en el issue de auditoría la lista de
               propuestas creadas CON SU DESTINO (central/local); ese
               comentario TERMINA con DOS líneas de marcador:
               `<!-- process-proposals: N -->` (N = propuestas escindidas,
               links en el cuerpo) y `<!-- process-review-done -->`
               (mismo marcador y motivo que en el paso 4).

            6. LOOP DE SKILLS (ADR-212 — lee el ADR antes de editar).
               ENTRAS a este paso SOLO con los comentarios de (4-5) YA
               publicados (propuesta #1258: publicar antes de commitear —
               una muerte de sesión aquí no puede dejar la auditoría sin
               revisión de proceso visible).

            6a. SWEEP DE ANUNCIOS PENDIENTES — **PRIMERA operación al entrar
               al paso 6, ANTES de evaluar ninguna edición nueva** (AP-060,
               repesca finplan#1703). El orden publicar-antes-de-commitear
               hace el estado INOCUO (un anuncio sin ejecutar es visible), pero
               NO auto-sanante: si la sesión emisora muere entre el anuncio y
               el commit, el anuncio queda SIN DUEÑO y decae en silencio.
               Ocurrió en 2 ciclos consecutivos (skill-edit
               `fixture-separa-perimetros` anunciada en aud. finplan#1681 y
               jamás commiteada; DOS replaces anunciados con diff completo en
               aud. finplan#1700 —comentario 2026-07-28T01:36:50Z— y jamás
               commiteados). Misma doctrina que AP-036/AP-046: **materializar
               en el ciclo siguiente, con dueño, la transición que faltó** — el
               anuncio deja de depender de la vida de su sesión emisora.

               - **Localiza.** `gh issue list --label auditoria --state all
                 --limit 4` (`--state all`, no `closed`: una auditoría cuyo
                 ciclo murió puede seguir ABIERTA) y, con
                 `gh issue view <n> --comments`, busca en los 2-3 ciclos
                 previos —NO en el panel que revisas ahora— los comentarios
                 terminados en `<!-- autonomous-decision -->` que anuncien una
                 skill-edit. **PENDIENTE := ni SHA de commit ni
                 `<!-- skill-edit-caducado -->` en el cuerpo del comentario.**
                 El ESTADO pendiente no estrena vocabulario: se DERIVA de la
                 ausencia de SHA, la via negativa de #1258 («un anuncio sin
                 SHA final = edición no ejecutada»). El marcador de la salida
                 (c) sí es vocabulario nuevo, y por eso está registrado en la
                 tabla de `docs/agents/protocol.md` (AP-060, append-only).
               - **Verifica el ÁRBOL antes de nada** (mitigación de la
                 doble-ejecución si dos ciclos retoman el mismo anuncio): lee
                 con `gh api` el fichero de la skill en la rama por defecto y
                 comprueba si el marcador `<!-- skill-edit: <tipo> <fecha> -->`
                 del anuncio YA está presente.
                 - **Presente ⇒ ya ejecutado, NO commitees.** Localiza el
                   commit (`gh api "repos/<repo>/commits?path=<fichero>"`,
                   mensaje `skill(loop):`) y edita el comentario ORIGINAL
                   añadiendo su SHA. El anuncio deja de estar pendiente sin
                   consumir cap.
                 - **Ausente ⇒ decide y materializa** (dos salidas, ninguna es
                   «dejarlo estar»):
                   (a) **Evidencia vigente ⇒ ejecútalo VERBATIM.** El diff
                   intendido ya pasó su ventana de veto asíncrono al ser
                   publicado; **cero diseño nuevo** — no lo reformules, no lo
                   «mejores», no lo re-anuncies como propio. Commit vía Git
                   Data con el mensaje y el marcador del anuncio original, la
                   MISMA verificación de integridad post-commit que exige 6b, y
                   después edita el comentario ORIGINAL con el SHA.
                   (b) **Evidencia caducada ⇒ decláralo caducado con
                   racional.** Caducidad = el tipo que atacaba ya no recurre
                   según el bloque del Auditor, o la sección destino cambió y
                   el diff verbatim ya no aplica. Edita el comentario ORIGINAL
                   añadiendo el racional y la línea
                   `<!-- skill-edit-caducado -->`.
               - **Reporta en el panel que revisas AHORA** un comentario con
                 el enlace a cada anuncio retomado, su desenlace (SHA ejecutado
                 / caducado + racional) y la evidencia, terminado en
                 `<!-- autonomous-decision -->`. Sin este reporte la repesca es
                 invisible para el 5-whys del Auditor.
                 **El reporte lleva, POR CADA retomada, la MISMA marca que su
                 desenlace puso en el comentario original: el SHA cuando se
                 ejecutó o se anotó, y `<!-- skill-edit-caducado -->` cuando se
                 declaró caducidad.** El reporte es él mismo un comentario
                 terminado en `<!-- autonomous-decision -->` que enlaza
                 skill-edits: sin esas marcas, el sweep del ciclo siguiente lo
                 clasificaría como PENDIENTE por la definición literal y
                 re-abriría decisiones ya cerradas. Queda fuera del conjunto
                 pendiente por la MISMA regla que todo lo demás, no por una
                 excepción que haya que recordar.
               - **Cap COMPARTIDO y con prioridad.** Las retomadas consumen del
                 mismo cap de 2 ediciones/época que las nuevas, y van PRIMERO:
                 una retomada es una decisión ya tomada y ya vetable, una
                 edición nueva es diseño sin rodar. Si las retomadas agotan el
                 cap, no hay ediciones nuevas este ciclo — dilo en el reporte.
                 Anotar un SHA (caso «ya ejecutado») y declarar una caducidad
                 NO consumen cap: no tocan el árbol.

            6b. EDICIONES NUEVAS. Con el sweep cerrado, evalúa el bloque
               «## Patrones de fallo del Creator» de las auditorías:
               - Si un TIPO de hallazgo recurre (≥3 en la épica o ≥2 épicas),
                 puedes ejecutar hasta 2 EDICIONES DE SKILL por épica,
                 EXCLUSIVAMENTE dentro de la sección
                 «## Heurísticas aprendidas (loop)» de las skills entrenables
                 listadas en ADR-212. Operaciones add/delete/replace acotadas;
                 cada add paga contexto del Creator: prefiere delete/replace.
               - ORDEN OBLIGATORIO (2026-07-12, propuesta #1258 — el run
                 29139108015 commiteó y murió sin publicar NADA: veto
                 asíncrono puenteado en silencio). PRIMERO publica en el
                 issue de auditoría el comentario con el diff INTENDIDO, el
                 tipo que ataca y la evidencia citada, terminado en
                 `<!-- autonomous-decision -->`. DESPUÉS ejecuta el commit
                 vía Git Data (gh api, sobre la rama por defecto, mensaje
                 `skill(loop): <tipo> — <resumen>`) con el marcador
                 `<!-- skill-edit: <tipo> <fecha> -->` en cada línea
                 añadida/sustituida. AL FINAL edita el comentario para
                 añadir el SHA del commit. Via negativa: si mueres entre
                 comentario y commit queda un anuncio sin ejecutar (visible,
                 inocuo — un anuncio sin SHA final = edición no ejecutada);
                 el orden inverso deja un commit sin anuncio (invisible,
                 sin veto posible). Ese anuncio huérfano YA NO decae en
                 silencio: tiene dueño nombrado — el sweep 6a del ciclo
                 siguiente lo retoma o lo declara caducado (AP-060). Escribe
                 el anuncio pensando en ESE lector: diff completo, fichero
                 destino y marcador explícitos, ejecutables verbatim sin tu
                 contexto de sesión.
               - INTEGRIDAD POST-COMMIT (misma propuesta — el commit
                 de3ada2f corrompió un carácter FUERA de la sección loop,
                 mojibake UTF-8): tras commitear, baja el diff del commit
                 contra su parent (gh api) y verifica que SOLO toca líneas
                 dentro de «## Heurísticas aprendidas (loop)». Si toca
                 CUALQUIER otra cosa: revierte el commit (Git Data, mismo
                 mecanismo) y repórtalo en el comentario.
               - REVERT por defecto: si una edición previa (marcador con ≥2
                 épicas) tiene su tipo aún recurriendo según el bloque del
                 Auditor, reviértela igual (commit + autonomous-decision).
               - Si el clúster no tiene casa en ninguna skill (test
                 single-home) y lleva ≥2 épicas: NO crees la skill tú —
                 emite un `process-proposal` de creación con la descripción
                 de disparo propuesta (el alta exige pipeline-map, que te
                 está vetado).

            Reglas duras:
            - PROHIBIDO escribir la mención de arm (arroba+claude) en
              cualquier body o comentario que publiques.
            - PROHIBIDO modificar cualquier fichero FUERA de las secciones
              «## Heurísticas aprendidas (loop)» de las skills entrenables
              de ADR-212 (jamás docs, workflows, pipeline-map, protocol.md,
              ni el resto de una skill): fuera de ese perímetro propones, el
              humano decide, otros aplican.
            - Máximo 2 propuestas y 2 skill-edits. El cap de skill-edits es
              TOTAL y COMPARTIDO entre retomadas del sweep (6a) y ediciones
              nuevas (6b), con prioridad para las retomadas. Sin evidencia ⇒
              nada.

      # finplan#1326 (2026-07-13, sustituye al `if: failure()` de #1258):
      # el exit code del step de sesión MIENTE. Verificado en 4 paneles de
      # 2 repos (finplan #1302/#1305/#1312, wmcb #27): la sesión muere en
      # 1 turno (<1s, coste 0, `is_error: true` en el JSON de ejecución) y
      # la action sale 0 ⇒ `failure()` nunca dispara. El timeout del job
      # tampoco: la cancelación deja `failure()` en false (run 29257318998).
      # Cierre: verificar el estado MATERIALIZADO (marcador en el panel),
      # no el exit code — mismo principio que agent-pipeline#12 aplicó al
      # post-step del Auditor. `always()` corre en éxito, fallo y
      # cancelación por timeout.
      - name: Verificación de presencia del resultado
        if: always() && steps.idem.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # El timeout EFECTIVO (post-clamp AP-061), no el pin recibido: este
          # valor se imprime en el comentario de escalada, y anunciar ahí un
          # presupuesto que no fue el que corrió desvía el diagnóstico.
          TIMEOUT_MIN: ${{ (inputs.budget_pin_forzado && inputs.timeout_minutes) || (inputs.timeout_minutes >= 35 && inputs.timeout_minutes) || 35 }}
          # Divergencia pin↔default ya calculada por el step determinista de
          # arriba (AP-052/AP-060). Cadena vacía si no hay divergencia o si el
          # step falló (continue-on-error). Se cita SOLO aquí — el momento
          # exacto en que el humano o el 5-whys del Auditor tienen que decidir
          # algo — para que el pin culpable viaje en el MISMO comentario que
          # pide actuar, en vez de exigir arqueología entre repos.
          PIN_DIVERGENTE: ${{ steps.pindiv.outputs.linea }}
          # Desenlace del pin (AP-061): `clamp` | `forzado` | ''. Con clamp el
          # pin NO rigió, así que señalarlo como sospechoso sería una atribución
          # FALSA en el comentario que pide actuar — peor que ninguna.
          PIN_EFECTO: ${{ steps.pindiv.outputs.efecto }}
        run: |
          CUERPOS=$(gh api "repos/${REPO}/issues/${ISSUE}/comments" \
               --paginate --jq '.[].body')
          if grep -q 'process-review-done' <<< "$CUERPOS"; then
            echo "::notice::Revisión de proceso materializada en el panel (marcador presente)."
            exit 0
          fi
          # Sin marcador: la revisión NO ocurrió, terminara como terminara
          # el step de sesión. Diagnóstico desde el JSON de ejecución si
          # sobrevive en el runner (muertes instantáneas: is_error/num_turns).
          DIAG="sin JSON de ejecución (sesión no arrancó o timeout del job)"
          EXEC="${RUNNER_TEMP}/claude-execution-output.json"
          if [ -f "$EXEC" ]; then
            DIAG=$(python3 -c "import json; d=json.load(open('${EXEC}')); d=d[-1] if isinstance(d,list) else d; print('is_error=%s num_turns=%s duration_ms=%s cost=%s' % (d.get('is_error'), d.get('num_turns'), d.get('duration_ms'), d.get('total_cost_usd')))" 2>/dev/null || echo "JSON de ejecución ilegible")
          fi
          # El pin culpable, si lo hay, como línea propia (formato fijo AP-052:
          # `pin-divergente: <input>=<recibido> (default central: <def>, <AP>)`).
          # Vacío ⇒ no se imprime nada: sin párrafo huérfano.
          # Separador por DELANTE, jamás por detrás: `$(...)` come los saltos de
          # línea FINALES, así que un `printf '%s\n\n'` aquí pegaría este párrafo
          # con el siguiente (verificado en dry-run). Los iniciales sobreviven.
          PIN_LINEA=""
          if [ -n "${PIN_DIVERGENTE}" ]; then
            # AP-061: la atribución depende del DESENLACE. Con clamp el pin no
            # rigió y decirlo importa — el presupuesto que corrió (${TIMEOUT_MIN})
            # ya es el post-lección, así que el sospechoso es otro.
            if [ "${PIN_EFECTO}" = "forzado" ]; then
              PIN_COLA="\`budget_pin_forzado: true\` HONRA el pin, así que este ciclo corrió con el presupuesto PRE-lección. Si el diagnóstico de arriba es muerte por presupuesto (timeout del job a ${TIMEOUT_MIN} min, o \`error_max_turns\`), ése es el primer sospechoso."
            else
              PIN_COLA="el reusable elevó el presupuesto al default del central (clamp AP-061), así que este ciclo corrió con ${TIMEOUT_MIN} min y el pin **no** explica la muerte. Retirar la línea del \`with:\` del stub apaga este aviso."
            fi
            PIN_LINEA=$(printf '\n\n%s' "\`${PIN_DIVERGENTE}\` — el stub de este repo pinea por debajo un default *lesson-bearing* del central: ${PIN_COLA} Los stubs son territorio HUMANO (ADR-020): ningún agente los edita.")
          fi
          BODY=$(printf '%s%s\n\n%s\n\n%s' \
            "**process-review · resultado AUSENTE** — el run terminó sin materializar la revisión de proceso en este panel (ningún comentario con el marcador de resultado). Diagnóstico: ${DIAG}. Run: ${RUN_URL}." \
            "${PIN_LINEA}" \
            "Re-arme: retirar y re-aplicar \`auditoria-completa\` (con PAT — los eventos del token default no disparan workflows). Precaución antes del siguiente ciclo: puede haber efectos parciales sin publicar (commits \`skill(loop):\` en la rama por defecto posteriores a la última auditoría)." \
            "<!-- process-review-pendiente -->")
          gh issue comment "${ISSUE}" --repo "${REPO}" --body "$BODY"
          gh api -X POST "repos/${REPO}/issues/${ISSUE}/labels" -f "labels[]=process-review-pendiente"
          echo "::error::Revisión de proceso NO materializada — panel marcado process-review-pendiente."
          exit 1

      - name: Auto-archivo del panel de auditoría (2026-07-14, wmcb#53)
        # El issue de auditoría es un ACTA: con el ciclo completo, mantenerlo
        # abierto es un gate que no decide nada (las decisiones humanas viven
        # en los process-proposal escindidos, que NO se auto-cierran). Cierre
        # determinista por CO-PRESENCIA de marcadores: audit-verdict (Auditor)
        # + process-proposals (process-reviewer). Sin ambos, queda abierto —
        # el fallo silencioso clase wmcb#27 (pase omitido) se vuelve VISIBLE.
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const n = context.payload.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: n, per_page: 100 });
            const all = comments.map(c => c.body || '').join('\n');
            const hasVerdict = /<!--\s*audit-verdict:\s*(clean|findings)\s*-->/.test(all);
            const hasReview = /<!--\s*process-proposals:\s*\d+\s*-->/.test(all);
            if (!hasVerdict || !hasReview) {
              core.notice(`auditoría #${n}: ciclo incompleto (verdict=${hasVerdict}, review=${hasReview}) — queda abierta señalando la anomalía.`);
              return;
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number: n, labels: ['auto-archivada'] });
            await github.rest.issues.update({ owner, repo, issue_number: n, state: 'closed', state_reason: 'completed' });
            core.notice(`auditoría #${n}: ciclo completo — auto-archivada.`);
