# Process Reviewer — evaluación de proceso post-auditoría (2026-07-07)
#
# Se dispara al aplicarse la label `auditoria-completa` (2026-07-10: los
# issues de auditoría y las process-proposal quedan ABIERTOS como panel
# vivo de la épica hasta que el Architect limpia la cola al lanzar la
# épica siguiente — cerrados desaparecían de la vista y el humano no los
# leía; el trigger por `closed` habría disparado esta revisión en el
# momento equivocado). AP-098: la limpieza de cola YA NO hace falta para
# armar (guard: panel consumido = `audit-verdict`) y un panel cerrado sin
# `process-review-done` SIGUE pendiente: el selector lo mete en su lote.
# Lee el
# pipeline-map, las métricas de proceso de los últimos informes de auditoría
# y publica como máximo 2 issues `process-proposal` con evidencia y
# coste/riesgo — o comenta «Sin propuestas» en la auditoría.
#
# AP-098 (central#279, ruling mensual 2026-09-30): POR LOTES. El step
# determinista «Selector de lote» decide si hay sesión y sobre qué paneles:
# lote = TODAS las auditorías con `audit-verdict` y sin `process-review-done`
# del repo, cuando se cumple lo primero de «10 pendientes» o «14 días desde
# la última revisión de lote». Bypass P0: un panel con `audit-p0` se revisa
# EN EL ACTO y solo él. Eventos: `labeled` (`auditoria-completa`: P0 o tick
# de lote), `schedule` (cron diario del stub: tick de lote + P0 rezagados) y
# `workflow_dispatch` (lote forzado sobre lo pendiente). Sin nada que hacer,
# el run sale verde SIN sesión.
#
# Separación de poderes: este agente PROPONE, nunca aplica. No modifica
# ficheros, no arma nada, y sus bodies JAMÁS contienen la mención de arm.
# El humano decide; docs los aplica el Architect; yml el humano.
name: Process Reviewer

# CALLABLE (agent-pipeline): trigger y concurrency en el stub
# (concurrency group process-reviewer, cancel-in-progress: false).
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      default_branch:
        type: string
        default: main
      process_model:
        type: string
        default: claude-fable-5-1  # AP-088 (2026-09-28): antes claude-fable-5
      process_fallback_model:
        type: string
        default: claude-opus-5-5  # AP-088: antes claude-opus-5
      process_max_turns:
        # LESSON-BEARING (AP-052): este default NO es una preferencia de
        # instancia — es una lección aprendida. Si lo cambias, actualiza EN EL
        # MISMO PR las otras TRES declaraciones: la tabla del step «Divergencia
        # pin↔default» (abajo), el bloque `lesson_bearing` de
        # templates/workflow-contracts.json, y el literal de cada expresión de
        # CLAMP donde se consume el input (AP-061). check-contracts exige
        # fidelidad de las cuatro.
        #
        # 80 y no 60 (AP-060). Linaje: 30 → 60 el 2026-07-09 al entrar el loop
        # de skills (ADR-212), tras morir en `error_max_turns` el run inaugural.
        # 60 → 80 al entrar el SWEEP de anuncios pendientes al paso 6 (AP-060),
        # que añade lecturas de las auditorías previas, verificación de árbol y
        # hasta 2 retomadas con su integridad post-commit. Regla del pipeline-map
        # (failure class mandate/budget drift): al ampliar un mandato, ampliar
        # herramientas Y presupuestos en el mismo cambio. Sólo se paga si se usa.
        #
        # 120 y no 80 (AP-098, central#279): el mandato pasa de UN panel a un
        # LOTE de hasta ~10+ paneles por sesión (leer cada uno, un comentario de
        # resultado por panel, dedupe por eje en el central, cap 3+2). Misma
        # regla: mandato y presupuesto en el mismo cambio. Calibración a medir
        # en octubre (criterio falsable de AP-098).
        type: number
        default: 120
      timeout_minutes:
        # LESSON-BEARING (AP-052) — ver nota de `process_max_turns`.
        #
        # 35 y no 20 (AP-060, repesca finplan#1703): 20 era el ÚNICO presupuesto
        # que NUNCA se auditó mientras el paso 6 crecía (publicar-antes-de-
        # commitear #1258 + integridad post-commit + evaluación de reverts).
        # Medido en el ciclo aud. finplan#1700: el run arrancó ~01:17Z y publicó
        # el anuncio `autonomous-decision` a las 01:36:50Z — 19.8 min de un
        # presupuesto de 20, o sea que los pasos 1-5 lo consumían ENTERO y el
        # trabajo de commit del paso 6 corría con cero headroom. Los dos replaces
        # anunciados jamás se commitearon. 35 = ~20 (medido, pasos 1-5) + ~8
        # (commits Git Data + integridad + edición de comentario) + ~7 (sweep).
        # A diferencia del bump de turns, éste ataca la causa MEDIDA.
        #
        # 60 y no 35 (AP-098, central#279): los pasos 1-5 consumían ~20 min con
        # UN panel; el lote multiplica lecturas y comentarios de resultado. Un
        # timeout muerto a mitad de lote deja N paneles `process-review-
        # pendiente` a la vez. Estimación, no medida: se re-calibra con los
        # runs de octubre.
        type: number
        default: 60
      budget_pin_forzado:
        # VÁLVULA del clamp de presupuesto (AP-061, repesca finplan#1704) —
        # gemela de la de `reviewer.yml`, misma semántica.
        #
        # Por defecto el reusable toma `max(pin, default)` en todo input
        # lesson-bearing: un `with:` que pinea por debajo ya no pisa la lección,
        # y la divergencia se sigue anotando como registro con su desenlace.
        # `true` honra el pin bajo responsabilidad del consumidor (control de
        # coste deliberado) — no apaga la anotación, la cambia a `[pin forzado]`.
        #
        # Instancia viva el día del merge: el stub de finplan pinea
        # `timeout_minutes: 20` (el valor PRE-AP-060, fichero congelado por
        # ADR-020) y con esto pasa a correr con los 35 que el central calibró.
        type: boolean
        default: false
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      REVIEWER_GITHUB_TOKEN:
        required: true

permissions:
  contents: read
  issues: write

jobs:
  review:
    name: Process review
    runs-on: ${{ inputs.runner }}
    # CLAMP de presupuesto (AP-061). `timeout-minutes` de JOB se resuelve antes
    # de que corra ningún step ⇒ el clamp va en la expresión, no en un step.
    # Forma canónica gateada por check-contracts (ver `reviewer.yml`).
    timeout-minutes: ${{ (inputs.budget_pin_forzado && inputs.timeout_minutes) || (inputs.timeout_minutes >= 60 && inputs.timeout_minutes) || 60 }}
    # AP-098: además del `labeled`, el cron diario y el dispatch del stub. Sin
    # issue en el payload (`schedule`/`workflow_dispatch`) el `contains` sobre
    # labels da false: la pausa por panel la aplica el selector.
    if: |
      (
        (github.event_name == 'issues'
         && github.event.label.name == 'auditoria-completa'
         && contains(github.event.issue.labels.*.name, 'auditoria'))
        || github.event_name == 'schedule'
        || github.event_name == 'workflow_dispatch'
      )
      && !contains(github.event.issue.labels.*.name, 'pause-agents')
    steps:
      - name: Checkout (pipeline-map + docs de agentes)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.default_branch }}

      - name: Graft vendored (capa común servida desde el central — AP-009)
        uses: talfarouriarte-cloud/agent-pipeline/.github/actions/graft-vendored@main

      # finplan#1326 (2026-07-13): el grupo de concurrencia global con
      # cancel-in-progress:false ENCOLA un run por cada label de cualquier
      # issue del repo. La idempotencia (panel con marcador de resultado ⇒
      # salir verde sin sesión, skill quota-tokens) vive ahora DENTRO del
      # selector: un panel ya revisado nunca es pendiente.
      #
      # SELECTOR DE LOTE (AP-098, central#279). Determinista, cero LLM. Decide
      # `modo` ∈ {p0, lote, nada} y la lista de `paneles` de la sesión:
      #  - pendiente := auditoría con `audit-verdict` y SIN `process-review-
      #    done` (y sin `pause-agents`), ABIERTA o CERRADA. Cerrada cuenta
      #    (review #293 §2): la limpieza de cola del Architect al lanzar la
      #    épica siguiente cierra paneles antes de su lote, y sin esto su
      #    revisión de proceso desaparecería en silencio (clase wmcb#27).
      #    Excepciones: `state_reason: not_planned` (duplicados
      #    `audit-dup-closed` de epic-merge) y veredictos anteriores al corte
      #    AP-098 (bajo el régimen inmediato previo, un cierre sin marcador
      #    ya dejó rastro `process-review-pendiente`). Las cerradas se leen con
      #    `since` = hace 30 días.
      #  - P0 := panel con `<!-- audit-p0 -->` (admite `: <causa>`; lo publica el
      #    Auditor por `gh api` junto a su veredicto; el post-step de `claude-code.yml` lo materializa por
      #    estado si el panel lleva `human-needed`/`needs-human`) o, como
      #    cinturón, con esas labels vigentes.
      #  - `labeled`: panel ya revisado ⇒ nada; P0 ⇒ SOLO ese panel, en el acto;
      #    si no, el evento cuenta como tick de lote.
      #  - tick de lote (labeled no-P0 y `schedule`): lote si pendientes ≥ 10 o
      #    si hay ≥1 pendiente y han pasado ≥ 14 días desde la última revisión
      #    de lote (último `process-review-done` sobre un panel NO-P0; sin
      #    ninguna, cuenta desde el `audit-verdict` pendiente más antiguo). Sin
      #    lote, CUALQUIER tick recoge los P0 pendientes rezagados (revisión
      #    inmediata que murió, o cuyo run pendiente canceló otro en la cola de
      #    concurrencia — review #293 §3): solo esos.
      #  - `workflow_dispatch`: lote forzado con lo pendiente (≥1).
      # Banco: scripts/check-process-review-lote.mjs (ejecuta ESTE script).
      # Fail-closed: si la API no responde, `nada` + run rojo — jamás una
      # sesión sobre una foto que no se pudo leer.
      - name: Selector de lote (AP-098)
        id: lote
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const N_LOTE = 10, DIAS_LOTE = 14, DIA = 24 * 3600 * 1000;
            // Corte AP-098: veredictos anteriores vivieron el régimen inmediato;
            // una cerrada de entonces sin marcador no es pendiente de lote.
            const CORTE = Date.parse('2026-09-30T00:00:00Z');
            const RE_VERDICT = /<!--\s*audit-verdict:\s*(clean|findings)\s*-->/;
            const RE_DONE = /<!--\s*process-review-done\s*-->/;
            const RE_P0 = /<!--\s*audit-p0(?::[^>]*)?\s*-->/;
            const LABELS_P0 = ['human-needed', 'needs-human'];
            const evento = context.eventName;
            const trigger = evento === 'issues' && context.payload.issue ? context.payload.issue.number : null;
            const fin = (modo, nums, motivo) => {
              core.setOutput('modo', modo);
              core.setOutput('paneles', nums.join(' '));
              core.setOutput('motivo', motivo);
              core.notice(`process-review · modo=${modo}${nums.length ? ` · paneles ${nums.map(n => '#' + n).join(' ')}` : ''} — ${motivo}`);
            };
            let paneles;
            try {
              const abiertas = await github.paginate(github.rest.issues.listForRepo,
                { owner, repo, state: 'open', labels: 'auditoria', per_page: 100 });
              // Las cerradas del último mes: paneles cerrados por la limpieza de
              // cola antes de su lote (pendientes) y fecha de la última revisión
              // de lote (un lote auto-archiva sus paneles).
              const cerradas = await github.paginate(github.rest.issues.listForRepo,
                { owner, repo, state: 'closed', labels: 'auditoria', since: new Date(Date.now() - 30 * DIA).toISOString(), per_page: 100 });
              // Y las 30 más recientes, por si la última revisión de lote es más
              // vieja que la ventana.
              const { data: recientes } = await github.rest.issues.listForRepo(
                { owner, repo, state: 'all', labels: 'auditoria', sort: 'updated', direction: 'desc', per_page: 30 });
              const porNum = new Map();
              for (const i of [...abiertas, ...cerradas, ...recientes]) if (!i.pull_request) porNum.set(i.number, i);
              paneles = [];
              for (const i of porNum.values()) {
                const cs = await github.paginate(github.rest.issues.listComments,
                  { owner, repo, issue_number: i.number, per_page: 100 });
                const labels = (i.labels || []).map(l => (typeof l === 'string' ? l : l.name));
                const verdict = cs.find(c => RE_VERDICT.test(c.body || ''));
                const dones = cs.filter(c => RE_DONE.test(c.body || ''));
                paneles.push({
                  n: i.number,
                  abierto: i.state === 'open',
                  noPlaneado: i.state_reason === 'not_planned',
                  pausa: labels.includes('pause-agents'),
                  p0: cs.some(c => RE_P0.test(c.body || '')) || labels.some(l => LABELS_P0.includes(l)),
                  verdictAt: verdict ? Date.parse(verdict.created_at) : null,
                  doneAt: dones.length ? Math.max(...dones.map(c => Date.parse(c.created_at))) : null,
                });
              }
            } catch (e) {
              fin('nada', [], `foto de paneles ilegible (${e.message}) — sin sesión`);
              core.setFailed(`AP-098: el selector de lote no pudo leer los paneles (${e.message}).`);
              return;
            }
            const pend = paneles
              .filter(p => !p.pausa && p.verdictAt !== null && p.doneAt === null
                && (p.abierto || (!p.noPlaneado && p.verdictAt >= CORTE)))
              .sort((a, b) => a.verdictAt - b.verdictAt);
            if (trigger !== null) {
              const t = paneles.find(p => p.n === trigger);
              if (t && t.doneAt !== null) return fin('nada', [], `#${trigger} ya tiene revisión de proceso (marcador presente) — run duplicado`);
              if (t && t.p0 && pend.some(p => p.n === trigger)) return fin('p0', [trigger], `#${trigger} lleva P0: revisión inmediata de ESE panel, sin esperar lote`);
            }
            if (!pend.length) return fin('nada', [], 'sin auditorías pendientes de revisión de proceso');
            const nums = pend.map(p => p.n);
            if (evento === 'workflow_dispatch') return fin('lote', nums, `dispatch manual: lote forzado con ${nums.length} pendiente(s)`);
            const lotes = paneles.filter(p => !p.p0 && p.doneAt !== null).map(p => p.doneAt);
            const desde = lotes.length ? Math.max(...lotes) : pend[0].verdictAt;
            const dias = (Date.now() - desde) / DIA;
            const ref = lotes.length ? 'la última revisión de lote' : 'el veredicto pendiente más antiguo';
            if (nums.length >= N_LOTE) return fin('lote', nums, `${nums.length} pendientes ≥ ${N_LOTE}`);
            if (dias >= DIAS_LOTE) return fin('lote', nums, `${nums.length} pendiente(s) y ${dias.toFixed(1)} días desde ${ref} ≥ ${DIAS_LOTE}`);
            const p0s = pend.filter(p => p.p0).map(p => p.n);
            if (p0s.length) return fin('p0', p0s, `lote no cumplido; P0 pendiente(s) rezagado(s) — revisión inmediata solo de ellos`);
            fin('nada', [], `lote no cumplido: ${nums.length} pendiente(s) < ${N_LOTE} y ${dias.toFixed(1)} días desde ${ref} < ${DIAS_LOTE}`);

      # ── Divergencia pin↔default (AP-052; primer sujeto fuera de reviewer.yml) ─
      # AP-052 dejó este step declarado como extensión MECÁNICA a los demás
      # reusables, pero sin sujeto: «hoy ningún input de esos reusables tiene
      # lección declarada, así que sería un mecanismo sin sujeto». AP-060 crea el
      # sujeto — y con él la trampa que AP-052 modela: el stub de finplan pinea
      # `timeout_minutes: 20` (fichero congelado, territorio HUMANO por ADR-020),
      # que es EXACTAMENTE el valor pre-lección que este AP abandona. Sin este
      # step, subir el default a 35 en el central es un fix desplegado que no rige
      # en el consumidor donde se midió el fallo, y sin dejar rastro legible: la
      # máquina finplan#1674, reproducida.
      #
      # Determinista, cero LLM, cero coste marginal, cero labels. `continue-on-
      # error` + try/catch ⇒ fail-open total: el aviso jamás puede impedir una
      # revisión de proceso (un `if:` sin función de estado implica `success()`,
      # así que un throw aquí saltaría la sesión y los post-steps).
      - name: Divergencia pin↔default (inputs con lección AP — AP-052)
        id: pindiv
        if: steps.lote.outputs.modo == 'p0' || steps.lote.outputs.modo == 'lote'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          LESSON_BEARING: |
            [
              {"input": "process_max_turns", "default": 120, "ap": "AP-098", "leccion": "AP-060 (finplan#1700, sweep del paso 6) + AP-098 (central#279): el mandato pasa a un LOTE de paneles por sesión; presupuesto y mandato se mueven juntos"},
              {"input": "timeout_minutes",   "default": 60, "ap": "AP-098", "leccion": "AP-060 (finplan#1700: pasos 1-5 = 20 min ENTEROS con UN panel) + AP-098 (central#279): el lote multiplica lecturas y comentarios de resultado"}
            ]
          # `toJSON()` y no interpolación desnuda: emite `35` para un number y
          # `"claude-fable-5"` para un string. Con la interpolación a pelo, el
          # primer input lesson-bearing NO numérico produciría JSON inválido, el
          # `JSON.parse` de abajo lanzaría y el catch dejaría el aviso inerte para
          # TODOS los inputs del reusable. `check-contracts` exige esta forma.
          PINS_RECIBIDOS: |
            {
              "process_max_turns": ${{ toJSON(inputs.process_max_turns) }},
              "timeout_minutes": ${{ toJSON(inputs.timeout_minutes) }}
            }
          # Estado de la válvula (AP-061). Decide el DESENLACE que se anota, no
          # si se anota: una divergencia se registra siempre.
          FORZADO: ${{ toJSON(inputs.budget_pin_forzado) }}
        with:
          script: |
            try {
              const tabla = JSON.parse(process.env.LESSON_BEARING || '[]');
              const pins = JSON.parse(process.env.PINS_RECIBIDOS || '{}');
              // La válvula se lee CERRADA salvo `true` exacto (AP-061): el
              // desenlace anotado tiene que ser el que las expresiones de clamp
              // ejecutan de verdad, y ésas solo honran el pin con el booleano
              // puesto.
              let forzado = false;
              try { forzado = JSON.parse(process.env.FORZADO || 'false') === true; } catch { forzado = false; }
              const div = [];
              for (const e of tabla) {
                const got = pins[e.input];
                if (got === undefined || got === null || got === '') continue;
                const nGot = Number(got), nDef = Number(e.default);
                // Numérico ⇒ solo POR DEBAJO diverge: un pin por encima del
                // default es sobre-aprovisionamiento deliberado, no pérdida de
                // la lección (acota falsos positivos). No numérico ⇒ distinto.
                const esNum = Number.isFinite(nGot) && Number.isFinite(nDef);
                const diverge = esNum ? nGot < nDef : String(got) !== String(e.default);
                if (!diverge) continue;
                // El desenlace anotado es el que la EXPRESIÓN de clamp ejecuta,
                // no una re-derivación aparte: `(forzado && pin) || (pin >= def
                // && pin) || def` solo devuelve el pin cuando la válvula está
                // puesta Y el pin es TRUTHY en Actions. Todo lo demás cae al
                // default, es decir CLAMPA — incluido un valor NO numérico
                // (`pin >= def` tampoco es verdadera con él; hoy inalcanzable
                // porque el guard (d) de check-contracts pone rojo el primer
                // lesson-bearing no numérico) y el degenerado `0`/`false` con
                // válvula que AP-061 declara. `esNum` gobierna la comparación
                // de divergencia de arriba, NO el desenlace.
                const clampado = !(forzado && Number(got) !== 0);
                div.push({ ...e, recibido: got, efectivo: clampado ? e.default : got, clampado });
              }
              if (!div.length) {
                core.info('AP-052: sin divergencia pin↔default en los inputs lesson-bearing.');
                core.setOutput('linea', '');
                core.setOutput('efecto', '');
                return;
              }
              // Formato fijo de AP-052 — `input=<recibido> (default central:
              // <def>, <AP>)` — con el DESENLACE de AP-061 detrás. El prefijo NO
              // se toca: lo citan el 5-whys del Auditor y los greps de la flota.
              const linea = 'pin-divergente: ' + div
                .map(d => `${d.input}=${d.recibido} (default central: ${d.default}, ${d.ap}) ${d.clampado ? `[clamp→${d.efectivo}]` : '[pin forzado]'}`)
                .join('; ');
              const hayForzado = div.some(d => !d.clampado);
              const cola = hayForzado
                ? `\`budget_pin_forzado\` HONRA el pin: este ciclo corre con el presupuesto PRE-lección, bajo responsabilidad del consumidor.`
                : `el reusable ELEVÓ el presupuesto al default del central (clamp AP-061): el pin no rige y la lección no se ha perdido. Retirar la línea del \`with:\` del stub apaga este aviso.`;
              const msg = `AP-052/AP-061 · ${linea} — ${cola} Los stubs son territorio HUMANO (ADR-020): ningún agente los edita.`;
              // Un clamp es operativa NORMAL (el pin no llegó a regir): `info`.
              // Un pin forzado sí es presupuesto pre-lección corriendo: `notice`.
              if (hayForzado) core.notice(msg); else core.info(msg);
              await core.summary
                .addHeading('Divergencia pin↔default (AP-052 · clamp AP-061)', 3)
                .addRaw(`El stub de este repo pinea ${div.length} input(s) *lesson-bearing* por debajo del default del central. Columna **Efectivo** = presupuesto con el que este job corre de verdad:`)
                .addTable([
                  [{ data: 'Input', header: true }, { data: 'Pin del stub', header: true }, { data: 'Default central', header: true }, { data: 'Efectivo', header: true }, { data: 'Desenlace', header: true }, { data: 'AP', header: true }, { data: 'Lección', header: true }],
                  ...div.map(d => [d.input, String(d.recibido), String(d.default), String(d.efectivo), d.clampado ? 'clamp ↑' : 'pin forzado', d.ap, d.leccion || '']),
                ])
                .addRaw('Los stubs son territorio humano (ADR-020): ningún agente los edita. Un presupuesto *lesson-bearing* no se pinea (se hereda); pinarlo por debajo exige `budget_pin_forzado: true` para que rija, y anotación con motivo y fecha — ver `MIGRATION.md` §A5.')
                .write();
              core.setOutput('linea', linea);
              core.setOutput('efecto', hayForzado ? 'forzado' : 'clamp');
            } catch (e) {
              // Fail-open: sin aviso, pero la revisión sigue. Nunca al revés.
              // El clamp NO depende de este step (vive en las expresiones de los
              // puntos de uso): aquí se pierde el REGISTRO, jamás la prevención.
              core.warning(`AP-052: comparación pin↔default no evaluable (${e.message}) — se continúa sin aviso.`);
              core.setOutput('linea', '');
              core.setOutput('efecto', '');
            }

      # AP-085 (2026-09-08): hedge INERTE ante el fallo del instalador nativo de
      # Claude Code (upstream #1817). Si el instalador funciona, no hace nada; si
      # vuelve a omitir la creación del directorio del launcher, ya existe. NO es el
      # fix (mecanismo no demostrado en local): el fix es el pin del `uses` de abajo.
      - name: Asegurar ~/.local/bin (instalador nativo de Claude Code)
        if: steps.lote.outputs.modo == 'p0' || steps.lote.outputs.modo == 'lote'
        run: mkdir -p "$HOME/.local/bin"

      - name: Run process review
        id: process
        if: steps.lote.outputs.modo == 'p0' || steps.lote.outputs.modo == 'lote'
        # AP-085 (2026-09-08) — pin a SHA completo, no a `@v1`. v1.0.217 =
        # 9c5ddab2e6d17b83ea679153b31f1d5f023cf636 (Claude Code 2.1.263,
        # 2026-09-06T02:55Z): ÚLTIMA release conocida buena, única con evidencia
        # cruzada de funcionar en el incidente. v1.0.218 = 0d0e0876d3eaa933f45dc692f7a4312c83caf36f
        # (Claude Code 2.1.265, tag `v1` movido 2026-09-08T20:39Z): desde ~22:30Z su
        # instalador nativo reporta éxito sin crear `~/.local/bin/claude` en runners
        # (upstream anthropics/claude-code-action#1817; 7 muertes en finplan 22:56–23:22Z).
        # Bump del pin = PR humano con criterio (AP-085). Mientras, el runtime sigue
        # flotando sobre install.sh + bootstrap `latest`: cerrar esa clase es AP aparte.
        # AP-087 (2026-09-25) — bump del pin a v1.0.233 = 8cf3482550831fb35a4fc3fbf7ca139cf8028b4c
        # (Claude Code 2.1.281, 2026-09-23T19:40Z): ≥48 h publicada, sin P1 upstream al
        # bumpear. Prerrequisito para `claude-opus-5-5` (soporte desde CLI 2.1.280). El
        # propietario decidió meter runtime y modelo (Creator+Reviewer) en el mismo PR.
        uses: anthropics/claude-code-action@8cf3482550831fb35a4fc3fbf7ca139cf8028b4c # v1.0.233
        env:
          # Blindaje OAuth-only (mismo patrón que reviewer.yml): si OAuth Max
          # falla, el job da rojo en lugar de facturar por API key.
          ANTHROPIC_API_KEY: ""
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Los issues de auditoría los cierra el bot/PAT.
          allowed_bots: "claude"
          # PAT para que los issues creados salgan con autoría del usuario.
          # Sus bodies NUNCA llevan la mención de arm, así que no disparan nada.
          github_token: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
          # `--max-turns` es LESSON-BEARING: el linaje del valor (30 → 60 → 80)
          # y la regla que lo gobierna viven JUNTO al default, en el bloque
          # `workflow_call` de arriba — una segunda copia de la justificación
          # aquí es la deriva que AP-052 gatea. No la dupliques. Lleva además el
          # CLAMP AP-061 (forma canónica — ver el `timeout-minutes` del job).
          #
          # Estas líneas viven AQUÍ, fuera de `claude_args`, y ya no dentro:
          # `claude_args: |` es un block scalar y YAML no reconoce comentarios
          # dentro de él, así que una línea `#` ahí es CONTENIDO del string que
          # recibe el action. Que hoy `claude-code-action@v1` filtre las líneas
          # cuyo primer carácter no blanco es `#` antes de tokenizar
          # (`stripShellComments` en `base-action/src/parse-sdk-options.ts` y en
          # `src/modes/agent/parse-tools.ts`, con test propio) es una cortesía de
          # su implementación, no una cláusula de su contrato de inputs: el día
          # que deje de hacerlo, el `#` se comería `--max-turns` y
          # `--allowedTools` EN VERDE. Coste de no depender de eso: cero.
          # AP-088 (2026-09-28): `--effort medium` explícito; sin flag cada modelo aplica
          # su default de lanzamiento y un cambio upstream lo movería sin aviso.
          claude_args: |
            --model ${{ inputs.process_model }}
            --fallback-model ${{ inputs.process_fallback_model }}
            --effort medium
            --max-turns ${{ (inputs.budget_pin_forzado && inputs.process_max_turns) || (inputs.process_max_turns >= 120 && inputs.process_max_turns) || 120 }}
            --allowedTools "Read,Glob,Grep,Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue create:*),Bash(gh issue comment:*),Bash(gh api:*)"
          prompt: |
            REPO: ${{ github.repository }}
            MODO: ${{ steps.lote.outputs.modo }}
            PANELES: ${{ steps.lote.outputs.paneles }}
            MOTIVO DEL DISPARO: ${{ steps.lote.outputs.motivo }}

            Eres el process-reviewer del pipeline de agentes de este repo.
            Tu única función: proponer mejoras de PROCESO (autonomía y
            eficiencia del loop de agentes) basadas en EVIDENCIA métrica.
            Jamás propones cambios de producto, modelo financiero o código
            de la aplicación.

            FUNCIONES OBJETIVO DECLARADAS (AP-099, central#281, ruling
            mensual 2026-09-30). Son DOS y se leen juntas:
            (a) AUTONOMÍA — intervención humana y trabajo perdido por
                punto entregado;
            (b) TOKENS PONDERADOS POR PUNTO ENTREGADO — del bloque «Ledger
                de valor por proceso» de cada auditoría (tallas post
                S/M/L/XL = 1/2/4/8 de la skill `talla-issue`; tokens del
                `modelUsage` de cada sesión × precio relativo de
                `templates/model-costs.json`), por actor y total.
            (b) va SIEMPRE en par con la fuga y el rework de la «Matriz de
            calidad» del mismo panel (guardián anti-Goodhart): un coste por
            punto que baja mientras sube la fuga o el rework es un
            EMPEORAMIENTO, no una mejora, y ninguna propuesta cita (b) sin
            citar la fuga y el rework del mismo ciclo. La serie «control»
            (tokens por 100 líneas netas) NO sostiene ninguna propuesta por
            sí sola. Cobertura parcial («N de M sesiones con dato») se cita
            tal cual; «sin dato» nunca se lee como 0.

            RÉGIMEN DE LOTE (AP-098, central#279, ruling mensual 2026-09-30).
            PANELES son los issues de auditoría que revisas en ESTA sesión;
            los ha elegido un selector determinista, no los re-selecciones.
            - MODO `lote`: todas las auditorías con veredicto y sin revisar
              de este repo (10 pendientes o 14 días). Las tienes TODAS en
              el mismo contexto: la recurrencia (paso 3b, vía ii) se mide
              DIRECTAMENTE entre ellas, no se reconstruye desde «líneas de
              vigilancia» de comentarios viejos, y el dedupe por eje sale
              de agrupar los hallazgos del lote antes de proponer (un eje
              que aparece en 4 paneles es UNA propuesta con 4 evidencias).
            - MODO `p0`: bypass P0 — el panel lleva `audit-p0` (trabajo
              perdido, sesión NULO por credencial, pipeline parado,
              `human-needed` sobre el panel). Revisas SOLO ese panel (o
              los P0 listados), en el acto.
            Un panel de PANELES puede estar CERRADO (limpieza de cola del
            Architect antes de su lote): se revisa igual, no lo reabras.
            LEE cada panel de PANELES entero (`gh issue view <n>
            --comments`), uno por uno: con varios paneles en contexto el
            riesgo es resumir en vez de leer, y por eso el comentario de
            resultado es POR PANEL y cita lo que ese panel aporta.

            Protocolo:
            1. Lee `.claude/skills/pipeline-map/SKILL.md` (mapa del sistema
               y clases de fallo conocidas) y `docs/agents/protocol.md`.
            2. Lee con `gh issue view <n> --comments` TODOS los paneles de
               PANELES y, como base de comparación, las auditorías previas
               ya revisadas (`gh issue list --label auditoria --state all
               --limit 4` más allá de PANELES), en especial sus bloques
               «## Métricas de proceso» y «## Observaciones de proceso».
               `--state all`, no `closed`, por el MISMO motivo que el sweep
               6a: una auditoría cuyo ciclo murió puede seguir ABIERTA (el
               gate de co-presencia de marcadores no la auto-archiva), y son
               justo esos ciclos los que más tienen que decir sobre
               regresiones. Los dos pasos deben leer el MISMO conjunto: una
               métrica que no leíste no puede explicarte el anuncio que 6a te
               obliga a retomar.
            3. Compara métricas entre épicas. Busca REGRESIONES o fricciones
               repetidas (≥2 épicas): PRs/issue al alza, rondas de review al
               alza, stalls, intervenciones humanas que el sistema debería
               absorber, intervenciones repetidas del Watchdog por la misma
               causa.
            3b. RÉGIMEN DE PROPUESTA (AP-082, 2026-09-02, decisión del
               propietario; sustituye a la moratoria AP-078 y la convierte
               en régimen). El criterio «REPESCAS = FIX OBLIGATORIO»
               (2026-07-13) sigue SUSPENDIDO. Umbral de propuesta, TRES vías
               (basta una; la (iii) es de AP-099):
               (i) P0 — pipeline parado, trabajo perdido, o intervención
                   humana necesaria para restaurar el flujo;
               (ii) RECURRENCIA CON COSTE (AP-090, 2026-09-30, revisión
                   mensual: 54+16 propuestas en septiembre, ninguna filtrada
                   por este umbral) — el MISMO eje (tipo de hallazgo, clase
                   de repesca, causa de intervención del Watchdog) aparece
                   en ≥2 ciclos de auditoría del último mes Y en al menos
                   uno de ellos tuvo coste MEDIDO: trabajo perdido, sesión
                   NULO, intervención humana, o ≥1 corrida de
                   architect-resolve que no habría existido sin él. Un eje
                   que recurre pero se absorbe solo (failsafe, resolver de
                   rutina, ronda extra de review) NO es propuesta hasta el
                   3.er ciclo: es línea de vigilancia en el comentario.
               (iii) COSTE POR PUNTO (AP-099, central#281) — un eje cuyo
                   coste por punto (tokens ponderados / puntos entregados)
                   sube ≥30 % en 2 auditorías del mes, o un actor cuyo peso
                   en el total de tokens ponderados sube 2 ciclos seguidos.
                   Solo con series de cobertura comparable (misma fuente
                   `model-usage`; no compares una auditoría con dato contra
                   una «sin dato»). Palancas LEGÍTIMAS de una propuesta por
                   esta vía: pasos constantes sin consumidor (consulta (i)
                   del ledger), verificación en sesión que ya hace el CI,
                   rondas de nits, arranques sin caché (caché-lectura baja
                   frente a input), sesiones NULO. PROHIBIDO proponer
                   recortes de presupuesto (`max_turns`, `--effort`,
                   timeouts) sin cruzarlos con las muertes por `max-turns`
                   y las sesiones NULO del MISMO ciclo, pegando ese cruce en
                   la propuesta: el presupuesto que se recorta sin mirar
                   quién murió por falta de él es la clase de AP-025/AP-061.
                   Si ningún eje ni actor cumple el umbral, dilo en la línea
                   de métricas del comentario de cada panel («vía (iii): sin
                   eje sobre umbral») — el criterio falsable de AP-099 exige
                   que conste.
               ANTES de crear cualquier propuesta: busca en el central
               (`gh issue list --repo talfarouriarte-cloud/agent-pipeline
               --label process-proposal --state open --search "<eje>"`) si
               ya existe una ABIERTA del mismo eje o de la misma skill.
               Si existe, NO crees otra: añade la evidencia nueva como
               comentario en esa (dedupe por eje; `registro-fiel` acumuló 5
               issues del mismo tipo en un mes). Si la existente lleva
               `mensual:fundida`, comenta en la que la absorbe.
               Una repesca absorbida por un failsafe, sin intervención humana
               y sin recurrencia, NO genera propuesta: línea de métricas y
               nada más. Racional: la ejecución ya NO es automática (paso 5:
               las propuestas nacen DESARMADAS y se deciden en la revisión
               mensual con el propietario), así que el coste de sobreproponer
               es ruido de cola, no trabajo; y el coste de subproponer es
               perder series como las que la moratoria dejó sin salida
               (registro-fiel, 5 ciclos sin propuesta). La vía (ii) es la
               que recoge esas series.
            4. UN COMENTARIO DE RESULTADO POR PANEL de PANELES (AP-098),
               obligatorio para CADA uno, aunque el lote entero no produzca
               nada: sin él, ese panel consta como no revisado y el
               auto-archivo no lo cierra. Si NO hay regresión, ni patrón
               ≥2 épicas, NI repescas sin fix propuesto que toquen ese
               panel: comenta en él exactamente `Sin propuestas.` con una
               línea de métricas comparadas (en modo `lote`, añade qué ejes
               del panel quedan en vigilancia), y termina con él. NO inventes mejoras para justificarte — un informe
               vacío es un resultado válido. CADA comentario TERMINA con DOS
               líneas de marcador: `<!-- process-proposals: 0 -->` y
               `<!-- process-review-done -->` (marcador que consume
               el fail-safe de presencia de este workflow; sin él, tu
               revisión consta como NO hecha — protocol.md).
            5. Si hay patrón: crea como máximo las propuestas que permite el
               cap (Reglas duras: por lote en `lote`, por panel en `p0`), cada
               uno con: título `process-proposal · <resumen>`; el patrón con
               evidencia citada (issue/PR/métrica concretos, ≥2 épicas); la
               propuesta concreta (qué doc/hook/workflow cambiaría y cómo);
               coste y riesgo (incluido el riesgo de la interacción con el
               resto del pipeline — revisa «Known failure classes» del
               pipeline-map); y a quién toca aplicarla.
               **DESTINO ÚNICO Y DESARMADO (AP-082, 2026-09-02, decisión del
               propietario — sustituye al routing por eje de 2026-07-14):**
               - TODA propuesta va AL CENTRAL:
                 `gh issue create --repo talfarouriarte-cloud/agent-pipeline
                 --label process-proposal`. El body EMPIEZA con
                 `Origen: <repo>#<auditoría>` (enlace a la evidencia; el
                 cierre cross-repo lo usará) y una segunda línea
                 `Destino: central` o `Destino: <repo consumidor>` (dónde
                 viviría el fix: `vendored/`/reusables/templates ⇒ central;
                 annexes, skills del repo, `ci.yml` propio ⇒ consumidor).
               - **PROHIBIDO armarla**: el body NO contiene la mención
                 arroba+claude en ninguna forma. La propuesta es una ENTRADA
                 DE COLA para la revisión mensual propietario+Architect;
                 solo el propietario decide qué se ejecuta, y quien arma es
                 él (o el Architect con su OK explícito). Racional: las
                 propuestas armadas al nacer eran ejecución automática de
                 mecánica sin decisión humana (53 APs en 13 días, AP-078).
               - Por qué NO hay issues locales: una `process-proposal` abierta
                 y desarmada en un consumidor bloquea el guard de panel
                 consumido de `claude-code.yml` (arm de `epica`) durante todo
                 el mes; en el central esa label es cola, no panel (AP-051), y
                 el Watchdog solo vigila issues ARMADAS (`issue-armed-no-pr`),
                 así que la cola puede esperar sin anomalías.
               - Si el create cross-repo FALLA (403/404: token sin alcance),
                 NO lo pierdas en silencio: créala LOCAL con el prefijo
                 `[PARA-CENTRAL]` en el título (también desarmada) y anota el
                 fallo en el comentario del issue de auditoría.
               Después comenta en CADA panel de PANELES su resultado: las
               propuestas (creadas o comentadas por dedupe) a las que ESE
               panel aporta evidencia, CON SU DESTINO (central/local), o
               `Sin propuestas.` si no aporta a ninguna. Cada comentario
               TERMINA con DOS líneas de marcador:
               `<!-- process-proposals: N -->` (N = propuestas a las que
               aporta ese panel, links en el cuerpo) y
               `<!-- process-review-done -->` (mismo marcador y motivo que
               en el paso 4). Una propuesta con evidencia de 4 paneles se
               enlaza desde los 4: se cuenta una vez contra el cap.

            6. LOOP DE SKILLS (ADR-212 — lee el ADR antes de editar).
               ENTRAS a este paso SOLO con los comentarios de (4-5) YA
               publicados (propuesta #1258: publicar antes de commitear —
               una muerte de sesión aquí no puede dejar la auditoría sin
               revisión de proceso visible).

            6a. SWEEP DE ANUNCIOS PENDIENTES — **PRIMERA operación al entrar
               al paso 6, ANTES de evaluar ninguna edición nueva** (AP-060,
               repesca finplan#1703). El orden publicar-antes-de-commitear
               hace el estado INOCUO (un anuncio sin ejecutar es visible), pero
               NO auto-sanante: si la sesión emisora muere entre el anuncio y
               el commit, el anuncio queda SIN DUEÑO y decae en silencio.
               Ocurrió en 2 ciclos consecutivos (skill-edit
               `fixture-separa-perimetros` anunciada en aud. finplan#1681 y
               jamás commiteada; DOS replaces anunciados con diff completo en
               aud. finplan#1700 —comentario 2026-07-28T01:36:50Z— y jamás
               commiteados). Misma doctrina que AP-036/AP-046: **materializar
               en el ciclo siguiente, con dueño, la transición que faltó** — el
               anuncio deja de depender de la vida de su sesión emisora.

               - **Localiza.** `gh issue list --label auditoria --state all
                 --limit 4` (`--state all`, no `closed`: una auditoría cuyo
                 ciclo murió puede seguir ABIERTA) y, con
                 `gh issue view <n> --comments`, busca en los 2-3 ciclos
                 previos —NO en los paneles de PANELES— los comentarios
                 terminados en `<!-- autonomous-decision -->` que anuncien una
                 skill-edit. **PENDIENTE := ni SHA de commit ni
                 `<!-- skill-edit-caducado -->` en el cuerpo del comentario.**
                 El ESTADO pendiente no estrena vocabulario: se DERIVA de la
                 ausencia de SHA, la via negativa de #1258 («un anuncio sin
                 SHA final = edición no ejecutada»). El marcador de la salida
                 (c) sí es vocabulario nuevo, y por eso está registrado en la
                 tabla de `docs/agents/protocol.md` (AP-060, append-only).
               - **Verifica el ÁRBOL antes de nada** (mitigación de la
                 doble-ejecución si dos ciclos retoman el mismo anuncio): lee
                 con `gh api` el fichero de la skill en la rama por defecto y
                 comprueba si el marcador `<!-- skill-edit: <tipo> <fecha> -->`
                 del anuncio YA está presente.
                 - **Presente ⇒ ya ejecutado, NO commitees.** Localiza el
                   commit (`gh api "repos/<repo>/commits?path=<fichero>"`,
                   mensaje `skill(loop):`) y edita el comentario ORIGINAL
                   añadiendo su SHA. El anuncio deja de estar pendiente sin
                   consumir cap.
                 - **Ausente ⇒ decide y materializa** (dos salidas, ninguna es
                   «dejarlo estar»):
                   (a) **Evidencia vigente ⇒ conviértelo en propuesta
                   (AP-082: el reviewer ya no commitea).** Crea una
                   `process-proposal` en el central (paso 5: desarmada,
                   `Destino: <repo>`, título `process-proposal · skill-edit ·
                   <tipo>`) con el diff del anuncio VERBATIM — cero diseño
                   nuevo — y edita el comentario ORIGINAL añadiendo el enlace
                   a la propuesta y la línea `<!-- skill-edit-caducado -->`
                   (el anuncio deja de estar pendiente: su dueño es ahora la
                   cola mensual, no un commit). Consume cap de propuestas.
                   (b) **Evidencia caducada ⇒ decláralo caducado con
                   racional.** Caducidad = el tipo que atacaba ya no recurre
                   según el bloque del Auditor, o la sección destino cambió y
                   el diff verbatim ya no aplica. Edita el comentario ORIGINAL
                   añadiendo el racional y la línea
                   `<!-- skill-edit-caducado -->`.
               - **Reporta en el PRIMER panel de PANELES** un comentario con
                 el enlace a cada anuncio retomado, su desenlace (SHA ejecutado
                 / caducado + racional) y la evidencia, terminado en
                 `<!-- autonomous-decision -->`. Sin este reporte la repesca es
                 invisible para el 5-whys del Auditor.
                 **El reporte lleva, POR CADA retomada, la MISMA marca que su
                 desenlace puso en el comentario original: el SHA cuando se
                 anotó (caso «ya ejecutado»), y `<!-- skill-edit-caducado -->`
                 cuando se convirtió en propuesta o se declaró caducidad.** El reporte es él mismo un comentario
                 terminado en `<!-- autonomous-decision -->` que enlaza
                 skill-edits: sin esas marcas, el sweep del ciclo siguiente lo
                 clasificaría como PENDIENTE por la definición literal y
                 re-abriría decisiones ya cerradas. Queda fuera del conjunto
                 pendiente por la MISMA regla que todo lo demás, no por una
                 excepción que haya que recordar.
               - **Cap COMPARTIDO y con prioridad.** Las retomadas convertidas
                 en propuesta consumen del mismo cap de propuestas de skill
                 (Reglas duras) que las nuevas (6b), y van PRIMERO. Anotar un SHA
                 (caso «ya ejecutado») y declarar una caducidad NO consumen
                 cap.

            6b. PROPUESTAS DE SKILL-EDIT (AP-082, 2026-09-02 — sustituye a
               las «ediciones nuevas» autónomas de ADR-212; el reviewer ya
               NO edita el árbol). Con el sweep cerrado, evalúa el bloque
               «## Patrones de fallo del Creator» de las auditorías:
               - Si un TIPO de hallazgo recurre (≥3 en la épica o ≥2 ciclos),
                 emite PROPUESTAS de skill-edit (hasta el cap) como
                 `process-proposal` en el central (paso 5: desarmada,
                 `Destino: <repo de la skill>`, título `process-proposal ·
                 skill-edit · <tipo>`). El body lleva el diff COMPLETO
                 intendido (add/delete/replace acotado a la sección
                 «## Heurísticas aprendidas (loop)» de una skill entrenable de
                 ADR-212, con el marcador `<!-- skill-edit: <tipo> <fecha> -->`
                 en cada línea añadida/sustituida), el tipo que ataca y la
                 evidencia citada — ejecutable verbatim sin tu contexto de
                 sesión, porque quien lo aplique será otro, un mes después.
                 Cada add paga contexto del Creator: prefiere delete/replace.
               - Publica ADEMÁS en el panel de PANELES que aporta la evidencia
                 (el primero si son varios) el comentario con el
                 enlace a cada propuesta y su tipo, terminado en
                 `<!-- autonomous-decision -->` (visibilidad para el 5-whys
                 del Auditor; sin SHA, porque no hay commit — el sweep 6a lo
                 reconoce como no pendiente por el enlace a la propuesta y la
                 línea `<!-- skill-edit-caducado -->` que TAMBIÉN incluyes).
               - REVERT: si una edición previa del árbol (marcador con ≥2
                 épicas) tiene su tipo aún recurriendo según el bloque del
                 Auditor, propón el revert por el mismo canal (diff inverso
                 verbatim); no lo ejecutes.
               - Si el clúster no tiene casa en ninguna skill (test
                 single-home) y lleva ≥2 épicas: propuesta de creación con la
                 descripción de disparo propuesta (el alta exige pipeline-map).

            Reglas duras:
            - PROHIBIDO escribir la mención de arm (arroba+claude) en
              cualquier body o comentario que publiques.
            - PROHIBIDO modificar CUALQUIER fichero de CUALQUIER repo
              (AP-082): ni commits, ni Git Data, ni skills. Tu único
              output son comentarios en los paneles de PANELES y issues
              `process-proposal` DESARMADOS en el central. Propones; el
              propietario decide en la revisión mensual; otros aplican.
            - Cap (AP-098): en MODO `lote`, máximo 3 propuestas de mecánica
              (pasos 3-5) y 2 de skill-edit (paso 6) POR LOTE; en MODO `p0`,
              1 + 1 por panel (AP-090). Añadir evidencia por dedupe a una
              propuesta existente NO consume cap. El umbral (ii) con coste
              de AP-090 no cambia: el cap acota, no invita a llenarlo. El
              cap de skill es TOTAL y COMPARTIDO entre retomadas del sweep
              (6a) y nuevas (6b), con prioridad para las retomadas. Sin
              evidencia ⇒ nada.

      # Ledger de coste del Auditor (AP-099, central#281 — residual cerrado): el
      # mismo materializador `model-usage:` que el clasificador AP-091 de
      # claude-code/reviewer/watchdog, SIN los steps-marcador `llm-flota:` — la
      # firma de flota del Watchdog no lee este workflow (solo Creator, Reviewer y
      # su propia etapa architect), así que un marcador aquí no tendría consumidor.
      - name: Anotar el consumo LLM (model-usage, AP-099)
        if: always() && steps.process.outcome != 'skipped' && steps.process.outcome != 'cancelled'
        uses: actions/github-script@v7
        env:
          EXEC_FILE: ${{ steps.process.outputs.execution_file }}
        with:
          script: |
            // El execution file (AP-040) muere con el runner: su `modelUsage` se publica
            // como UNA anotación `model-usage:` legible por la API de annotations (canal
            // de AP-070). Solo tokens por modelo: el peso lo pone `templates/model-costs.json`
            // (una tabla, una casa). Sin `modelUsage` legible no se anota nada: «sin dato», jamás 0.
            const fs = require('fs');
            const f = process.env.EXEC_FILE || `${process.env.RUNNER_TEMP || '/tmp'}/claude-execution-output.json`;
            let d = null;
            try { d = JSON.parse(fs.readFileSync(f, 'utf8')); } catch (e) { core.info(`execution file ilegible (${e.message}): sin dato.`); return; }
            const msgs = Array.isArray(d) ? d : (d ? [d] : []);
            const r = [...msgs].reverse().find(m => m && m.type === 'result') || null;
            const mu = r && r.modelUsage;
            if (!mu || typeof mu !== 'object' || Object.keys(mu).length === 0) { core.info('sin modelUsage con uso: sin dato.'); return; }
            const tok = Object.fromEntries(Object.entries(mu).map(([m, u]) => [m, {
              in: Number(u && u.inputTokens) || 0, out: Number(u && u.outputTokens) || 0,
              cr: Number(u && u.cacheReadInputTokens) || 0, cw: Number(u && u.cacheCreationInputTokens) || 0 }]));
            core.notice(`model-usage: ${JSON.stringify({ num_turns: r.num_turns, models: tok })}`);

      # finplan#1326 (2026-07-13, sustituye al `if: failure()` de #1258):
      # el exit code del step de sesión MIENTE. Verificado en 4 paneles de
      # 2 repos (finplan #1302/#1305/#1312, wmcb #27): la sesión muere en
      # 1 turno (<1s, coste 0, `is_error: true` en el JSON de ejecución) y
      # la action sale 0 ⇒ `failure()` nunca dispara. El timeout del job
      # tampoco: la cancelación deja `failure()` en false (run 29257318998).
      # Cierre: verificar el estado MATERIALIZADO (marcador en el panel),
      # no el exit code — mismo principio que agent-pipeline#12 aplicó al
      # post-step del Auditor. `always()` corre en éxito, fallo y
      # cancelación por timeout.
      - name: Verificación de presencia del resultado
        if: always() && (steps.lote.outputs.modo == 'p0' || steps.lote.outputs.modo == 'lote')
        env:
          GH_TOKEN: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # AP-098: la verificación es POR PANEL del lote — un lote con 9 de 10
          # comentarios de resultado deja UN panel sin revisar, y es ése el que
          # se marca.
          PANELES: ${{ steps.lote.outputs.paneles }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # El timeout EFECTIVO (post-clamp AP-061), no el pin recibido: este
          # valor se imprime en el comentario de escalada, y anunciar ahí un
          # presupuesto que no fue el que corrió desvía el diagnóstico.
          TIMEOUT_MIN: ${{ (inputs.budget_pin_forzado && inputs.timeout_minutes) || (inputs.timeout_minutes >= 60 && inputs.timeout_minutes) || 60 }}
          # Divergencia pin↔default ya calculada por el step determinista de
          # arriba (AP-052/AP-060). Cadena vacía si no hay divergencia o si el
          # step falló (continue-on-error). Se cita SOLO aquí — el momento
          # exacto en que el humano o el 5-whys del Auditor tienen que decidir
          # algo — para que el pin culpable viaje en el MISMO comentario que
          # pide actuar, en vez de exigir arqueología entre repos.
          PIN_DIVERGENTE: ${{ steps.pindiv.outputs.linea }}
          # Desenlace del pin (AP-061): `clamp` | `forzado` | ''. Con clamp el
          # pin NO rigió, así que señalarlo como sospechoso sería una atribución
          # FALSA en el comentario que pide actuar — peor que ninguna.
          PIN_EFECTO: ${{ steps.pindiv.outputs.efecto }}
        run: |
          FALTAN=""
          for ISSUE in ${PANELES}; do
            CUERPOS=$(gh api "repos/${REPO}/issues/${ISSUE}/comments" \
                 --paginate --jq '.[].body')
            if grep -q 'process-review-done' <<< "$CUERPOS"; then
              echo "::notice::#${ISSUE}: revisión de proceso materializada en el panel (marcador presente)."
            else
              FALTAN="${FALTAN} ${ISSUE}"
            fi
          done
          if [ -z "${FALTAN}" ]; then exit 0; fi
          # Sin marcador: la revisión NO ocurrió, terminara como terminara
          # el step de sesión. Diagnóstico desde el JSON de ejecución si
          # sobrevive en el runner (muertes instantáneas: is_error/num_turns).
          DIAG="sin JSON de ejecución (sesión no arrancó o timeout del job)"
          EXEC="${RUNNER_TEMP}/claude-execution-output.json"
          if [ -f "$EXEC" ]; then
            DIAG=$(python3 -c "import json; d=json.load(open('${EXEC}')); d=d[-1] if isinstance(d,list) else d; print('is_error=%s num_turns=%s duration_ms=%s cost=%s' % (d.get('is_error'), d.get('num_turns'), d.get('duration_ms'), d.get('total_cost_usd')))" 2>/dev/null || echo "JSON de ejecución ilegible")
          fi
          # El pin culpable, si lo hay, como línea propia (formato fijo AP-052:
          # `pin-divergente: <input>=<recibido> (default central: <def>, <AP>)`).
          # Vacío ⇒ no se imprime nada: sin párrafo huérfano.
          # Separador por DELANTE, jamás por detrás: `$(...)` come los saltos de
          # línea FINALES, así que un `printf '%s\n\n'` aquí pegaría este párrafo
          # con el siguiente (verificado en dry-run). Los iniciales sobreviven.
          PIN_LINEA=""
          if [ -n "${PIN_DIVERGENTE}" ]; then
            # AP-061: la atribución depende del DESENLACE. Con clamp el pin no
            # rigió y decirlo importa — el presupuesto que corrió (${TIMEOUT_MIN})
            # ya es el post-lección, así que el sospechoso es otro.
            if [ "${PIN_EFECTO}" = "forzado" ]; then
              PIN_COLA="\`budget_pin_forzado: true\` HONRA el pin, así que este ciclo corrió con el presupuesto PRE-lección. Si el diagnóstico de arriba es muerte por presupuesto (timeout del job a ${TIMEOUT_MIN} min, o \`error_max_turns\`), ése es el primer sospechoso."
            else
              PIN_COLA="el reusable elevó el presupuesto al default del central (clamp AP-061), así que este ciclo corrió con ${TIMEOUT_MIN} min y el pin **no** explica la muerte. Retirar la línea del \`with:\` del stub apaga este aviso."
            fi
            PIN_LINEA=$(printf '\n\n%s' "\`${PIN_DIVERGENTE}\` — el stub de este repo pinea por debajo un default *lesson-bearing* del central: ${PIN_COLA} Los stubs son territorio HUMANO (ADR-020): ningún agente los edita.")
          fi
          BODY=$(printf '%s%s\n\n%s\n\n%s' \
            "**process-review · resultado AUSENTE** — el run terminó sin materializar la revisión de proceso en este panel (ningún comentario con el marcador de resultado). Diagnóstico: ${DIAG}. Run: ${RUN_URL}." \
            "${PIN_LINEA}" \
            "Re-arme (AP-098): el panel sigue PENDIENTE, así que el cron diario del stub lo recoge en el siguiente tick de lote (o en el acto si lleva \`audit-p0\`); para forzarlo ya, \`workflow_dispatch\` del Process Reviewer, o retirar y re-aplicar \`auditoria-completa\` (con PAT — los eventos del token default no disparan workflows). Precaución antes del siguiente ciclo: puede haber efectos parciales sin publicar (commits \`skill(loop):\` en la rama por defecto posteriores a la última auditoría)." \
            "<!-- process-review-pendiente -->")
          for ISSUE in ${FALTAN}; do
            # Dedup (AP-018 §1): con el reintento diario del cron, un panel que
            # sigue fallando no acumula un comentario por día; el rojo del run
            # y la label siguen señalándolo en cada intento.
            PREVIOS=$(gh api "repos/${REPO}/issues/${ISSUE}/comments" --paginate --jq '.[].body')
            if ! grep -q '<!-- process-review-pendiente -->' <<< "$PREVIOS"; then
              gh issue comment "${ISSUE}" --repo "${REPO}" --body "$BODY"
            fi
            gh api -X POST "repos/${REPO}/issues/${ISSUE}/labels" -f "labels[]=process-review-pendiente"
          done
          echo "::error::Revisión de proceso NO materializada en:${FALTAN} — panel(es) marcado(s) process-review-pendiente."
          exit 1

      - name: Auto-archivo del panel de auditoría (2026-07-14, wmcb#53)
        # El issue de auditoría es un ACTA: con el ciclo completo, mantenerlo
        # abierto es un gate que no decide nada (las decisiones humanas viven
        # en los process-proposal escindidos, que NO se auto-cierran). Cierre
        # determinista por CO-PRESENCIA de marcadores: audit-verdict (Auditor)
        # + process-proposals (process-reviewer). Sin ambos, queda abierto —
        # el fallo silencioso clase wmcb#27 (pase omitido) se vuelve VISIBLE.
        # AP-098: recorre los paneles del lote (y, en un `labeled`, el panel del
        # evento — un run duplicado sin sesión sigue pudiendo archivarlo).
        if: always()
        uses: actions/github-script@v7
        env:
          PANELES: ${{ steps.lote.outputs.paneles }}
        with:
          github-token: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const nums = new Set((process.env.PANELES || '').split(/\s+/).filter(Boolean).map(Number));
            if (context.payload.issue && !context.payload.issue.pull_request) nums.add(context.payload.issue.number);
            // Review #293 §4: try/catch POR PANEL — con un lote, un error puntual
            // en el panel k no deja sin archivar k+1…N (el siguiente lote ya no
            // los vería: tienen `done`). Fallos ⇒ warning por panel y rojo al final.
            const fallidos = [];
            for (const n of nums) {
              try {
                const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: n, per_page: 100 });
                const all = comments.map(c => c.body || '').join('\n');
                const hasVerdict = /<!--\s*audit-verdict:\s*(clean|findings)\s*-->/.test(all);
                const hasReview = /<!--\s*process-proposals:\s*\d+\s*-->/.test(all);
                if (!hasVerdict || !hasReview) {
                  core.notice(`auditoría #${n}: ciclo incompleto (verdict=${hasVerdict}, review=${hasReview}) — queda abierta (en modo lote: esperando su lote).`);
                  continue;
                }
                const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: n });
                // Panel cerrado antes de su lote (limpieza de cola): ya está cerrado,
                // no se re-etiqueta como auto-archivado.
                if (issue.state === 'closed') {
                  core.notice(`auditoría #${n}: ciclo completo; ya estaba cerrada (limpieza de cola) — nada que archivar.`);
                  continue;
                }
                // AP-090 (central#265): un panel con `human-needed` vigente tiene una
                // decisión humana pendiente EN el panel; cerrarlo la entierra.
                if ((issue.labels || []).some(l => (l.name || l) === 'human-needed')) {
                  core.notice(`auditoría #${n}: ciclo completo pero human-needed vigente — NO se archiva hasta que el humano retire la label.`);
                  continue;
                }
                await github.rest.issues.addLabels({ owner, repo, issue_number: n, labels: ['auto-archivada'] });
                await github.rest.issues.update({ owner, repo, issue_number: n, state: 'closed', state_reason: 'completed' });
                core.notice(`auditoría #${n}: ciclo completo — auto-archivada.`);
              } catch (e) {
                fallidos.push(n);
                core.warning(`auditoría #${n}: auto-archivo fallido (${e.message}) — se sigue con el resto del lote.`);
              }
            }
            if (fallidos.length) core.setFailed(`auto-archivo fallido en: ${fallidos.map(n => '#' + n).join(' ')} — archivarlos a mano (o re-aplicar \`auditoria-completa\`).`);
