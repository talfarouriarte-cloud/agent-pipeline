# STUB del CENTRAL (2026-07-27, AP-050): agent-pipeline es consumidor de sí
# mismo (AP-012) pero el auto-consumo se montó SIN este stub — el `stalled`
# que los post-steps aplican con PAT no tenía consumidor: `self-claude-code`
# no escucha `labeled` y no existía ni architect-resolve por evento ni el
# cron de re-derivación por estado (AP-038). Canal sordo: 5 process-proposal
# quedaron `stalled` sin dueño (2026-07-22/24, #125/#128/#129/#131/#142).
# Contenido = templates/stubs/stub-watchdog.yml, cuyos defaults son ya los
# del central. Los NOMBRES de workflow_run son los `name:` de los stubs
# self-* (los reusables no generan runs propios aquí).
name: Watchdog
on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]
  schedule:
    - cron: '*/20 * * * *'
  workflow_run:
    workflows: ["Claude Code", "Opus Reviewer", "Epic Merge"]
    types: [completed]
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write
  id-token: write
  statuses: write   # exigido por el job detect del reusable (espejo watchdog/turno, 2026-07-10)
concurrency:
  group: watchdog
  cancel-in-progress: false
jobs:
  call:
    uses: talfarouriarte-cloud/agent-pipeline/.github/workflows/watchdog.yml@main
    with:
      runner: ubuntu-latest
      default_branch: main
      ci_workflow_name: CI
      creator_workflow_name: Claude Code
      reviewer_workflow_name: Opus Reviewer
      epic_merge_workflow_name: Epic Merge
      extra_pipeline_workflows: ""
      epic_label: epica
      # `resolve_max_turns` y `lookback_min` NO se pinean (AP-052): replicaban
      # verbatim el default del central (40/45) — el central se aplica su
      # propia regla de no-pineo (AP-012, consumidor de sí mismo), igual que
      # `self-reviewer.yml`. Son los DOS MISMOS valores que este PR retira de
      # `templates/stubs/stub-watchdog.yml`. Ausencia deliberada: sin línea
      # rige el default y las lecciones futuras del central llegan solas.
      # AP-051: en el CENTRAL `process-proposal` es la COLA, no un panel —
      # sin esta línea el barrido AP-038 la excluye y `stalled` muere en
      # silencio (incidente #125/#128/#129/#131/#142, 2026-07-22/27).
      skip_labels: "pause-agents,human-needed,auditoria,registro-decisiones"
      # AP-058: merge humano en el central (AP-012, espejo de
      # `automerge: false` en self-epic-merge) — LGTM+gates verdes+abierto
      # es terminal por diseño, no `turno-epic-merge-zombie`. NO es un pin
      # redundante (clase AP-052): el default del reusable es `true`.
      automerge: false
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      REVIEWER_GITHUB_TOKEN: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
