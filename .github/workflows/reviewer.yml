name: Opus Reviewer

# CALLABLE (agent-pipeline): triggers y concurrency viven en el stub
# (concurrency del stub DEBE llevar cancel-in-progress: false — un evento
# labeled espurio no puede matar una review en vuelo; incidente PR #1109).
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      reviewer_model:
        type: string
        default: claude-opus-5
      reviewer_max_turns:
        # LESSON-BEARING (AP-052): este default NO es una preferencia de
        # instancia — es una lección aprendida. Si lo cambias, actualiza EN EL
        # MISMO PR las otras TRES declaraciones: la tabla del step «Divergencia
        # pin↔default» (abajo), el bloque `lesson_bearing` de
        # templates/workflow-contracts.json, y el literal de cada expresión de
        # CLAMP donde se consume el input (AP-061). check-contracts exige
        # fidelidad de las cuatro.
        #
        # 80 y no 50 (AP-025, repesca finplan#1450): el mandato universal-strict
        # (2026-07-12, fidelidad ADR cláusula-a-cláusula en TODO PR) expandió el
        # trabajo por sesión y provocó la 1ª muerte por presupuesto observada del
        # Reviewer (ronda 1 de un PR de motor, sin veredicto posteado). Sólo se
        # paga si se usa. La red por-estado (post-step rama sin-veredicto) cubre
        # CUALQUIER muerte; este bump ataca la FRECUENCIA.
        type: number
        default: 80
      timeout_minutes:
        # LESSON-BEARING (AP-052) — ver nota de `reviewer_max_turns`.
        #
        # 22 y no 15 (AP-025): el timeout de wall-clock debe escalar con el bump
        # de turns o el bump es inerte — a 50 turns la muerte por presupuesto de
        # finplan#1450 llegó a los ~9 min; 80 turns rozarían los 15 min y el
        # timeout se volvería el nuevo modo de muerte, dejando el bump sin efecto.
        type: number
        default: 22
      budget_pin_forzado:
        # VÁLVULA del clamp de presupuesto (AP-061, repesca finplan#1704).
        #
        # Por defecto el reusable toma `max(pin, default)` en TODO input
        # lesson-bearing: un `with:` del stub que pinea por debajo del default
        # ya no pisa la lección — se eleva al default y la divergencia se sigue
        # anotando como registro (la visibilidad de AP-052 se conserva; lo que
        # se añade es la PREVENCIÓN). Un presupuesto solo se paga si se usa, así
        # que el clamp es hacia ARRIBA y por tanto fail-open.
        #
        # `true` honra el pin bajo responsabilidad del consumidor: cubre el caso
        # legítimo de control de coste (un repo que quiere deliberadamente MENOS
        # presupuesto del que el central calibró). No apaga la anotación — la
        # cambia de desenlace: `[pin forzado]` en vez de `[clamp→N]`, de modo que
        # el 5-whys sigue viendo el pin y sabe que SÍ rigió.
        #
        # Alcance: la válvula es del REUSABLE, no por input. Un consumidor que
        # necesite forzar un solo presupuesto y clampear los demás no tiene
        # palanca; se prefirió una superficie mínima a un input por parámetro
        # (ningún consumidor ha pedido nunca la granularidad, y cada input nuevo
        # es contrato que envejece — AP-003).
        type: boolean
        default: false
      agent_branch_prefix:
        description: Prefijo de ramas del agente que auto-disparan review
        type: string
        default: claude/
      review_context:
        description: Líneas extra de contexto de dominio para el paso 2 del prompt (anexo por repo)
        type: string
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      REVIEWER_GITHUB_TOKEN:
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: Reviewer
    runs-on: ${{ inputs.runner }}
    # CLAMP de presupuesto (AP-061). `timeout-minutes` de JOB se resuelve antes
    # de que corra ningún step, así que el clamp NO puede vivir en un step: va en
    # la propia expresión. Forma canónica, idéntica en los tres puntos de uso y
    # gateada por check-contracts (`inputs.<lesson-bearing>` desnudo = ROJO):
    #   forzado ⇒ pin · si no, pin ≥ default ⇒ pin · si no ⇒ default
    # Degenerado declarado: un pin 0/vacío con la válvula puesta cae al default
    # (`0` es falsy en expresiones de Actions). Es fail-open —hacia arriba— y un
    # `timeout-minutes: 0` no es un presupuesto válido de todos modos.
    timeout-minutes: ${{ (inputs.budget_pin_forzado && inputs.timeout_minutes) || (inputs.timeout_minutes >= 22 && inputs.timeout_minutes) || 22 }}
    # v1.4: el gate SEMÁNTICO vive como PRIMER STEP github-script; el job-if
    # queda reducido a un prefiltro de coste (sin él, cada evento `labeled`
    # del pipeline — ci-verde, lgtm, estado:* — levantaría un runner solo
    # para que el gate diga no). El prefiltro NO referencia inputs, user.login
    # ni labels del PR: solo campos probados en producción en régimen
    # workflow_call (la cláusula labeled acumula successes desde el día uno).
    # AP-047 (aterrizaje draft/ready-por-estado): un `opened` en DRAFT (primer
    # hito del Creator) NO levanta runner — la review se difiere a la transición
    # ready, materializada por estado (`needs-review`/PAT del post-step de muerte
    # o del open-review-failsafe, trigger `labeled` que TODO stub ya tiene). El
    # `draft == false` es campo probado del payload pull_request; sin él cada
    # push de hito quemaría un spin-up de gate. El guard semántico (gate step)
    # re-cubre el caso `labeled` sobre un draft (belt).
    if: |
      (github.event.action == 'opened' && github.event.pull_request.draft == false)
      || (github.event.action == 'labeled' && github.event.label.name == 'needs-review')

    # v1.4: el gate vive como PRIMER STEP github-script, no como job-if.
    # Motivo: el job-if saltaba sistemáticamente en `opened` en régimen
    # workflow_call (ambas cláusulas; 10 skips vs 5 success en el primer
    # consumidor desde el día uno) — la maquinaria se auto-curaba vía
    # needs-review (coste: un tick de latencia por review, clase REDUNDANT
    # del ledger). El step tiene contexto completo y es depurable: loguea
    # cada campo y la razón de la decisión. Los steps restantes se
    # condicionan a su output.
    steps:
      - name: Gate (sustituye al job-if — v1.4)
        id: gate
        uses: actions/github-script@v7
        env:
          AGENT_BRANCH_PREFIX: ${{ inputs.agent_branch_prefix }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const action = context.payload.action;
            const prefix = process.env.AGENT_BRANCH_PREFIX || 'claude/';
            const author = pr.user?.login || '';
            const authorType = pr.user?.type || '';
            const headRef = pr.head?.ref || '';
            const headRepo = pr.head?.repo?.full_name || '';
            const labels = (pr.labels || []).map(l => l.name);
            const eventLabel = context.payload.label?.name || '';
            const sender = context.payload.sender?.login || '';

            core.notice(`gate ctx: action=${action} author=${author}(${authorType}) headRef=${headRef} headRepo=${headRepo} label=${eventLabel} sender=${sender} labels=[${labels}] prefix=${prefix}`);

            let run = false, reason = '';
            if (headRepo !== `${context.repo.owner}/${context.repo.repo}`) {
              reason = 'PR de fork (sin acceso a secrets)';
            } else if (labels.includes('pause-agents')) {
              reason = 'kill-switch pause-agents (ADR-063)';
            } else if (pr.draft) {
              // AP-047: un draft es el PR de un hito intermedio del Creator; NUNCA
              // se revisa. La review llega en la transición ready, materializada por
              // ESTADO vía `needs-review`/PAT (post-step «Materializar muerte» al
              // marcar ready un draft huérfano, o open-review-failsafe al cierre en
              // verde) — ambas usan el trigger `labeled` que todo stub ya tiene, sin
              // evento `ready_for_review` nuevo. Belt del job-if (que ya salta el
              // `opened`+draft): cubre cualquier `labeled` que llegue mientras el PR
              // siga en draft (p.ej. antes de que el post-step lo marque ready).
              reason = 'PR en draft (primer hito, AP-047) — review diferida a ready-por-estado; un draft nunca se revisa';
            } else if (action === 'opened') {
              const isBot = author === 'claude[bot]' || (authorType === 'Bot' && author.startsWith('claude'));
              const isAgentBranch = headRef.startsWith(prefix);
              run = isBot || isAgentBranch;
              reason = run ? (isBot ? 'opened por claude[bot]' : `opened con rama de agente (${prefix}*)`)
                           : 'opened humano en rama no-agente';
            } else if (action === 'labeled') {
              run = eventLabel === 'needs-review' && sender !== 'claude[bot]';
              reason = run ? 'label needs-review de actor no-bot'
                           : `labeled irrelevante (label=${eventLabel}, sender=${sender})`;
            } else {
              reason = `action no cubierta: ${action}`;
            }
            core.notice(`gate: run=${run} — ${reason}`);
            core.setOutput('run', run ? 'true' : 'false');

      # ── Divergencia pin↔default (AP-052, repesca finplan#1674) ──────────────
      # Un `with:` del stub consumidor pisa EN SILENCIO un default que el central
      # ya corrigió por lección aprendida. Instancia que lo motiva: el stub de
      # finplan pineaba `reviewer_max_turns: 50` cuando el central ya servía 80
      # (AP-025, lección nacida en finplan#1450) — el fix estaba DESPLEGADO («un
      # PR mergeado del central ES el despliegue») y no regía; coste medido en
      # PR finplan#1674: `reviewer-no-verdict-persistent` ×3, causa terminal
      # POSITIVA `max-turns` (AP-040) y `human-needed` ×2 (las únicas dos
      # intervenciones humanas de una épica por lo demás limpia).
      #
      # Este step NO decide nada ni toca labels: materializa la divergencia como
      # estado LEGIBLE (::notice + job summary) en vez de dejarla como
      # arqueología post-incidente (protocol.md, principio 1). Determinista, cero
      # LLM, cero coste marginal. Acotado a inputs LESSON-BEARING (los que llevan
      # una AP detrás) para no convertir en ruido los pins legítimos de instancia
      # (`runner`, `review_context`, …).
      #
      # AP-061 (repesca finplan#1704): la visibilidad de AP-052 FUNCIONÓ y la
      # sesión murió igual — el `pin-divergente: timeout_minutes=15 (default
      # central: 22, AP-025)` se emitió LITERAL y el Reviewer murió a los 12m45s
      # sin veredicto sobre PR finplan#1704. «Un fix que solo hace VISIBLE la
      # omisión a posteriori, sin PREVENIRLA, es parcial» (protocol.md
      # §Principios de proceso 3). La prevención vive ahora en las expresiones de
      # CLAMP de los puntos de uso; lo que este step añade es el DESENLACE: la
      # anotación deja de decir solo «hay divergencia» y dice qué se hizo con
      # ella (`[clamp→N]` o `[pin forzado]`). El prefijo del formato AP-052 queda
      # INTACTO — lo citan el 5-whys del Auditor y los greps de la flota.
      #
      # `LESSON_BEARING` es la lista corta que se mantiene JUNTO al default (ver
      # el bloque `workflow_call`); su fidelidad contra el default REAL y contra
      # `templates/workflow-contracts.json` la verifica check-contracts en el CI
      # del central — una tabla rancia es rojo, no un aviso callado.
      #
      # `continue-on-error` + try/catch: este aviso jamás puede impedir una
      # review (un `if:` sin función de estado implica `success()`, así que un
      # throw aquí saltaría el Checkout y el propio Reviewer). Fail-open total.
      - name: Divergencia pin↔default (inputs con lección AP — AP-052)
        id: pindiv
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          LESSON_BEARING: |
            [
              {"input": "reviewer_max_turns", "default": 80, "ap": "AP-025", "leccion": "finplan#1450 — 1ª muerte del Reviewer por presupuesto tras el mandato universal-strict"},
              {"input": "timeout_minutes",    "default": 22, "ap": "AP-025", "leccion": "finplan#1450 — el wall-clock escala con los turns o el bump es inerte"}
            ]
          # `toJSON()` y no interpolación desnuda: emite `80` para un number y
          # `"claude-opus-5"` para un string. Con la interpolación a pelo, el
          # primer input lesson-bearing NO numérico produciría JSON inválido, el
          # `JSON.parse` de abajo lanzaría y el catch dejaría el aviso inerte
          # para TODOS los inputs del reusable — fail-open silencioso, la misma
          # clase que este AP viene a impedir. `check-contracts` exige esta forma.
          PINS_RECIBIDOS: |
            {
              "reviewer_max_turns": ${{ toJSON(inputs.reviewer_max_turns) }},
              "timeout_minutes": ${{ toJSON(inputs.timeout_minutes) }}
            }
          # Estado de la válvula (AP-061). Decide el DESENLACE que se anota, no
          # si se anota: una divergencia se registra siempre.
          FORZADO: ${{ toJSON(inputs.budget_pin_forzado) }}
        with:
          script: |
            try {
              const tabla = JSON.parse(process.env.LESSON_BEARING || '[]');
              const pins = JSON.parse(process.env.PINS_RECIBIDOS || '{}');
              // La válvula se lee CERRADA salvo `true` exacto (AP-061): el
              // desenlace que se anota tiene que ser el que las expresiones de
              // clamp ejecutan de verdad, y ésas solo honran el pin con el
              // booleano puesto. Un valor ilegible ⇒ se anota clamp, que es lo
              // que pasa.
              let forzado = false;
              try { forzado = JSON.parse(process.env.FORZADO || 'false') === true; } catch { forzado = false; }
              const div = [];
              for (const e of tabla) {
                const got = pins[e.input];
                if (got === undefined || got === null || got === '') continue;
                const nGot = Number(got), nDef = Number(e.default);
                // Numérico ⇒ solo POR DEBAJO diverge: un pin por encima del
                // default es sobre-aprovisionamiento deliberado, no pérdida de
                // la lección (acota falsos positivos). No numérico ⇒ distinto.
                const esNum = Number.isFinite(nGot) && Number.isFinite(nDef);
                const diverge = esNum ? nGot < nDef : String(got) !== String(e.default);
                if (!diverge) continue;
                // El desenlace anotado es el que la EXPRESIÓN de clamp ejecuta,
                // no una re-derivación aparte: `(forzado && pin) || (pin >= def
                // && pin) || def` solo devuelve el pin cuando la válvula está
                // puesta Y el pin es TRUTHY en Actions. Todo lo demás cae al
                // default, es decir CLAMPA — incluido un valor NO numérico
                // (`pin >= def` tampoco es verdadera con él; hoy inalcanzable
                // porque el guard (d) de check-contracts pone rojo el primer
                // lesson-bearing no numérico) y el degenerado `0`/`false` con
                // válvula que AP-061 declara. `esNum` gobierna la comparación
                // de divergencia de arriba, NO el desenlace.
                const clampado = !(forzado && Number(got) !== 0);
                div.push({ ...e, recibido: got, efectivo: clampado ? e.default : got, clampado });
              }
              if (!div.length) {
                core.info('AP-052: sin divergencia pin↔default en los inputs lesson-bearing.');
                core.setOutput('linea', '');
                core.setOutput('efecto', '');
                return;
              }
              // Formato fijo de AP-052 — `input=<recibido> (default central:
              // <def>, <AP>)` — con el DESENLACE de AP-061 pegado detrás. El
              // prefijo NO se toca: lo citan el 5-whys del Auditor y los greps
              // de la flota, y un cambio de formato los rompería en silencio.
              const linea = 'pin-divergente: ' + div
                .map(d => `${d.input}=${d.recibido} (default central: ${d.default}, ${d.ap}) ${d.clampado ? `[clamp→${d.efectivo}]` : '[pin forzado]'}`)
                .join('; ');
              // Un clamp es operativa NORMAL y esperada (el pin no llegó a
              // regir): `info`. Un pin forzado sí es un presupuesto pre-lección
              // corriendo de verdad: `notice`, que sube al resumen del run.
              const hayForzado = div.some(d => !d.clampado);
              const cola = hayForzado
                ? `\`budget_pin_forzado\` HONRA el pin: esta sesión corre con el presupuesto PRE-lección, bajo responsabilidad del consumidor.`
                : `el reusable ELEVÓ el presupuesto al default del central (clamp AP-061): el pin no rige y la lección no se ha perdido. Retirar la línea del \`with:\` del stub apaga este aviso.`;
              const msg = `AP-052/AP-061 · ${linea} — ${cola} Los stubs son territorio HUMANO (ADR-020): ningún agente los edita.`;
              if (hayForzado) core.notice(msg); else core.info(msg);
              await core.summary
                .addHeading('Divergencia pin↔default (AP-052 · clamp AP-061)', 3)
                .addRaw(`El stub de este repo pinea ${div.length} input(s) *lesson-bearing* por debajo del default del central. Columna **Efectivo** = presupuesto con el que este job corre de verdad:`)
                .addTable([
                  [{ data: 'Input', header: true }, { data: 'Pin del stub', header: true }, { data: 'Default central', header: true }, { data: 'Efectivo', header: true }, { data: 'Desenlace', header: true }, { data: 'AP', header: true }, { data: 'Lección', header: true }],
                  ...div.map(d => [d.input, String(d.recibido), String(d.default), String(d.efectivo), d.clampado ? 'clamp ↑' : 'pin forzado', d.ap, d.leccion || '']),
                ])
                .addRaw('Los stubs son territorio humano (ADR-020): ningún agente los edita. Un presupuesto *lesson-bearing* no se pinea (se hereda); pinarlo por debajo exige `budget_pin_forzado: true` para que rija, y anotación con motivo y fecha — ver `MIGRATION.md` §A5.')
                .write();
              core.setOutput('linea', linea);
              core.setOutput('efecto', hayForzado ? 'forzado' : 'clamp');
            } catch (e) {
              // Fail-open: sin aviso, pero la review sigue. Nunca al revés.
              // OJO: el clamp NO depende de este step — vive en las expresiones
              // de los puntos de uso, que se resuelven aunque esto se caiga
              // entero. Lo que se pierde aquí es el REGISTRO, jamás la
              // prevención (que es justo lo que AP-061 vino a añadir).
              core.warning(`AP-052: comparación pin↔default no evaluable (${e.message}) — se continúa sin aviso.`);
              core.setOutput('linea', '');
              core.setOutput('efecto', '');
            }

      # Patrón ADR-063: el agente disparado por una label la quita como
      # primer paso. Así el próximo add (del Creator tras responder a
      # los comentarios) vuelve a disparar el evento `labeled`. Sin
      # esto, re-aplicar la misma label es no-op silencioso.
      #
      # Solo aplica cuando el trigger fue label (no en `opened`).
      - name: Remove needs-review trigger label
        if: |
          steps.gate.outputs.run == 'true'
          && github.event.action == 'labeled'
          && github.event.label.name == 'needs-review'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: 'needs-review',
              });
              core.notice('Label `needs-review` removed (trigger consumed).');
            } catch (e) {
              // 404 si la label ya no está (race condition o removida
              // manualmente). No es error en operativa normal.
              core.notice(`Could not remove needs-review: ${e.message}`);
            }

      # Cap DETERMINISTA de convergencia NITS (AP-053, 2026-07-27, PR
      # finplan#1686). Por mandato, `NITS` = mergeable tal cual; bajo ADR-193
      # cada NITS pinga al Creator y reconvoca al Reviewer ⇒ un reviewer que
      # re-audita lo aplicado y abre nits NUEVOS cada ronda no converge nunca
      # a LGTM y quema el cap=8 escalando a humano PRs ya mergeables (#1686:
      # 6 rondas, 2h20m, 11-16k chars/ronda con Opus 5). Regla de clase
      # (AP-011/AP-035): la autocontención procedural del agente es la clase
      # de regla que FALLA — el cierre del loop debe ser estructural, no
      # confiado al mandato. Dos rondas NITS consecutivas aplicadas (commits
      # posteriores al último veredicto) ⇒ LGTM determinista, sesión omitida.
      # Un REVIEW intermedio resetea la cuenta (los 🔴 sí re-litigan).
      - name: Cap de convergencia NITS (AP-053) — LGTM determinista tras 2 NITS aplicadas
        id: nitscap
        if: steps.gate.outputs.run == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
          script: |
            const n = context.payload.pull_request.number;
            const cs = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: n, per_page: 100,
            });
            // Identidad del Reviewer = la del PAT (epic-merge filtra por este
            // login; incidente #1048). Veredicto = token anclado en línea 1.
            const REVIEWER_LOGIN = 'talfarouriarte-cloud';
            const vs = cs.filter(c => c.user.login === REVIEWER_LOGIN
              && /^\s*(LGTM|REVIEW|NITS)\b/.test((c.body || '').trim())
              && !/<!--\s*epic-merge-diag\s*-->/.test(c.body || ''));
            let trailingNits = 0;
            for (let i = vs.length - 1; i >= 0; i--) {
              if (/^\s*NITS\b/.test(vs[i].body.trim())) trailingNits++; else break;
            }
            if (trailingNits < 2) { core.setOutput('skip', 'false'); return; }
            // ¿El Creator aplicó la última ronda? Vigencia por-estado: el head
            // debe ser POSTERIOR al último veredicto. Fail-open a sesión normal
            // si no se puede verificar (no capar sobre incertidumbre).
            try {
              const head = context.payload.pull_request.head.sha;
              const cm = await github.rest.repos.getCommit({
                owner: context.repo.owner, repo: context.repo.repo, ref: head });
              const headDate = new Date(cm.data.commit.committer.date);
              const lastV = new Date(vs[vs.length - 1].created_at);
              if (headDate <= lastV) { core.setOutput('skip', 'false'); return; }
            } catch (e) {
              core.warning('nits-cap: vigencia no verificable (' + e.message + '); sesión normal.');
              core.setOutput('skip', 'false'); return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: n,
              body: 'LGTM\n\n**reviewer · cap de convergencia NITS (AP-053, determinista — sesión de agente omitida).** '
                + 'Tercer tick tras ' + trailingNits + ' rondas `NITS` consecutivas aplicadas por el Creator (head posterior al último veredicto). '
                + 'Por mandato, `NITS` = mergeable tal cual: las reservas menores restantes viven en las rondas previas del panel; '
                + 'una tercera pasada re-auditando lo aplicado no aporta valor proporcional (rendimientos decrecientes). '
                + 'Un 🔴 sobrevenido siempre puede reabrirse vía `REVIEW` humano o del watchdog. <!-- nits-convergence-cap -->',
            });
            core.notice('AP-053: LGTM determinista tras ' + trailingNits + ' NITS consecutivas aplicadas — sesión del Reviewer omitida.');
            core.setOutput('skip', 'true');

      - name: Checkout
        if: steps.gate.outputs.run == 'true' && steps.nitscap.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Migración 2026-05-19: el Reviewer estaba en `scripts/reviewer.mjs`
      # llamando Messages API directamente con CLAUDE_CODE_OAUTH_TOKEN. Eso
      # NO funciona — OAuth tokens no son válidos contra Messages API (ver
      # GitHub issue anthropics/claude-code#37205) — y el script tenía
      # fallback silencioso a ANTHROPIC_API_KEY → facturación pay-per-token
      # ~20€/día sin detectar.
      #
      # Ahora se usa claude-code-action@v1 igual que el Creator
      # (claude-code.yml). El action invoca el binario `claude` CLI, no
      # Messages API directa, así que SÍ funciona con OAuth Max ($0 real).
      #
      # `prompt:` activa automation mode del action — corre directo sin
      # esperar `@claude` mention. El system prompt del Reviewer vive en
      # docs/agents/reviewer.md y se carga via el propio prompt aquí.
      - name: Graft vendored (capa común servida desde el central — AP-009)
        if: steps.gate.outputs.run == 'true' && steps.nitscap.outputs.skip != 'true'
        uses: talfarouriarte-cloud/agent-pipeline/.github/actions/graft-vendored@main

      - name: Run Reviewer
        id: reviewer
        if: steps.gate.outputs.run == 'true' && steps.nitscap.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        env:
          # Blindaje OAuth-only: bloquea cualquier fallback silencioso a API
          # key dentro de la SDK interna del action. Si OAuth Max falla, el
          # job da rojo en lugar de facturar.
          ANTHROPIC_API_KEY: ""
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # El PR del Creator viene de claude[bot]. El action tiene un guard
          # anti-bot que rechaza disparos de actores no-humanos a menos que
          # estén en allowed_bots. Sin esto, el Reviewer falla en PRs del
          # Creator con: "Workflow initiated by non-human actor: claude
          # (type: Bot). Add bot to allowed_bots list ...".
          allowed_bots: "claude"

          # GITHUB_TOKEN default NO dispara otros workflows (anti-loop GitHub).
          # Para que el comentario del Reviewer con `@claude` dispare el
          # Creator (claude-code.yml), usar PAT (REVIEWER_GITHUB_TOKEN).
          github_token: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
          # track_progress NO se activa: solo es compatible con acciones
          # 'opened/synchronize/ready_for_review/reopened' del evento
          # pull_request. Como el Reviewer también se dispara via label
          # 'needs-review' (action: labeled), activarlo rompería el flujo
          # manual. Trade-off aceptable: pierdes comment de progreso
          # visible, pero ganas robustez de invocación.
          #
          # `--max-turns` lleva el CLAMP AP-061 (forma canónica — ver el
          # `timeout-minutes` del job). El comentario vive AQUÍ, fuera de
          # `claude_args`, y no dentro: `claude_args: |` es un block scalar y
          # YAML no reconoce comentarios dentro de él, así que una línea `#`
          # ahí es CONTENIDO del string que recibe el action. Que hoy
          # `claude-code-action@v1` filtre las líneas cuyo primer carácter no
          # blanco es `#` antes de tokenizar (`stripShellComments` en
          # `base-action/src/parse-sdk-options.ts` y en
          # `src/modes/agent/parse-tools.ts`, con test propio) es una cortesía
          # de su implementación, no una cláusula de su contrato de inputs: el
          # día que deje de hacerlo, el `#` se comería `--max-turns` y
          # `--allowedTools` EN VERDE. Coste de no depender de eso: cero.
          claude_args: |
            --model ${{ inputs.reviewer_model }}
            --max-turns ${{ (inputs.budget_pin_forzado && inputs.reviewer_max_turns) || (inputs.reviewer_max_turns >= 80 && inputs.reviewer_max_turns) || 80 }}
            --allowedTools "Read,Glob,Grep,Write,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            PR HEAD SHA: ${{ github.event.pull_request.head.sha }}
            PR BASE SHA: ${{ github.event.pull_request.base.sha }}

            Eres el Reviewer del repo. Tu rol completo, criterios de
            severidad, formato del comment de output (cabecera de control
            de loop con veredicto + @claude en línea 1-2, TOC al principio,
            severidad por issue 🔴/🟡/🟢/🔵, verificaciones, criterio de
            convergencia, criterios LGTM/REVIEW/NITS) están documentados
            en `docs/agents/reviewer.md`.

            Acciones requeridas (en este orden):

            1. **Lee `docs/agents/reviewer.md` COMPLETO** antes de hacer
               nada más. Es tu system prompt — internalízalo. Si algo en
               las instrucciones siguientes contradice ese doc, gana el
               doc.

            2. **Lee el contexto relevante** del repo según el área que
               toca el PR:
               - `decisions.md` (ADRs vigentes) — siempre relevante.
               - `spec.md` (contrato del producto).
               - `CLAUDE.md` para convenciones operativas.
               - `docs/agents/reviewer-annex.md` si existe (mandato
                 específico del repo).
               ${{ inputs.review_context }}

            3. **Obtén el diff del PR**:
               ```
               gh pr diff ${{ github.event.pull_request.number }} > /tmp/diff.patch
               ```
               Excluir `pnpm-lock.yaml` del análisis (ruido de
               dependencias auto-gestionado).

            4. **Obtén el thread de comentarios del PR** (incluye reviews
               previas tuyas si las hay):
               ```
               gh pr view ${{ github.event.pull_request.number }} --json comments,reviews > /tmp/thread.json
               ```

            5. **Audita el PR** según los criterios de
               `docs/agents/reviewer.md`. Si NO es la primera review de
               este PR (ya hay comments tuyos previos en `thread.json`),
               aplica los criterios de convergencia: NO repitas issues
               ya planteadas, verifica si las del Creator fueron
               resueltas, decide LGTM/NITS/REVIEW.

            6. **Postea tu review como comentario en el PR**:
               ```
               gh pr comment ${{ github.event.pull_request.number }} --body-file <archivo>
               ```
               Formato exacto del doc: veredicto + `@claude` (si REVIEW)
               en cabecera al principio del comment para sobrevivir
               truncamiento, TOC al principio, severidad por issue,
               verificaciones.

            Reglas absolutas:

            - NO modifiques código del PR. Tu único output es el
              comentario de review.
            - NO mergees el PR.
            - NO añadas/quites labels (excepto consumir `needs-review`
              que ya gestiona el pre-step).
            - Respeta el formato y los criterios de severidad definidos
              en `docs/agents/reviewer.md` exactamente.

      # ── Estado materializado (ADR-218 + AP-025): un paso DETERMINISTA (cero
      # LLM) cierra la costura «sesión del Reviewer → estado» (la disciplina de
      # un LLM es olvidable; el mecanismo no). DOS ramas DISJUNTAS por «¿existe
      # veredicto VIGENTE para el head SHA actual?»:
      #   · CON veredicto (ADR-218) ⇒ materializa la label `lgtm` (escribe si el
      #     último es LGTM; retira si REVIEW/NITS). `lgtm` sale con el PAT: su
      #     `labeled` es el edge que le faltaba a epic-merge cuando el LGTM llega
      #     después del CI (incidente PR #1205).
      #   · SIN veredicto (AP-025, repesca finplan#1450) ⇒ la sesión concluyó
      #     (cualquier outcome — este step corre `if: always()`) sin postear un
      #     veredicto anclado para el head: muerte por presupuesto (max-turns/
      #     timeout) o crash antes de postear. El terminal «Reviewer muerto sin
      #     veredicto» NO tenía materialización — la transición quedaba colgada
      #     hasta el paso del Watchdog (~9-18 min + un slot de su cap). Aquí se
      #     re-aplica `needs-review` con el PAT ⇒ sesión FRESCA por evento,
      #     latencia cero. Cap 1 por head SHA vía marcador; reincidencia sobre el
      #     mismo head ⇒ NO re-etiquetar (una 2ª muerte por presupuesto = la
      #     review no cabe en el presupuesto, no un flake — evita el loop de
      #     sesiones Opus muertas) ⇒ `stalled` para architect-resolve.
      # Disjunción con central#76: aquella rama materializa la label cuando SÍ
      # hay veredicto en prosa; ésta relanza cuando NO lo hay. Se separan por la
      # misma pregunta (¿veredicto vigente para el head?), sin carrera.
      - name: Materializar estado del Reviewer (label lgtm / rama sin-veredicto AP-025)
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/github-script@v7
        env:
          ARM_PAT: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
          # Diagnóstico terminal de la sesión muerta (AP-040): salida ESTRUCTURADA
          # de la action (execution file JSON + outcome del step), jamás substring
          # de log (clase regex-polarity). `execution_file` puede venir vacío si el
          # step murió antes de setear el output ⇒ fallback al path canónico del
          # base-action (`${RUNNER_TEMP}/claude-execution-output.json`).
          EXEC_FILE: ${{ steps.reviewer.outputs.execution_file }}
          STEP_OUTCOME: ${{ steps.reviewer.outcome }}
          STEP_CONCLUSION: ${{ steps.reviewer.conclusion }}
          # El timeout EFECTIVO (post-clamp AP-061), no el pin recibido: este
          # valor viaja al diagnóstico de la sesión muerta, y anunciar ahí un
          # presupuesto que no fue el que corrió es exactamente la
          # inatribuibilidad que AP-040 vino a cerrar.
          TIMEOUT_MIN: ${{ (inputs.budget_pin_forzado && inputs.timeout_minutes) || (inputs.timeout_minutes >= 22 && inputs.timeout_minutes) || 22 }}
          # Divergencia pin↔default ya calculada por el step determinista de
          # arriba (AP-052). Cadena vacía si no hay divergencia, si el step
          # falló (continue-on-error) o si el input no es lesson-bearing. Se
          # cita SOLO en la rama `reviewer-no-verdict-persistent` — el momento
          # exacto en que un humano/el Auditor tienen que decidir algo — para
          # que el pin culpable aparezca en el MISMO comentario que pide actuar,
          # en vez de exigir arqueología entre repos.
          PIN_DIVERGENTE: ${{ steps.pindiv.outputs.linea }}
          # Desenlace del pin (AP-061): `clamp` | `forzado` | ''. Decide la
          # atribución que se escribe. Sin esto el comentario tendría que
          # afirmar a ciegas que el pin rigió — cierto antes del clamp, FALSO
          # después en el caso normal, y una atribución falsa en el comentario
          # que pide actuar es peor que ninguna.
          PIN_EFECTO: ${{ steps.pindiv.outputs.efecto }}
        with:
          script: |
            const O = { owner: context.repo.owner, repo: context.repo.repo };
            const n = context.payload.pull_request.number;
            const headSha = context.payload.pull_request.head.sha;
            // Paginación COMPLETA (no `per_page: 100` a secas): la API de
            // issue-comments devuelve orden ASCENDENTE (los 100 más ANTIGUOS en la
            // página 1). En un PR de épica multironda (>100 comentarios — la clase
            // exacta que motiva AP-025) el marcador que ESTE step acaba de postear
            // y los veredictos recientes viven en páginas 2+; sin paginar, el cap 1
            // por head SHA contaría 0 (loop de relanzamientos) y `vs` saldría vacío
            // en PRs ya revisados (relanzamiento espurio). Con el `return` previo
            // esta limitación era benigna; la rama sin-veredicto la vuelve dañina.
            const cs = await github.paginate(github.rest.issues.listComments, { ...O, issue_number: n, per_page: 100 });
            // Veredicto anclado a la PRIMERA palabra del comentario (cabecera
            // ADR-063), jamás substring (clase regex-polarity, PR #1133).
            const vs = cs.filter(c => /^\s*(LGTM|REVIEW|NITS)\b/.test((c.body || '').trim()));
            const lastVc = vs[vs.length - 1] || null;
            // ¿El último veredicto es VIGENTE para el head actual? Vigente si se
            // posteó DESPUÉS del commit del head (committer.date vs created_at —
            // misma comprobación que el lgtm-remat del watchdog y el
            // turn-close-failsafe). Cubre el caso multironda: un REVIEW de una
            // ronda previa NO cuenta como veredicto del head nuevo. Fail-closed a
            // «hay veredicto» si getCommit falla: no relanzar sobre incertidumbre.
            // Sin veredicto alguno (lastVc null) ⇒ directamente rama sin-veredicto.
            let verdictForHead = !!lastVc;
            if (lastVc) {
              try {
                const { data: hc } = await github.rest.repos.getCommit({ ...O, ref: headSha });
                verdictForHead = new Date(lastVc.created_at) > new Date(hc.commit.committer.date);
              } catch (e) { core.info(`AP-025 head-check: ${e.message} (fail-closed a veredicto presente)`); verdictForHead = true; }
            }
            const patCall = async (method, path, body) => {
              const res = await fetch(`https://api.github.com/repos/${O.owner}/${O.repo}${path}`, {
                method, headers: { Authorization: `Bearer ${process.env.ARM_PAT}`, Accept: 'application/vnd.github+json' },
                body: body ? JSON.stringify(body) : undefined });
              if (!res.ok && res.status !== 404) core.warning(`AP-025 ${method} ${path}: HTTP ${res.status}`);
              return res;
            };
            // Diagnóstico terminal de la sesión muerta (AP-040): lee la salida
            // ESTRUCTURADA de la action (el último mensaje `result` del execution
            // file: `subtype` ∈ {success, error_max_turns, error_during_execution},
            // `is_error`, `duration_ms`), jamás substring de log (clase regex-
            // polarity). Cuatro buckets: `max-turns` (identificación POSITIVA de
            // presupuesto — único que activa el fast-path), `timeout` (job cancelado
            // o wall rozando `timeout_minutes`), `crash` (cualquier otra conclusión
            // con execution file legible — error_during_execution, is_error, o
            // success-sin-veredicto), `ilegible` (sin execution file parseable). Todo
            // lo que NO es `max-turns` ⇒ fail-open al relanzamiento de hoy.
            const diagnoseTerminal = () => {
              const fs = require('fs');
              const fmtWall = (ms) => Number.isFinite(ms)
                ? `${Math.floor(Math.round(ms / 1000) / 60)}m ${Math.round(ms / 1000) % 60}s`
                : 'wall ilegible';
              const execPath = process.env.EXEC_FILE
                || `${process.env.RUNNER_TEMP || '/tmp'}/claude-execution-output.json`;
              const timeoutMin = Number(process.env.TIMEOUT_MIN) || 0;
              const outcome = process.env.STEP_OUTCOME || '';
              let last = null;
              try {
                const arr = JSON.parse(fs.readFileSync(execPath, 'utf8'));
                const list = Array.isArray(arr) ? arr : [arr];
                for (let i = list.length - 1; i >= 0; i--) {
                  if (list[i] && list[i].type === 'result') { last = list[i]; break; }
                }
                if (!last) last = list[list.length - 1] || null;
              } catch (e) { core.info(`AP-040 diag: execution file ilegible (${e.message})`); }
              const wallMs = last && Number.isFinite(last.duration_ms) ? last.duration_ms : NaN;
              const wall = fmtWall(wallMs);
              if (last && last.subtype === 'error_max_turns') return { causa: 'max-turns', wall };
              // Timeout de job: el step se cancela (result no llega) o el wall roza el
              // techo (margen 30s). Positivo, pero NO presupuesto-de-turnos ⇒ relanzar.
              if (outcome === 'cancelled' ||
                  (timeoutMin && Number.isFinite(wallMs) && wallMs >= timeoutMin * 60 * 1000 - 30000)) {
                return { causa: 'timeout', wall };
              }
              if (!last) return { causa: 'ilegible', wall };
              return { causa: 'crash', wall };
            };

            // ── Rama SIN-VEREDICTO (AP-025 + AP-040): cap 1 por head SHA; reincidencia
            // O muerte-por-presupuesto POSITIVA ⇒ escalada directa (sin relanzar).
            if (!verdictForHead) {
              const MARK = `<!-- reviewer-no-verdict-relaunch: ${headSha} -->`;
              const prior = cs.filter(c => (c.body || '').includes(MARK)).length;
              const diag = diagnoseTerminal();
              const causaLine = `causa: ${diag.causa} · ${diag.wall}`;
              // Fast-path muerte-por-presupuesto (AP-040): `max-turns` es identificación
              // POSITIVA de que la review no cabe en el presupuesto. Relanzar una sesión
              // idéntica la condena a morir igual (mismo racional que la 2ª muerte de
              // AP-025): NO quemar el cap-1 ⇒ directo a persistent + `stalled`
              // (architect-resolve re-dimensiona). Cualquier otra causa ⇒ relanzar.
              const budgetDeath = diag.causa === 'max-turns';
              if (prior >= 1 || budgetDeath) {
                await patCall('POST', `/issues/${n}/labels`, { labels: ['stalled'] });
                const motivo = budgetDeath && prior < 1
                  ? `muerte-por-presupuesto POSITIVA (\`error_max_turns\`) en la 1ª conclusión — fast-path AP-040: relanzar una sesión idéntica moriría igual, no se quema el cap-1`
                  : `2ª conclusión del Reviewer SIN veredicto para el mismo head — una 2ª muerte indica que la review no cabe en el presupuesto (no un flake)`;
                // AP-052: si el stub de este repo pinea un input lesson-bearing
                // por debajo del default del central, el pin culpable viaja EN
                // ESTE comentario. Sin marcador nuevo (nada lo consume): es
                // atribución para el 5-whys y una acción legible para el humano,
                // que es quien decide sobre sus stubs (ADR-020).
                // AP-061: la atribución depende del DESENLACE. Con clamp, el pin
                // NO rigió — decirlo importa, porque señalar un sospechoso
                // inocente desvía el re-dimensionado (que es lo que hace
                // architect-resolve al leer esto).
                const pinTxt = (process.env.PIN_DIVERGENTE || '').trim();
                const pinLine = pinTxt
                  ? `\n\n\`${pinTxt}\` — ${process.env.PIN_EFECTO === 'forzado'
                      ? 'el stub pinea por debajo un default *lesson-bearing* y `budget_pin_forzado: true` HONRA el pin: esta sesión corrió con el presupuesto PRE-lección y es el primer sospechoso de la muerte. Revisar el `with:` del stub antes de re-dimensionar el PR.'
                      : 'el stub pinea por debajo un default *lesson-bearing*, pero el reusable elevó el presupuesto al default del central (clamp AP-061): esta sesión NO corrió con el pin, así que el pin **no** explica la muerte — re-dimensionar el PR. Retirar la línea del `with:` apaga el aviso.'}`
                  : '';
                await github.rest.issues.createComment({ ...O, issue_number: n,
                  body: `**reviewer · rama sin-veredicto (AP-025/AP-040)**: ${motivo}. Anomalía para architect-resolve (\`stalled\`). \`${causaLine}\`${pinLine}\n\n<!-- reviewer-no-verdict-persistent -->` });
                core.warning(`AP-040: escalada a architect-resolve para ${headSha.slice(0,7)} — ${causaLine}${budgetDeath ? ' (fast-path presupuesto)' : ''}.`);
                return;
              }
              // remove+add fuerza el evento `labeled` aunque hubiera un resto; con
              // el PAT porque un `labeled` del GITHUB_TOKEN no dispara reviewer.yml.
              await patCall('DELETE', `/issues/${n}/labels/needs-review`);
              await patCall('POST', `/issues/${n}/labels`, { labels: ['needs-review'] });
              await github.rest.issues.createComment({ ...O, issue_number: n,
                body: `**reviewer · rama sin-veredicto (AP-025)**: la sesión del Reviewer concluyó sin veredicto anclado (LGTM/REVIEW/NITS, cabecera ADR-063) para el head \`${headSha.slice(0,7)}\` — muerte por crash/infra antes de postear (no presupuesto: si lo fuera, iría directo a \`stalled\`). Transición materializada por ESTADO: \`needs-review\` re-aplicada con el PAT (sesión fresca por evento, latencia cero). Cap 1 por head SHA. \`${causaLine}\`\n\n${MARK}` });
              core.notice(`AP-040: needs-review re-aplicada para ${headSha.slice(0,7)} (relanzamiento por evento) — ${causaLine}.`);
              return;
            }
            // ── Rama CON veredicto (ADR-218): materializa la label lgtm.
            const lastV = (lastVc.body || '').trim().split(/\s/)[0].replace(':','');
            if (lastV === 'LGTM') {
              const res = await fetch(`https://api.github.com/repos/${O.owner}/${O.repo}/issues/${n}/labels`, {
                method: 'POST',
                headers: { Authorization: `Bearer ${process.env.ARM_PAT}`, Accept: 'application/vnd.github+json' },
                body: JSON.stringify({ labels: ['lgtm'] }) });
              if (!res.ok) core.warning(`label lgtm: HTTP ${res.status}`);
            } else {
              await github.rest.issues.removeLabel({ ...O, issue_number: n, name: 'lgtm' }).catch(() => {});
            }
