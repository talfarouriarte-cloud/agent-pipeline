            const QUOTE_CAP = 6000;
            async function freshClosingProse() {
              const trigTs = context.payload.comment ? new Date(context.payload.comment.created_at).getTime() : 0;
              // `listComments` ordena por `created` ASCENDENTE: la página 1 son
              // los 100 comentarios más ANTIGUOS. En un issue de épica con más
              // de 100 comentarios —los de varias rondas de re-arm, diagnósticos
              // de post-step, watchdog y architect-resolve, que son JUSTO los que
