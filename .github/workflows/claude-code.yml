                // el issue (el humano re-verifica contra HEAD antes de cerrar;
                // central no delega cierre, AP-019), y el parcial fantasma ya
                // consumió su slot del cap de rondas.
                //
                // ENMIENDA AP-054 (2026-07-27, review de este mismo PR): la
                // premisa «resto = placeholder» era válida porque el marcador
