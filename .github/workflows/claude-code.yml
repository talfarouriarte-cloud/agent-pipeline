name: Claude Code

# Dispara cuando aparece @claude en:
#  - el cuerpo o título de un issue (al abrirlo o editarlo)
#  - un comentario de issue
#  - un comentario de revisión sobre un PR
#  - el cuerpo de una review de PR
#
# El workflow del Reviewer (reviewer.yml) sigue separado.
# Loop Creator ↔ Reviewer post ADR-063: el Creator cierra con tag
# ([READY-TO-MERGE], [NEEDS-HUMAN], o @reviewer) y este workflow
# aplica las labels correspondientes. Cap de 3 comentarios de
# claude[bot] en el PR para evitar espirales. Kill-switch vía label
# `pause-agents`.

# CALLABLE (agent-pipeline): los triggers de evento viven en el stub del
# repo consumidor; este workflow hereda el contexto github.event del caller.
on:
  workflow_call:
    inputs:
      runner:
        description: Runner label (ej. ubuntu-latest, ubicloud-standard-2)
        type: string
        default: ubuntu-latest
      default_branch:
        description: Rama por defecto del repo consumidor
        type: string
        default: main
      creator_model:
        description: Modelo del Creator
        type: string
        default: claude-opus-5-5  # AP-087 (2026-09-25): decisión del propietario, criterio calidad/token; cierra AP-080
      creator_max_turns:
        description: max-turns del Creator
        type: number
        default: 200
      bot_comment_cap:
        description: Cap de comentarios de claude[bot] por PR antes de human-needed
        type: number
        default: 8
      epic_label:
        # Label que marca los issues de cadena (2026-07-13, wmcb#20): los guards
        # check_chain y check_panel la referenciaban SIN declararla — GitHub la
        # resolvía a "" en silencio y ambos guards nacieron inertes. Mismo
        # default que epic-merge y watchdog.
        type: string
        default: epica
      reviewer_workflow_name:
        # Valor de `name:` del stub del Reviewer en el consumidor. Lo usa el
        # dedupe del open-review-failsafe (AP-016) para identificar los runs del
        # Reviewer por su `name` (el run pertenece al stub caller). Mismo default
        # e idéntico contrato que watchdog.yml (reviewer_workflow_name).
        type: string
        default: Opus Reviewer
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      REVIEWER_GITHUB_TOKEN:
        required: true
      WORKFLOWS_PUSH_TOKEN:
        # Opcional (2026-07-15, decisión del propietario, enmienda AP-012):
        # PAT mínimo Contents+Workflows SIN Pull requests. Entra SOLO en el
        # checkout del job creator: los `git push` de la sesión pueden incluir
        # `.github/workflows/**` EN RAMA. Mergear le es imposible por
        # construcción (el PAT no tiene PRs; la App no mergea; main protegida
        # con enforce_admins). Sin el secret: comportamiento previo intacto
        # (consumidores sin cambios).
        required: false

jobs:
  claude:
    # Solo arranca si el evento contiene @claude. Esto reduce ruido y coste.
    #
    # FIX zero-width joiner (PR #205, 2026-05-23):
    # El action emite ocasionalmente un U+200D (zero-width joiner)
    # entre '@' y 'claude' al renderizar mentions del Reviewer. El
    # substring literal '@claude' deja de aparecer en el body y
    # contains() devuelve false. El Creator nunca arranca pese a que
    # el Reviewer cree haberlo invocado. El sentinel HTML comment
    # '<!-- ping-creator -->' es marca explícita de máquina, invisible
    # en el render del comment, emitida por el Reviewer junto al
    # '@claude' literal (que sigue visible para humanos). Convive con
    # '@claude' literal: humanos pingean a mano con '@claude' simple
    # y siguen disparando. Ver ADR-086.
    # GATE author_association (agent-pipeline, repos públicos): solo OWNER/
    # MEMBER/COLLABORATOR arman al Creator. Los pings de máquina (Reviewer,
    # epic-merge, watchdog) salen con el PAT del propietario ⇒ OWNER.
    if: |
      (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) &&
      ((github.event_name == 'issue_comment' && (contains(github.event.comment.body, '@claude') || contains(github.event.comment.body, '<!-- ping-creator -->'))) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))))

    runs-on: ${{ inputs.runner }}

    # Permisos mínimos para que Claude pueda escribir archivos, abrir PRs
    # y comentar issues. id-token sirve para OIDC si añadimos providers
    # alternativos (Bedrock, Vertex) en el futuro; no estorba dejarlo.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      # Preflight de credencial (AP-091, central#259 — asesoramiento#2318): el
      # PAT es punto único de fallo compartido por el primario (Guard serial) y
      # el rescate (Watchdog). Con el PAT revocado, cada arm quemaba 6-7 min de
      # setup para morir en el Guard serial con 401. PRIMER step del job: sin
      # checkout ni setup delante. 401 ×2 ⇒ escala y aborta; los steps
      # `always()` de abajo se gatean con `steps.preflight.outputs.dead`.
      - name: Preflight de credencial (fail-fast, AP-091)
        id: preflight
        uses: actions/github-script@v7
        env:
          PREFLIGHT_PAT: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
          PREFLIGHT_ROLE: creator
        with:
          script: |
            // Preflight de credencial fail-fast (AP-091, central#259). Primer step del
            // job: una llamada barata con el PAT ANTES de checkout/setup. 401 dos veces
            // (10 s entre intentos) ⇒ credencial INVÁLIDA: escalar por el canal de dedupe
            // AP-059 con el GITHUB_TOKEN del job (el PAT es justo lo que está muerto) y
            // abortar el job en segundos. Cualquier otro status (5xx, red) es fail-open:
            // el preflight solo aborta en credencial inválida, jamás por un GitHub lento.
            const { owner, repo } = context.repo;
            const O = { owner, repo };
            const PAT = process.env.PREFLIGHT_PAT || '';
            const ROLE = process.env.PREFLIGHT_ROLE || 'pipeline';
            const WAIT_MS = Number(process.env.PREFLIGHT_WAIT_MS || 10000);
            const MARK = '<!-- watchdog-heartbeat-escalation -->';   // dedupe COMPARTIDO (AP-059)
            const MODE = '<!-- pipeline-credential-401 -->';          // modo «credencial inválida»
            // Marcador ANCLADO a línea propia, jamás substring: una CITA del marcador en
            // prosa (backticks) dentro de un issue `human-needed` abierto no es una
            // escalada — con `includes()` silenciaba el canal entero (central#212).
            const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const anclado = (txt, m) => new RegExp('^[ \\t]*' + esc(m) + '[ \\t]*$', 'm').test(txt || '');

            async function probe() {
              try {
                const res = await fetch('https://api.github.com/rate_limit', {
                  headers: { Authorization: `Bearer ${PAT}`, Accept: 'application/vnd.github+json' } });
                return res.status;
              } catch (e) { core.info(`preflight: error de red (${e.message})`); return 0; }
            }
            const s1 = await probe();
            const s2 = s1 === 200 ? 200 : (await new Promise(r => setTimeout(r, WAIT_MS)), await probe());
            core.info(`preflight (${ROLE}): GET /rate_limit con el PAT ⇒ ${s1}${s1 === 200 ? '' : ` · reintento ⇒ ${s2}`}`);
            if (!(s1 === 401 && s2 === 401)) {
              if (s2 !== 200) core.warning(`preflight (${ROLE}): /rate_limit devolvió ${s1}/${s2}, no 401/401 — transitorio, sigo (fail-open).`);
              core.setOutput('dead', 'false');
              return;
            }
            core.setOutput('dead', 'true');
            const runUrl = `${process.env.GITHUB_SERVER_URL || 'https://github.com'}/${owner}/${repo}/actions/runs/${context.runId}`;
            const texto = [
              `El PAT del pipeline (\`REVIEWER_GITHUB_TOKEN\`) devuelve **401 Bad credentials** (2 intentos, ${WAIT_MS / 1000} s entre ellos). Detectado por el preflight del job \`${ROLE}\`, que ha abortado en segundos en vez de quemar el setup contra una credencial muerta.`,
              ``,
              `**Consecuencia mientras dure.** Creator (Guard serial), Watchdog (detect y rescates) y todo post-step que escriba con el PAT caen JUNTOS: el primario y el rescate comparten la credencial.`,
              ``,
              `**Qué hacer.** Runbook «Rotación del PAT» del central (\`docs/runbook-rotacion-pat.md\` en agent-pipeline): regenerar/actualizar el secret en TODOS los repos que lo consumen, verificar con \`gh api rate_limit\`, \`workflow_dispatch\` del Watchdog y confirmar \`success\`. Los arms que murieron durante la caída hay que re-armarlos (el Watchdog los recoge por \`issue-armed-no-pr\`).`,
              ``,
              `**Run:** ${runUrl}`,
            ].join('\n');
            try {
              let abiertas = [];
              try {
                abiertas = await github.paginate(github.rest.issues.listForRepo,
                  { ...O, labels: 'human-needed', state: 'open', per_page: 100 });
              } catch (e) { core.warning(`no se pudo listar escaladas abiertas (${e.message}): sigo, prefiero duplicar a callar.`); }
              const abierta = abiertas.find(i => !i.pull_request && anclado(i.body, MARK));
              if (abierta) {
                if (!anclado(abierta.body, MODE)) {
                  const previos = await github.paginate(github.rest.issues.listComments,
                    { ...O, issue_number: abierta.number, per_page: 100 });
                  if (!previos.some(c => anclado(c.body, MODE))) {
                    await github.rest.issues.createComment({ ...O, issue_number: abierta.number,
                      body: `**Transición de modo.** Credencial del pipeline inválida (PAT 401) mientras esta escalada seguía abierta por otro modo. Un solo issue a propósito.\n\n${texto}\n\n${MODE}` });
                  }
                }
                core.info(`escalada ya abierta (#${abierta.number}): no duplico.`);
              } else {
                await github.rest.issues.create({ ...O,
                  title: 'Credencial del pipeline inválida (PAT 401) — intervención humana',
                  labels: ['human-needed'], body: `${texto}\n\n${MODE}\n${MARK}` });
                core.warning('preflight: escalada human-needed abierta (credencial inválida).');
              }
            } catch (e) { core.warning(`preflight: la escalada falló (${e.message}); el aborto sigue en pie.`); }
            core.setFailed(`PAT del pipeline inválido (401 ×2): job \`${ROLE}\` abortado por el preflight de credencial (AP-091).`);

      # Kill-switch: si el issue/PR tiene la label `pause-agents`,
      # aborta sin correr el agente. ADR-063.
      - name: Check pause-agents kill-switch
        id: check_pause
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue?.labels
              || context.payload.pull_request?.labels
              || [];
            const paused = labels.some(l => l.name === 'pause-agents');
            if (paused) {
              core.notice('Label `pause-agents` presente. Abortando Creator.');
            }
            core.setOutput('paused', paused);

      # Vuelo único del Creator en contexto PR (central#309, ruling mensual
      # 2026-10-05). El árbitro de AP-033 (ganador = menor `run_id`) sólo corría
      # en contexto issue (Guard serial): dos disparos sobre un PR ya abierto
      # (`issue_comment` sobre PR, `pull_request_review_comment`,
      # `pull_request_review`) con un minuto de diferencia producían dos
      # sesiones del Creator sobre la MISMA rama (finplan#2677 y #2689, dos
      # cancelaciones manuales en un día). Contendientes = runs de este workflow
      # caller `in_progress`/`queued`, con `run_id` MENOR, sobre el MISMO item
      # (título del PR, título del issue de su rama `claude/issue-N-*`, o misma
      # `head_branch`) y cuyo job del Creator NO está `skipped`: un comentario
      # sin trigger lanza un run que muere en el `if` del job y no puede tumbar
      # a un disparo legítimo. Sin reintento temporizado: el más nuevo siempre
      # ve al más viejo y la decisión por id es determinista. El perdedor sale
      # SIN sesión y deja UNA línea sin marcador ni mención (token del job: su
      # comentario no dispara nada). Ninguna rama de este step cuelga
      # `stalled`, `human-needed` ni `serial-activo`. Fail-closed sólo en lo
      # ilegible (jobs de un contendiente sin leer ⇒ cuenta): perder un ping
      # es visible y se repite; un doble Creator no. API de runs caída ⇒ pasa
      # (statu quo previo). Banco: scripts/check-flight-guard.mjs.
      - name: Guard de vuelo único — un Creator por PR (contexto PR)
        id: check_flight
        if: |
          steps.check_pause.outputs.paused != 'true'
          && (
            (github.event_name == 'issue_comment' && github.event.issue.pull_request)
            || github.event_name == 'pull_request_review'
            || github.event_name == 'pull_request_review_comment'
          )
        uses: actions/github-script@v7
        env:
          DEFAULT_GH_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request?.number || context.payload.issue?.number;
            let pr = context.payload.pull_request || null;
            if (!pr || !pr.head) {
              try { ({ data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number })); }
              catch (e) { pr = null; core.warning(`vuelo único: PR #${number} ilegible (${e.message}); se identifica sólo por título.`); }
            }
            const titles = new Set([pr?.title || context.payload.issue?.title].filter(Boolean));
            const branch = pr?.head?.ref || '';
            const m = branch.match(/^claude\/issue-(\d+)-/);
            if (m) {
              try {
                const { data: src } = await github.rest.issues.get({ owner, repo, issue_number: Number(m[1]) });
                if (src.title) titles.add(src.title);
              } catch (e) { core.info(`vuelo único: issue #${m[1]} de la rama ilegible (${e.message}).`); }
            }
            // Mismo filtro de edad que el Guard serial (runs fantasma en `queued`).
            const MAX_RUN_AGE_MS = 6 * 60 * 60 * 1000;
            const nowMs = Date.now();
            const runs = [];
            try {
              for (const status of ['in_progress', 'queued']) {
                const { data } = await github.rest.actions.listWorkflowRunsForRepo({ owner, repo, status, per_page: 100 });
                runs.push(...(data.workflow_runs || []).filter(r =>
                  (nowMs - new Date(r.created_at).getTime()) < MAX_RUN_AGE_MS));
              }
            } catch (e) {
              core.warning(`vuelo único: no se pudo listar runs (${e.message}); se deja pasar (statu quo previo).`);
              core.setOutput('blocked', 'false');
              return;
            }
            const older = runs.filter(r => r.name === context.workflow
              && r.id < context.runId
              && (titles.has(r.display_title) || (branch && r.head_branch === branch)));
            const contenders = [];
            for (const r of older) {
              let live = true;
              try {
                const { data: jl } = await github.rest.actions.listJobsForWorkflowRun({ owner, repo, run_id: r.id, per_page: 50 });
                const jobs = jl.jobs || [];
                const creatorJobs = jobs.filter(j => j.name === 'claude' || / \/ claude$/.test(j.name || ''));
                const pool = creatorJobs.length ? creatorJobs : jobs;
                if (pool.length && pool.every(j => j.conclusion === 'skipped')) live = false;
              } catch (e) {
                core.warning(`vuelo único: jobs del run ${r.id} ilegibles (${e.message}); cuenta como contendiente.`);
              }
              if (live) contenders.push(r.id);
            }
            if (contenders.length === 0) {
              core.setOutput('blocked', 'false');
              return;
            }
            const winner = Math.min(...contenders);
            const gh = getOctokit(process.env.DEFAULT_GH_TOKEN);
            await gh.rest.issues.createComment({ owner, repo, issue_number: number,
              body: `ya hay un Creator en vuelo (run ${winner}); este disparo se descarta — repítelo cuando termine.` })
              .catch(e => core.warning(`vuelo único: comentario de descarte falló (${e.message}).`));
            core.setOutput('blocked', 'true');
            core.warning(`vuelo único: run ${context.runId} cede ante ${winner} sobre #${number}.`);

      # Cap de iteraciones: si en este PR ya hay 3+ comentarios de
      # claude[bot] y el disparo viene de un bot (Reviewer), asume
      # loop runaway, añade label `human-needed` y para. Si el
      # disparo viene de un humano, el cap NO aplica (override).
      # ADR-063.
      #
      # Ajustar CAP empíricamente si tu agente añade un comentario
      # de resumen al abrir el PR (en cuyo caso CAP-1 = iteraciones
      # efectivas Reviewer↔Creator).
      - name: Check iteration cap (PR contexts only)
        id: check_iterations
        if: steps.check_pause.outputs.paused != 'true' && steps.check_flight.outputs.blocked != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            // CAP cuenta TODOS los comentarios de claude[bot] (Creator + Reviewer
            // combinados). Una ronda completa Reviewer→Creator añade ~2 comentarios.
            // CAP=8 permite ~3-4 rondas antes de escalar a humano. Si emergen loops
            // bot↔bot patológicos, bajar; si el flow se atasca legítimamente, subir.
            const CAP = ${{ inputs.bot_comment_cap }};

            // Skip si sender es humano; cap solo aplica a loops bot↔bot.
            if (context.payload.sender?.type === 'User') {
              core.setOutput('cap_reached', false);
              return;
            }

            // Resolver número del PR si el contexto es un PR.
            const isPRComment =
              context.eventName === 'issue_comment'
              && !!context.payload.issue?.pull_request;
            const isPRReviewEvent =
              context.eventName === 'pull_request_review'
              || context.eventName === 'pull_request_review_comment';
            if (!isPRComment && !isPRReviewEvent) {
              core.setOutput('cap_reached', false);
              return;
            }

            const prNumber = context.payload.issue?.number
              || context.payload.pull_request?.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const botComments = comments.filter(
              c => c.user.login === 'claude[bot]'
            );

            if (botComments.length >= CAP) {
              core.notice(
                `Cap de ${CAP} comentarios de claude[bot] alcanzado `
                + `(actual: ${botComments.length}). Añadiendo label `
                + `\`human-needed\` y parando.`
              );
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: ['human-needed'],
              });
              core.setOutput('cap_reached', true);
            } else {
              core.setOutput('cap_reached', false);
            }

      # GUARD de integridad de cadena (v1.2, incidente wmcb 2026-07-11):
      # antes de disparar al Creator sobre un issue `epica`, verificar que la
      # cadena alcanzable via launch-next termina en epic-audit. Una cadena
      # sin auditoría al final es defecto de horneado: se marca stalled y NO
      # se quema una sesión de agente. Solo aplica al arm de issues (no PRs).
      # AP-096 (central#260): el guard de horneado de invariantes (AP-021 +
      # AP-029) corre también en el arm de un issue `correctivo` SUELTO (sin
      # `epica`), sobre el body del propio issue. Banco: check-bake-guard.mjs.
      - name: Check epic chain integrity (issues only)
        id: check_chain
        if: |
          steps.check_pause.outputs.paused != 'true'
          && steps.check_iterations.outputs.cap_reached != 'true'
        uses: actions/github-script@v7
        env:
          IN_EPIC_LABEL: ${{ inputs.epic_label }}
        with:
          github-token: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const isIssueCtx = !!context.payload.issue && !context.payload.issue.pull_request;
            if (!isIssueCtx) { core.setOutput('broken', 'false'); return; }
            const issue = context.payload.issue;
            if (!process.env.IN_EPIC_LABEL) { core.setFailed('guard de cadena: epic_label vacío — el guard no puede operar (wmcb#20: nunca bypass silencioso)'); return; }
            const labels = (issue.labels || []).map(l => l.name);
            const isEpic = labels.includes(process.env.IN_EPIC_LABEL);
            // AP-096 (central#260): el guard de horneado (AP-021 + AP-029) se
            // extiende a TODO arm desde issue con label `correctivo`, no solo al
            // primer eslabón de una `epica`. Motivo medido: 6 sueltos
            // `correctivo` de asesoramiento-financiero (#2287, #2292, #2316,
            // #2340, #2347, #2352) llegaron al Creator sin bloque de invariantes
            // ni `invariantes-na`; la costura era memoria de sesión del
            // Architect y se perdió incluso tras su compromiso explícito (#2294).
            // Label fija (como el panel de auditoría de este mismo workflow),
            // provisionada en templates/labels.json.
            const isCorrectivo = labels.includes('correctivo');
            if (!isEpic && !isCorrectivo) { core.setOutput('broken', 'false'); return; }
            const armBody = context.payload.comment?.body || '';
            // Un eslabón NO-raíz se (re)arma por DOS vías (central#59 review):
            // (1) epic-merge encadena con `epic-auto-launch`; (2) el watchdog
            // re-arma con `watchdog-rearm` cuando el Creator muere sin PR. En
            // ambas el eslabón ya superó el guard una vez (con bloque, con
            // `invariantes-na`, o por ser aguas abajo) — el arm inicial sin
            // bloque aborta ANTES de armar Creator, así que nunca hay un Creator
            // que muera y dispare un `watchdog-rearm` inicial: eximirlo no oculta
            // ninguna omisión real. En una cadena, además, la casa canónica del
            // bloque (el issue de épica) queda AGUAS ARRIBA, invisible al
            // traversal forward desde el eslabón intermedio.
            // (3) central#313: un eslabón SUSPENDIDO (cedido a una
            // `prioridad:urgente`) llega por la cola (`arm-de-cola`) y no por
            // `epic-auto-launch`, pero es exactamente el eslabón que esa vía
            // habría armado: lleva en su historial el marcador de confianza
            // `<!-- eslabon-suspendido: #<PR> -->` que se escribe al suspenderlo.
            let isChainRearm = armBody.includes('epic-auto-launch') || armBody.includes('watchdog-rearm');
            if (!isChainRearm && armBody.includes('arm-de-cola')) {
              const TRUSTED_SUSP = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
              const { data: hist } = await github.rest.issues.listComments({ owner, repo, issue_number: issue.number, per_page: 100 });
              isChainRearm = hist.some(c => TRUSTED_SUSP.has(c.author_association)
                && /^[ \t]*<!--\s*eslabon-suspendido(?::\s*#?\d+)?\s*-->[ \t]*$/m.test(String(c.body || '').replace(/```[\s\S]*?```/g, ' ').replace(/`[^`\n]*`/g, ' ')));
            }
            // Guard de horneado (AP-021 + AP-029), compartido por los dos
            // perímetros: `scope` = 'epica' (primer eslabón; el bloque se busca en
            // la cadena) | 'suelto' (arm de un `correctivo` fuera de cadena; el
            // bloque vive en el propio issue). Devuelve true si el arm NO
            // continúa (stall materializado).
            const bakeGuard = async (hasInvariants, invariantsBody, scope) => {
              if (isChainRearm) return false;
              // AP-018 §1+§2 (central#55): estado materializado, no inferido.
              // Se LEE por-issue (listComments = fuertemente consistente, NO el
              // search index); reusada para el dedup del stall y el force
              // pegajoso `invariantes-na`.
              const { data: existing } = await github.rest.issues.listComments({ owner, repo, issue_number: issue.number, per_page: 100 });
              const TRUSTED = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
              // Force PEGAJOSO doc-only (AP-021, mismo criterio que `panel-ok`
              // AP-018 §3): vale en CUALQUIER comentario de confianza del issue —
              // un re-arm posterior no lo pierde. Pasa en SILENCIO, cero re-avisos
              // y cero re-stalls (converge con el dedup de AP-018 §2).
              const naDeclared = existing.some(c => /<!--\s*invariantes-na\s*-->/.test(c.body || '') && TRUSTED.has(c.author_association));
              if (naDeclared) return false;
              const where = scope === 'suelto'
                ? 'este issue `correctivo` (suelto, fuera de cadena) no declara el bloque `## Invariantes funcionales` en su body (AP-096, central#260: el guard cubre también los correctivos sueltos)'
                : 'ningún issue de la cadena declara el bloque `## Invariantes funcionales de la épica` (casa canónica: el issue de épica)';
              const editTarget = scope === 'suelto' ? 'edita ESTE issue' : 'edita el issue de épica';
              if (!hasInvariants) {
                // AP-021 (central#59): el aviso `sin-invariantes` era INFORMATIVO
                // SIN CONSUMIDOR — disparaba, el arm CONTINUABA y nadie tenía en
                // su mandato responderlo (finplan#1378, #1394). Un aviso que el
                // sistema puede ignorar indefinidamente es ruido, no una costura
                // (protocol.md §1-2): se MATERIALIZA como transición con dueño.
                // `stalled` (⇒ architect-resolve POR EVENTO — el step usa el PAT
                // REVIEWER_GITHUB_TOKEN, así el `labeled=stalled` dispara el
                // watchdog; patrón `creator-blocked`/finplan#1350) + diagnóstico
                // dedupeado por marcador. El arm NO continúa (broken='true'): los
                // steps de abajo lo gatean, así que check_serial NO corre y NO
                // cuelga `serial-activo` (el orden check_chain→check_serial ya lo
                // garantiza).
                await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ['stalled'] });
                const alreadyStalled = existing.some(c => /<!--\s*sin-invariantes-stall\s*-->/.test(c.body || ''));
                if (!alreadyStalled) {
                  await github.rest.issues.createComment({ owner, repo, issue_number: issue.number,
                    body: `**claude-code · guard de horneado**: ${where}. Sin él, la verificación funcional de la auditoría degrada a la DoD del Creator como sustituto — coste que el Auditor paga época tras época (finplan#1378, #1394; sueltos asesoramiento-financiero#2287/#2292/#2316). El arm NO continúa: se materializa como transición con dueño (\`stalled\` ⇒ architect-resolve por evento). Resolución en un run de architect-resolve: (a) TIENE superficie funcional ⇒ ${editTarget} añadiendo ${scope === 'suelto' ? '1-4' : '2-4'} invariantes ejecutables derivados del ADR citado bajo el bloque, cada uno con su línea \`pre-épica: rojo|verde — <por qué>\` (AP-029), y des-stallea/re-arma; o (b) es doc-only ⇒ declara \`<!-- invariantes-na -->\` (force pegajoso) y des-stallea/re-arma.\n\n<!-- sin-invariantes-stall -->` });
                }
                return true;
              }
              // AP-029 (central#89 — recurrencia POST-fix de central#77 en
              // finplan#1476): la PRESENCIA del bloque NO basta. Se MATERIALIZA la
              // declaración del resultado esperado pre-épica (dry-run) como
              // PRECONDICIÓN del arm: el bloque debe llevar ≥1 línea ANCLADA
              // `pre-épica: rojo|verde — <por qué>` (anclada a inicio de línea,
              // jamás substring — clase 6 del pipeline-map). Límite honesto: el
              // guard fuerza la DECLARACIÓN (≥1), no la ejecución ni la
              // completitud per-invariante; la red per-invariante y la
              // reconciliación declarado-vs-observado es el Auditor. Mismo
              // desenlace que `sin-invariantes-stall`, marcador propio
              // `dry-run-ausente-stall`, mismas exenciones y dedup (AP-018 §1).
              // Riesgo 2 (falsos stalls sobre cadenas horneadas con formato viejo,
              // sin el token): gate «solo issues nuevos» por fecha de creación del
              // issue armado — el token se definió el 2026-07-18.
              const DRYRUN_CUTOVER = Date.parse('2026-07-18T00:00:00Z');
              const issueCreated = Date.parse(issue.created_at || '');
              const preexisting = Number.isFinite(issueCreated) && issueCreated < DRYRUN_CUTOVER;
              // Token tolerante a la tilde (pre-épica / pre-epica); anclado a
              // inicio de línea con `m`, tolera sangría de lista, jamás substring.
              const hasDryRun = /^[ \t]*pre-[eé]pica:\s*(rojo|verde)\b/im.test(invariantsBody);
              if (preexisting || hasDryRun) return false;
              await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ['stalled'] });
              const alreadyDryRunStalled = existing.some(c => /<!--\s*dry-run-ausente-stall\s*-->/.test(c.body || ''));
              if (!alreadyDryRunStalled) {
                // AP-096 (central#255 punto 3): diagnóstico auto-legible — lista
                // las líneas CANDIDATAS `pre-<algo>:` que el guard NO reconoce
                // (p. ej. `pre-correctivo:` ×3, asesoramiento-financiero#2305),
                // para que architect-resolve y el 5-whys vean el desajuste de
                // vocabulario sin releer el body. NO cambia el veredicto: no hay
                // alias — un vocabulario, una fila (protocol.md). Las líneas con
                // el token `pre-épica:` correcto pero en FORMA no reconocida
                // (viñeta, valor en negrita, valor fuera de rojo|verde) se listan
                // aparte: desajuste de forma, no de vocabulario.
                const cand = {};
                const malformed = [];
                for (const mm of invariantsBody.matchAll(/^[ \t]*[-*]?[ \t]*(pre-[^\s:`]+):.*$/gim)) {
                  const tok = mm[1].toLowerCase();
                  if (/^pre-[eé]pica$/.test(tok)) {
                    const line = mm[0].trim();
                    malformed.push(line.length > 80 ? line.slice(0, 80) + '…' : line);
                    continue;
                  }
                  cand[tok] = (cand[tok] || 0) + 1;
                }
                const candList = Object.entries(cand).map(([t, n]) => `\`${t}:\` ×${n}`).join(', ');
                const malformedNote = malformed.length
                  ? ` Líneas con el token \`pre-épica:\` pero en forma NO reconocida (el guard exige \`pre-épica: rojo|verde\` a inicio de línea, sin viñeta ni negrita): ${malformed.map(l => `\`${l.replace(/`/g, "'")}\``).join(', ')} ×${malformed.length}.`
                  : '';
                const candNote = (candList
                  ? ` Líneas candidatas NO reconocidas en el bloque: ${candList} — el token es \`pre-épica:\` VERBATIM también en correctivos (vocabulario del guard, no descripción del momento); basta renombrarlas si el dry-run ya está ejecutado.`
                  : (malformed.length ? '' : ' No se encontró ninguna línea candidata `pre-<algo>:` en el bloque.')) + malformedNote;
                const blockName = scope === 'suelto' ? '`## Invariantes funcionales`' : '`## Invariantes funcionales de la épica`';
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number,
                  body: `**claude-code · guard de horneado**: el bloque ${blockName} está presente pero NINGÚN invariante declara su estado esperado pre-épica (línea anclada \`pre-épica: rojo|verde — <por qué>\`).${candNote} Sin esa declaración el dry-run de invariantes queda como disciplina de sesión sin consumidor mecánico y un invariante insatisfacible de origen llega intacto al Auditor (recurrencia POST-fix de central#77: épica finplan#1471 → finplan#1476, Invariante #3). El arm NO continúa: se materializa como transición con dueño (\`stalled\` ⇒ architect-resolve por evento). Resolución en un run de architect-resolve: EJECUTA el dry-run de cada invariante contra el árbol actual, ${editTarget} añadiendo bajo cada uno la línea \`pre-épica: rojo|verde — <por qué>\` y la cita de la cláusula ADR que protege (\`⇐ <cláusula>\`), y des-stallea/re-arma; o si es doc-only declara \`<!-- invariantes-na -->\` (force pegajoso) y des-stallea/re-arma.\n\n<!-- dry-run-ausente-stall -->` });
              }
              return true;
            };
            const runSueltoGuard = async () => {
              const b = issue.body || '';
              const broken = await bakeGuard(/invariantes funcionales/i.test(b), b, 'suelto');
              core.setOutput('broken', broken ? 'true' : 'false');
            };
            // Correctivo SUELTO (sin label de épica): el bloque vive en el propio
            // issue; no hay cadena que recorrer.
            if (!isEpic) { await runSueltoGuard(); return; }
            // Traversal launch-next con cap 20. De paso (wmcb#21): ¿algún body
            // de la cadena declara «Invariantes funcionales»? La casa canónica
            // es el issue de épica (#14 fijó el lado lector; esto cubre el
            // horneado: la omisión se ve AL ARMAR, cuando aún es editable).
            let body = issue.body || '';
            let hops = 0;
            let hasInvariants = false;
            let invariantsBody = ''; // AP-029: cuerpo donde vive el bloque, para el dry-run
            while (hops++ < 20) {
              if (/invariantes funcionales/i.test(body)) { hasInvariants = true; if (!invariantsBody) invariantsBody = body; }
              if (/<!--\s*epic-audit:/.test(body)) {
                const broken = await bakeGuard(hasInvariants, invariantsBody, 'epica');
                core.setOutput('broken', broken ? 'true' : 'false');
                return;
              }
              const m = body.match(/<!--\s*launch-next:\s*#?(\d+)\s*-->/);
              if (!m) break; // sin sentinel y sin epic-audit: cadena rota aquí
              const next = await github.rest.issues.get({ owner, repo, issue_number: Number(m[1]) });
              body = next.data.body || '';
            }
            // Caso DEGENERADO vs multi-eslabón roto (2026-07-15, central#36 —
            // 5-whys de wmcb#61: la «épica 1/1» sin sentinels ES un suelto
            // disfrazado; la única salida era la escalada aunque la remediación
            // es derivable — 1h21m de intervención humana que esto mecaniza).
            // Degenerado = el PROPIO issue no tiene launch-next (hops==1 y sin
            // sentinel alguno): degradar a régimen suelto y CONTINUAR el arm.
            // Multi-eslabón roto = la cadena se rompe aguas abajo: re-hornear
            // es decisión del Architect, NO derivable — escalada como hoy.
            if (hops === 1) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: process.env.IN_EPIC_LABEL }).catch(() => {});
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number,
                body: `**claude-code · guard de cadena**: este issue lleva la label \`${process.env.IN_EPIC_LABEL}\` pero no forma cadena (sin \`launch-next\` ni \`epic-audit\`): «épica de un eslabón» = issue SUELTO. Degradado al régimen de sueltos (label retirada) — el arm CONTINÚA; el pipeline hará PR → review → merge → auditoría automática al cierre.\n\n<!-- cadena-degradada-a-suelto -->` });
              // AP-096: degradado a suelto, un `correctivo` pasa además el guard
              // de horneado de sueltos (mismo perímetro que el arm directo).
              if (isCorrectivo) { await runSueltoGuard(); return; }
              core.setOutput('broken', 'false');
              return;
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ['stalled'] });
            await github.rest.issues.createComment({ owner, repo, issue_number: issue.number,
              body: '**claude-code · guard de cadena**: la cadena alcanzable desde este issue via launch-next NO termina en un sentinel epic-audit (defecto de horneado multi-eslabón: re-hornear es decisión del Architect). No se arma al Creator; escalado via `stalled`.\n\n<!-- cadena-sin-auditoria -->' });
            core.setOutput('broken', 'true');

      # GUARD de panel consumido (2026-07-12, 3ª recurrencia de la clase
      # «limpieza de cola saltada en el lanzamiento»: R·5+R·6, proof-fase-b,
      # G1/G2 — la limpieza dependía de que la sesión del Architect que lanza
      # RECORDARA el protocolo, y las sesiones no comparten contexto). Antes
      # de armar manualmente un issue `epica`, el panel de la épica anterior
      # (auditorías y process-proposals abiertas) debe estar consumido: cada
      # cierre con su línea de resolución. Exenciones mecánicas: arms de
      # epic-merge (epic-auto-launch), correctivos de una auditoría viva (el
      # body cita el nº de una auditoría abierta) y override explícito
      # `<!-- panel-ok -->` en el comentario de arm. Solo issues, no PRs.
      # central#320: se evalúa AL ENCOLAR — este step va ANTES del guard serial
      # y lo gatea (`check_serial` exige `check_panel.blocked != 'true'`), así
      # que un arm bloqueado aquí nunca entra en `en-cola`; la salida de cola
      # (`arm-de-cola`) está exenta. NO reordenar estos dos steps.
      # Banco: scripts/check-panel-al-encolar.mjs.
      - name: Check panel consumed (issues only)
        id: check_panel
        if: |
          steps.check_pause.outputs.paused != 'true'
          && steps.check_iterations.outputs.cap_reached != 'true'
          && steps.check_chain.outputs.broken != 'true'
        uses: actions/github-script@v7
        env:
          IN_EPIC_LABEL: ${{ inputs.epic_label }}
        with:
          github-token: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const isIssueCtx = !!context.payload.issue && !context.payload.issue.pull_request;
            if (!isIssueCtx) { core.setOutput('blocked', 'false'); return; }
            const issue = context.payload.issue;
            if (!process.env.IN_EPIC_LABEL) { core.setFailed('guard de panel: epic_label vacío — el guard no puede operar (wmcb#20: nunca bypass silencioso)'); return; }
            const labels = (issue.labels || []).map(l => l.name);
            if (!labels.includes(process.env.IN_EPIC_LABEL)) { core.setOutput('blocked', 'false'); return; }
            const armBody = context.payload.comment?.body || '';
            // Exención 1: arm mecánico de epic-merge (encadenado mid-épica)
            if (armBody.includes('epic-auto-launch')) { core.setOutput('blocked', 'false'); return; }
            // Comentarios del issue: base del force PEGAJOSO (§3) y del dedup del
            // bloqueo (§1). listComments = lectura por-issue fuertemente
            // consistente (NO el search index). Una sola lectura, reusada.
            const { data: issueComments } = await github.rest.issues.listComments({ owner, repo, issue_number: issue.number, per_page: 100 });
            // Exención 2: override explícito `panel-ok`. AP-018 §3 (central#55): el
            // force es PEGAJOSO. El hecho que certifica («el panel está
            // consumido») es por-ISSUE, no por-comentario; exigirlo en CADA arm
            // hacía que un re-arm posterior sin repetir el marcador reabriera el
            // bloqueo (finplan run 29453493296, arm de 21:53Z abortado por el
            // mismo guard tras el force de 21:09Z). Se lee de CUALQUIER comentario
            // de confianza del issue (OWNER/MEMBER/COLLABORATOR — mismo gate de
            // actor que el arm; en repo público un comentario ajeno no debe
            // forzar) o del comentario de arm actual.
            const TRUSTED = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            // Exención 4 (AP-032, repesca finplan#1471): REANUDACIÓN de cadena en
            // vuelo. El guard existe para impedir LANZAR una épica NUEVA sobre
            // paneles sin leer; NO para congelar la continuación de una cadena YA
            // en vuelo cuyo panel NACIÓ durante esa misma cadena (finplan#1471:
            // 3 forces `panel-ok` —#1471/#1478/#1477—, todos justificados, todos
            // causados por paneles que no debían bloquear la continuación de una
            // cadena a medias). Discriminador determinista LANZAR vs REANUDAR: un
            // eslabón NO-primero de una cadena SIEMPRE recibió el arm de
            // epic-merge con `<!-- epic-auto-launch -->` (posteado con el PAT
            // REVIEWER_GITHUB_TOKEN ⇒ comentario de confianza) cuando su
            // predecesor cerró-COMPLETO — merge o cierre por estado (AP-031); el
            // PRIMER eslabón de una cadena nueva JAMÁS lo lleva (lo arma el
            // Auditor/humano). La Exención 1 solo mira el armBody ACTUAL —
            // insuficiente: un eslabón downstream se re-arma por OTRA vía tras el
            // epic-auto-launch (release de cola `arm-de-cola`, `watchdog-rearm`,
            // arm manual) y pierde el marcador en el armBody PERO no en el
            // historial de comentarios (ya leído para `panelOk`, sin API extra —
            // fuertemente consistente, no el search index). «epic-auto-launch
            // presente» ⟺ «eslabón anterior cerrado-completo» ⟺ reanudación, sin
            // juicio del actor. Falso-positivo imposible: epic-merge SOLO postea
            // el marcador al lanzar el SUCESOR de un `launch-next`, nunca sobre un
            // primer eslabón. Staleness segura: el gate TRUSTED es anti-spoof y
            // una omisión solo PIERDE la exención (cae al force `panel-ok` de
            // hoy), nunca la concede de más — el bloqueo por panel del PRIMER
            // eslabón queda intacto.
            // central#313: el marcador `eslabon-suspendido` equivale a
            // `epic-auto-launch` a estos efectos — epic-merge lo escribe en el
            // MISMO punto (sucesor de un `launch-next` cerrado-completo) cuando
            // cede el turno a una urgente; el eslabón sale después por la cola.
            const isResumption = issueComments.some(c => TRUSTED.has(c.author_association)
              && (/<!--\s*epic-auto-launch\s*-->/.test(c.body || '')
                || /^[ \t]*<!--\s*eslabon-suspendido(?::\s*#?\d+)?\s*-->[ \t]*$/m.test(String(c.body || '').replace(/```[\s\S]*?```/g, ' ').replace(/`[^`\n]*`/g, ' '))));
            if (isResumption) { core.setOutput('blocked', 'false'); return; }
            // Exención 5 (central#320, ruling mensual 2026-10-05): SALIDA DE COLA.
            // El guard protege la DECISIÓN de lanzar y se evalúa cuando se toma
            // (el arm), no cuando la cola la ejecuta. Este step corre ANTES del
            // guard serial (`check_serial` se gatea con `check_panel.blocked`):
            // un arm con panel sin consumir NO llega a encolarse, así que todo
            // ítem `en-cola` pasó ya este guard al encolar. Sin la exención, el
            // pop lo re-evaluaba contra paneles nacidos DURANTE la espera — y
            // epic-merge abre la auditoría del ítem mergeado justo antes del pop,
            // así que toda épica que salía de la cola tras un merge quedaba
            // bloqueada (asesoramiento-financiero#2706 por la auditoría #2732).
            // Exento: (i) el arm de la cola (`<!-- arm-de-cola -->` en el
            // armBody); (ii) un issue con comentario de confianza `arm-de-cola`
            // POSTERIOR a su encolado (marcador de confianza `serial-guard` o
            // `pausa-cola-retenido`, escritos tras pasar este guard) — cubre el
            // `watchdog-rearm` y los re-arms de architect-resolve de un issue
            // que ya salió de la cola. Mismo patrón de lectura TRUSTED que
            // `isResumption`, sobre la misma lectura `issueComments`. Hueco
            // transitorio ACEPTADO: los encolados previos a este despliegue
            // entraron en cola sin el orden garantizado y salen exentos igual.
            const RE_ARM_COLA = /<!--\s*arm-de-cola\s*-->/;
            const RE_ENCOLADO = /<!--\s*(?:serial-guard|pausa-cola-retenido(?::\s*#?\d+)?)\s*-->/;
            const trusted = issueComments.filter(c => TRUSTED.has(c.author_association));
            const encolados = trusted.filter(c => RE_ENCOLADO.test(c.body || '')).map(c => Date.parse(c.created_at || ''));
            const primerEncolado = encolados.length ? Math.min(...encolados) : NaN;
            const salioDeCola = RE_ARM_COLA.test(armBody)
              || (Number.isFinite(primerEncolado)
                && trusted.some(c => RE_ARM_COLA.test(c.body || '') && Date.parse(c.created_at || '') >= primerEncolado));
            if (salioDeCola) { core.notice(`guard de panel: #${issue.number} sale de la cola — panel evaluado al encolar (central#320).`); core.setOutput('blocked', 'false'); return; }
            const panelOk = /<!--\s*panel-ok\s*-->/.test(armBody)
              || issueComments.some(c => /<!--\s*panel-ok\s*-->/.test(c.body || '') && TRUSTED.has(c.author_association));
            if (panelOk) { core.setOutput('blocked', 'false'); return; }
            // Panel: auditorías y propuestas abiertas (dedup por nº — un issue con
            // ambas labels aparecería dos veces).
            const openByNum = new Map();
            for (const lbl of ['auditoria', 'process-proposal']) {
              const res = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: lbl, per_page: 50 });
              for (const i of res.data) if (!i.pull_request) openByNum.set(i.number, i);
            }
            // AP-019 (central#55, agravante ESTRUCTURAL): estado DECLARADO de
            // consumo. La clase raíz era que «panel consumido» solo se podía
            // materializar CERRANDO el panel, y `close` está fuera del allowlist de
            // TODOS los agentes ⇒ un guard que solo un humano podía apagar
            // (finplan#1381: consumo declarado 3× e ignorado por el guard porque el
            // issue seguía `open`). Doctrina estado-materializado (AP-008/AP-018):
            // el guard acepta el estado DECLARADO `<!-- panel-consumido: #N -->` de
            // CUALQUIER comentario de confianza del issue (mismo gate de actor que
            // `panel-ok`; reusa la lectura `issueComments`, sin API extra) —
            // declarar es un comentario, DENTRO del allowlist de todo agente. NO se
            // expande el allowlist destructivo del watchdog con `close` (opción A
            // del fork: más blast radius sobre el ciclo de vida del issue,
            // reestructura del Architect). El cierre real del panel puede seguir
            // ocurriendo después (signal-closer, epic-merge, humano); el guard ya
            // no depende HARD de él.
            const consumed = new Set();
            for (const c of issueComments) {
              if (!TRUSTED.has(c.author_association)) continue;
              for (const m of (c.body || '').matchAll(/<!--\s*panel-consumido:\s*#?(\d+)\s*-->/g)) consumed.add(Number(m[1]));
            }
            // AP-098 (central#279, ruling mensual 2026-09-30; sustituye al punto 3
            // del ruling de #267): panel consumido = VEREDICTO DEL AUDITOR. Una
            // auditoría abierta con `audit-verdict` está consumida a efectos de
            // arm aunque siga abierta esperando su lote de revisión de proceso
            // (hasta 14 días): la revisión de proceso ya no gatea arms. Solo
            // auditorías; una `process-proposal` local abierta sigue contando.
            // Fail-closed: si los comentarios de un panel no se pueden leer,
            // ese panel cuenta como SIN consumir (statu quo, nunca peor).
            const RE_VERDICT = /<!--\s*audit-verdict:\s*(clean|findings)\s*-->/;
            for (const i of openByNum.values()) {
              if (consumed.has(i.number)) continue;
              if (!(i.labels || []).map(l => l.name).includes('auditoria')) continue;
              try {
                const cs = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: i.number, per_page: 100 });
                if (cs.some(c => RE_VERDICT.test(c.body || ''))) consumed.add(i.number);
              } catch (e) {
                core.warning(`guard de panel: comentarios de #${i.number} ilegibles (${e.message}) — cuenta como sin consumir.`);
              }
            }
            const open = [...openByNum.values()].filter(i => !consumed.has(i.number));
            if (!open.length) { core.setOutput('blocked', 'false'); return; }
            // Exención 3: correctivo de una auditoría viva — su body cita el nº
            const body = issue.body || '';
            const cited = new Set([...body.matchAll(/#(\d+)/g)].map(m => Number(m[1])));
            const audits = open.filter(i => (i.labels || []).map(l => l.name).includes('auditoria'));
            if (audits.some(a => cited.has(a.number))) { core.setOutput('blocked', 'false'); return; }
            // BLOQUEO: panel sin consumir. AP-018 §1 (central#55): dedup por
            // marcador. El bloqueo se materializa UNA vez; el doble disparo
            // (issues+issue_comment del mismo arm) y los re-arms con el panel aún
            // sin consumir NO reposteaban el bloqueo (`panel-sin-consumir` ×3 en
            // finplan#1394). El `stalled` se re-asegura (idempotente) pero el
            // comentario solo se emite si el marcador no está ya presente.
            const list = open.map(i => `- #${i.number} (${(i.labels||[]).map(l=>l.name).join(', ')}): ${i.title}`).join('\n');
            await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ['stalled'] });
            const alreadyBlocked = issueComments.some(c => /<!--\s*panel-sin-consumir\s*-->/.test(c.body || ''));
            if (!alreadyBlocked) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number,
                body: `**claude-code · guard de panel**: hay panel de la épica anterior SIN consumir — el protocolo exige cerrarlo con línea de resolución al lanzar (3 omisiones históricas motivaron este guard):\n\n${list}\n\nNo se arma al Creator. Opciones: (a) consumir el panel (cerrar con línea de resolución) y re-armar; (b) declarar consumido un panel concreto con \`<!-- panel-consumido: #N -->\` en CUALQUIER comentario de confianza del issue (estado materializado, AP-019) — no requiere \`close\` (fuera del allowlist de los agentes); (c) forzar el arm completo con \`<!-- panel-ok -->\` (force pegajoso, AP-018 §3) si el lanzamiento debe preceder al cierre.\n\n<!-- panel-sin-consumir -->` });
            }
            core.setOutput('blocked', 'true');

      - name: Checkout repository
        if: |
          steps.check_pause.outputs.paused != 'true'
          && steps.check_iterations.outputs.cap_reached != 'true'
          && steps.check_chain.outputs.broken != 'true'
          && steps.check_panel.outputs.blocked != 'true'
          && steps.check_serial.outputs.blocked != 'true'
          && steps.check_flight.outputs.blocked != 'true'
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 trae todo el historial. Necesario para que Claude
          # pueda razonar sobre commits previos cuando aplique.
          fetch-depth: 0
          # Si el repo provee WORKFLOWS_PUSH_TOKEN (central, AP-012 enmienda
          # 2026-07-15), los push del workspace salen con él: el Creator puede
          # empujar workflows A SU RAMA. La API (PR, comentarios) sigue vía la
          # App. Vacío ⇒ token por defecto (comportamiento previo).
          token: ${{ secrets.WORKFLOWS_PUSH_TOKEN != '' && secrets.WORKFLOWS_PUSH_TOKEN || github.token }}

      # central#313: módulo compartido del orden de la cola serial
      # (`vendored/scripts/cola-prioridad.cjs`), mismo patrón que el
      # `epic-merge-diag.cjs` de `epic-merge.yml`. Va DESPUÉS del checkout del
      # repo (que vacía el workspace) y antes de todo consumidor de cola —
      # `popQueue`, `launch_next` y el barrido `always()` del cierre—, así que
      # corre con `always()`. Fuera del árbol del Creator vía
      # `.git/info/exclude`. Sin él, los consumidores degradan a FIFO.
      - name: Módulos vendored del central (cola-prioridad)
        if: |
          always()
          && steps.preflight.outputs.dead != 'true'
          && steps.check_pause.outputs.paused != 'true'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: talfarouriarte-cloud/agent-pipeline
          ref: main
          path: .cola-central
          sparse-checkout: vendored/scripts
          sparse-checkout-cone-mode: true

      - name: Excluir los módulos de cola del árbol del Creator
        if: |
          always()
          && steps.preflight.outputs.dead != 'true'
          && steps.check_pause.outputs.paused != 'true'
        continue-on-error: true
        run: |
          if [ -d .git ]; then
            grep -qxF '.cola-central/' .git/info/exclude 2>/dev/null || echo '.cola-central/' >> .git/info/exclude
          fi

      # ───────────────────────────────────────────────────────────────────
      # Sync FORZADO a la rama base ACTUAL antes de que la acción ramifique.
      # Causa raíz (PR #866 salió 12 commits por detrás → conflicto): en eventos
      # `issue_comment`, actions/checkout hace checkout de `github.sha`, que puede
      # venir rancio; `claude-code-action` ramifica la rama nueva desde ese HEAD
      # local. Esto fuerza el HEAD local a `origin/develop` antes de la acción, de
      # modo que la rama del Creator SIEMPRE salga del develop más reciente.
      # SOLO en trabajo de issue nuevo: en eventos de PR el Creator debe quedarse
      # en la rama del PR (p.ej. para resolver conflictos), así que NO reseteamos.
      # ───────────────────────────────────────────────────────────────────
      - name: Guard serial — un solo Creator en vuelo (solo issues)
        # Hard stop (2026-07-12, incidente #1303: dos arms manuales —
        # correctivo K1 #1298 y arranque L1 #1299 — a 9 min ⇒ dos PRs de
        # agente vivos ⇒ colisión de merge y rebase forzado). La serialidad
        # era regla dura de protocolo sin enforcement mecánico; esto lo
        # fuerza: si ya hay CUALQUIER PR de agente (claude/*) abierto, NO se
        # arma otro Creator desde un issue. Arms de auditoría (label
        # `auditoria`/`auditoria-completa`) quedan fuera del régimen: no
        # producen PRs de código (2026-07-13, deadlock #1312). El loop Creator↔Reviewer (contexto
        # PR) no pasa por aquí. Override manual: label `serial-ok` en el issue.
        # AP-033 (repesca finplan#1471/#1484): la exclusión es PRE-DESPACHO y sin
        # excepción por mismo-issue — `serial-activo` presente bloquea también el
        # re-arm del PROPIO issue (Watchdog/architect-resolve/arm manual/override
        # humano). El cinturón para dos ARRANQUES simultáneos (Change B) cierra la
        # ventana TOCTOU con un ganador único determinista (menor `run_id` sobre el
        # mismo issue; solo el ganador escribe el flag) — ver AP-033.
        # AP-097 (central#267): el cinturón se extiende a arranques simultáneos de
        # issues DISTINTOS (cinturón cruzado); el perdedor sale `stalled` +
        # `serial-toctou-cruzado`. Banco: scripts/check-serial-guard.mjs.
        id: check_serial
        if: |
          steps.check_pause.outputs.paused != 'true'
          && steps.check_iterations.outputs.cap_reached != 'true'
          && steps.check_chain.outputs.broken != 'true'
          && steps.check_panel.outputs.blocked != 'true'
          && steps.check_serial.outputs.blocked != 'true'
          && steps.check_flight.outputs.blocked != 'true'
          && (
            (github.event_name == 'issue_comment' && !github.event.issue.pull_request)
            || github.event_name == 'issues'
          )
        uses: actions/github-script@v7
        env:
          IN_EPIC_LABEL: ${{ inputs.epic_label }}
        with:
          github-token: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            // ── Pausa de cola (central#314, ruling mensual 2026-10-05, punto 4).
            // Mientras exista un issue ABIERTO con `pausa-cola`, un arm desde
            // ISSUE (manual, de cola, re-arm del Watchdog o de architect-resolve,
            // auditoría) NO arranca sesión: el issue queda `en-cola` con un
            // comentario `<!-- pausa-cola-retenido -->` (dedup por marcador) y la
            // cola lo arma sola al retirar la pausa. Va ANTES de `serial-ok`: la
            // pausa es la orden explícita del propietario, el override serial no
            // la salta. Pasan, por ser trabajo EN VUELO: el issue con
            // `serial-activo` (re-arm concurrente: lo resuelve el auto-aborto de
            // abajo, sin re-etiquetar) y el issue con PR `claude/issue-N-*`
            // abierto (continuación sobre su rama, fast-path AP-048). Las rondas
            // sobre un PR (contexto PR) ni siquiera pasan por este step. Si
            // `pulls.list` falla, el issue cuenta como EN VUELO DESCONOCIDO y
            // pasa al guard serial, que hace su propia lectura de PRs y bloquea
            // si procede (review #316 🔵 3): retenerlo dejaría una continuación
            // mismo-issue `en-cola` con su PR abierto, y solo la sacaría
            // `cola-huerfana` (AP-048). Coste asumido: con ese fallo, un
            // `serial-ok` pasa la pausa.
            // Lectura única del módulo (`leerPausa`), FAIL-OPEN: consulta fallida
            // o módulo ausente ⇒ guard de siempre.
            {
              let COLA = null;
              for (const p of [`${process.env.GITHUB_WORKSPACE}/.cola-central/vendored/scripts/cola-prioridad.cjs`, `${process.env.GITHUB_WORKSPACE}/scripts/cola-prioridad.cjs`]) {
                try { COLA = require(p); break; } catch (e) { /* siguiente ubicación */ }
              }
              const pausa = (COLA && COLA.leerPausa) ? await COLA.leerPausa({ github, owner, repo, warn: (m) => core.warning(m) }) : null;
              if (pausa && pausa.pausado) {
                const ls = (issue.labels || []).map(l => l.name);
                let enVuelo = ls.includes('serial-activo') ? 'serial-activo' : null;
                if (!enVuelo) {
                  try {
                    const { data: prsP } = await github.rest.pulls.list({ owner, repo, state: 'open', per_page: 100 });
                    const propio = prsP.find(p => (p.head.ref || '').startsWith(`claude/issue-${issue.number}-`));
                    if (propio) enVuelo = `PR #${propio.number} abierto`;
                  } catch (e) {
                    core.warning(`pausa-cola: pulls.list falló (${e.message}); en vuelo desconocido, pasa al guard serial.`);
                    enVuelo = 'en vuelo desconocido (pulls.list falló)';
                  }
                }
                if (enVuelo) {
                  core.notice(`pausa-cola (${COLA.describirPausa(pausa)}): #${issue.number} es trabajo en vuelo (${enVuelo}); pasa al guard serial.`);
                } else {
                  const armBody = context.payload.comment?.body || '';
                  // Re-arm de cadena (el guard de cadena lo eximió del horneado):
                  // el comentario lleva además `eslabon-suspendido` para que la
                  // salida por la cola conserve esa exención.
                  const cadena = !!process.env.IN_EPIC_LABEL && ls.includes(process.env.IN_EPIC_LABEL)
                    && (armBody.includes('epic-auto-launch') || armBody.includes('watchdog-rearm'));
                  let cs = [];
                  try { cs = (await github.rest.issues.listComments({ owner, repo, issue_number: issue.number, per_page: 100 })).data; }
                  catch (e) { core.warning(`pausa-cola: comentarios de #${issue.number} ilegibles (${e.message}); sin dedup.`); }
                  await COLA.retenerArm({ github, owner, repo, issue: issue.number, cadena, pausa, comentarios: cs });
                  core.setOutput('blocked', 'true');
                  core.warning(`pausa-cola (${COLA.describirPausa(pausa)}): arm de #${issue.number} retenido en cola, sin sesión.`);
                  return;
                }
              }
            }
            if ((issue.labels || []).some(l => l.name === 'serial-ok')) {
              core.notice('serial-ok presente: guard serial omitido.');
              core.setOutput('blocked', 'false');
              return;
            }
            // Exención por CLASE (2026-07-13, deadlock #1312): la serialidad
            // existe por colisión de PRs de código (#1303). Un arm de
            // auditoría no abre PRs claude/* — no puede colisionar — y además
            // nunca retiraría serial-activo (el Auditor no abre PR, que es la
            // ruta de retirada): dársela crea deadlock. Fuera del régimen
            // serial: ni recibe la label, ni bloquea, ni es bloqueado.
            const armLabels = (issue.labels || []).map(l => l.name);
            if (['auditoria', 'auditoria-completa'].some(n => armLabels.includes(n))) {
              core.notice('arm de auditoría: no produce PRs de código — exento del régimen serial.');
              core.setOutput('blocked', 'false');
              return;
            }
            // Un Creator en vuelo se materializa de DOS formas (2026-07-12):
            // el flag `serial-activo` en el issue que lo lanzó (puesto aquí al
            // dejar pasar, borrado por el Creator al abrir su PR o por el
            // watchdog si el Creator muere sin abrirlo — cierra la ventana
            // ciega entre el arm y el nacimiento del PR), O un PR claude/*
            // abierto (fase tardía). Cualquiera de las dos bloquea.
            const { data: prs } = await github.rest.pulls.list({ owner, repo, state: 'open', per_page: 100 });
            const claudePRs = prs.filter(p => p.head.ref.startsWith('claude/'));
            const inFlightPRs = claudePRs.map(p => `#${p.number} (${p.head.ref})`);
            const { data: flagged } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'serial-activo', per_page: 20 });
            // AP-033 (repesca finplan#1471/#1484): `serial-activo` presente
            // bloquea CUALQUIER re-arm, INCLUIDO el del propio issue. La exención
            // histórica `i.number !== issue.number` dejaba pasar re-arms sobre el
            // MISMO issue que ya tenía el flag puesto por su run vivo (rearm del
            // Watchdog, architect-resolve encolado, arm manual) ⇒ doble Creator.
            // El relanzamiento legítimo post-merge/parcial NO colisiona: el flag
            // cae al abrir el PR (post-step) o al morir el Creator (watchdog), así
            // que un re-arm legítimo SIEMPRE ve la serie libre. La responsabilidad
            // del mutex es del RUN en su arranque (este guard es su primer paso),
            // no del actor que arma ni de una vigilancia externa.
            let selfHeld = flagged.some(i => i.number === issue.number);
            let inFlightOther = [...inFlightPRs, ...flagged.filter(i => i.number !== issue.number).map(i => `#${i.number} (armado)`)];
            // ── FAST-PATH de CONTINUACIÓN MISMO-ISSUE (AP-048, finplan#1603):
            // ¿el ÚNICO titular de la serie es un PR del PROPIO issue (misma rama
            // `claude/issue-N-*`)? Entonces el arm es continuación de la MISMA
            // unidad de trabajo sobre la MISMA rama, no paralelismo. La clase que
            // motivó el hard stop serial (doble-arm de DOS issues DISTINTOS
            // mergeando en paralelo — finplan#1298/#1299) exige otro PR u otro
            // `serial-activo`, así que el fast-path NO la reabre. Sin él, un PR
            // huérfano (Creator muerto, sin run que lo termine ni merge posible
            // sin el trabajo encolado) interbloquea la serie hasta un `serial-ok`
            // MANUAL: `en-cola` sólo se desencola al MERGE o al terminal del
            // Creator, y el PR huérfano no tiene ni lo uno ni lo otro.
            const sameIssuePrefix = `claude/issue-${issue.number}-`;
            const sameIssuePRs = claudePRs.filter(p => p.head.ref.startsWith(sameIssuePrefix));
            const otherPRs = claudePRs.filter(p => !p.head.ref.startsWith(sameIssuePrefix));
            const otherFlagged = flagged.filter(i => i.number !== issue.number);
            let soloSameIssue = sameIssuePRs.length > 0 && otherPRs.length === 0 && otherFlagged.length === 0;
            // Runs in_progress + queued una sola vez: los usan el fast-path
            // (identificación POSITIVA de «sin otro run de Creator vivo sobre la
            // serie» — fail-closed si la API no responde) y el cinturón TOCTOU
            // (ganador determinista de arranques simultáneos, AP-033 Change B).
            // FILTRO DE EDAD (espejo del gate 0 del watchdog, `MAX_RUN_AGE_H = 6`):
            // la API retiene runs FANTASMA en `queued` indefinidamente (observado
            // en el watchdog: encolados 37 días). Sin este filtro, un `queued`
            // rancio que empareje ESTE issue (por título o rama) tendría un
            // `run_id` MENOR ⇒ sería el `winner` FANTASMA y la continuación
            // legítima cedería a un run que jamás ejecuta — reabriendo el mismo
            // bloqueo mismo-issue que este fast-path cierra. Un run del pipeline
            // no vive >6h de verdad (timeouts de job ≤ ~1h), así que el filtro no
            // descarta ningún contendiente real.
            const MAX_RUN_AGE_MS = 6 * 60 * 60 * 1000;
            const nowMs = Date.now();
            let runs = [], runsListed = false;
            try {
              for (const status of ['in_progress', 'queued']) {
                const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                  owner, repo, status, per_page: 100 });
                runs.push(...(data.workflow_runs || []).filter(r =>
                  (nowMs - new Date(r.created_at).getTime()) < MAX_RUN_AGE_MS));
              }
              runsListed = true;
            } catch (e) {
              // Degradación segura: sin lista, el belt toma el mutex sin cinturón
              // (comportamiento pre-Change-B) y el fast-path NO actúa (fail-closed:
              // sólo con identificación positiva de «sin run activo»).
              core.warning(`Guard serial: no se pudo listar runs (${e.message}); mutex sin cinturón y sin fast-path.`);
            }
            // ── LIVENESS DEL HOLDER (lado LECTOR) — AP-049, repesca finplan#1604 ──
            // `serial-activo` lo ESCRIBE un run en su arranque (este guard) y lo
            // RETIRA al abrir su PR (post-step) o el watchdog si el Creator muere.
            // Toda esa capa post-step vive en el ESCRITOR: una muerte DURA del
            // runner entre el push y el post-step la vacía ENTERA a la vez (no un
            // belt que falla — la capa que muere con el proceso) y deja el flag
            // colgado SIN PR y SIN run. El guard, único lector síncrono del lock,
            // lo lee como «Creator en vuelo» y rechaza un arm AUTORIZADO del
            // propietario hasta el cron del watchdog (~10 min de ventana ciega,
            // finplan#1604). La liveness del run vive en la Actions API — lado
            // LECTOR, que sobrevive a CUALQUIER muerte del escritor: si NINGÚN run
            // de este workflow está vivo (excluido ESTE arm, que ES el run que va a
            // nacer), ningún Creator puede estar sosteniendo el lock ⇒ huérfano.
            // FAIL-CLOSED (§2 de la propuesta): sin lista de runs (API caída,
            // `!runsListed`) o con CUALQUIER run vivo (atribución ambigua) se
            // mantiene el bloqueo/cola de hoy — la regla del ganador determinista
            // AP-033 (c) queda intacta. Cubre lo que #129/#130 no alcanzan: la
            // capa post-step entera muerta, y arms cross-issue / pop de cola sobre
            // el lock huérfano. El watchdog conserva su 3ª mano (des-huérfana
            // aunque nadie intente armar); esto sólo elimina la ventana ciega en el
            // momento en que duele — cuando alguien CON autorización intenta armar.
            // Sólo actúa cuando el ÚNICO titular de la serie es el flag (cero PRs
            // claude/* abiertos): un PR abierto es una unidad de trabajo con rama y
            // commits cuyo estado NO lo decide la liveness de un run (su Creator
            // espera al Reviewer entre rondas — cero runs vivos es su estado NORMAL,
            // no orfandad); des-huérfanas de PRs siguen siendo del watchdog.
            if (runsListed && flagged.length > 0 && inFlightPRs.length === 0) {
              const liveOtherCreators = runs.filter(r =>
                r.name === context.workflow && r.id !== context.runId);
              if (liveOtherCreators.length === 0) {
                for (const i of flagged) {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: i.number, name: 'serial-activo' }).catch(() => {});
                }
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number,
                  body: `**claude-code · guard serial · liveness del holder (lado lector, AP-049)**: se encontró \`serial-activo\` en ${flagged.map(i => `#${i.number}`).join(', ')} pero CERO runs de \`${context.workflow}\` en vuelo (excluido este arm) — ninguna sesión de Creator puede estar sosteniendo el lock. Diagnóstico: muerte dura del runner entre el push y el post-step de liberación (vacía TODA la capa post-step a la vez); el flag quedó HUÉRFANO. Se retira \`serial-activo\` y el arm AUTORIZADO pasa: el estado se lee del lado LECTOR (Actions API), que sobrevive a la muerte del escritor. Fail-closed intacto — con cualquier run vivo o sin lista de runs se mantiene el bloqueo/cola de hoy; el watchdog conserva su 3ª mano.\n\n<!-- serial-holder-muerto -->` });
                core.warning(`Guard serial · liveness del holder: lock huérfano (0 runs vivos); retirado serial-activo de ${flagged.map(i => i.number).join(',')} para #${issue.number}.`);
                // Serie libre: el flag huérfano ya no bloquea. Se recomputan las
                // variables de decisión — todas las flags cayeron y no hay PRs, así
                // que el arm cae al `else` final (winner) y toma el mutex ATÓMICO.
                selfHeld = false;
                inFlightOther = [...inFlightPRs];
                soloSameIssue = false;
              }
            }
            // Contendientes = runs Creator sobre ESTE mismo issue: mismo workflow
            // caller (`r.name === context.workflow` — excluye self-epic-merge/
            // signal-closer/self-reviewer, que disparan sobre `issues` con otro
            // nombre de workflow; cederles orfanaría el flag) Y mismo issue por
            // título O por rama del PR (`claude/issue-N-*`, que cubre un Creator
            // re-armado sobre el PR cuyo `display_title` es el del PR, no el issue).
            // El run actual SIEMPRE es contendiente (la indexación de la API de
            // runs viene rancia por el retardo). Ganador determinista = menor id.
            const contenders = runs
              .filter(r => r.name === context.workflow
                && (r.display_title === issue.title || (r.head_branch || '').startsWith(sameIssuePrefix)))
              .map(r => r.id);
            if (!contenders.includes(context.runId)) contenders.push(context.runId);
            const winner = Math.min(...contenders);
            if (selfHeld) {
              // Re-arm concurrente sobre el MISMO issue: su `serial-activo` lo puso
              // el run vivo. Este run es redundante ⇒ se auto-aborta SIN
              // re-etiquetar: el issue NO está en cola ni stalled, está EN VUELO
              // (lo posee el Creator vivo). NO se retira `serial-activo` (lo libera
              // su run natural al abrir el PR o el watchdog si muere).
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number,
                body: `**claude-code · guard serial**: este issue ya tiene un Creator en vuelo (\`serial-activo\` puesto por su run vivo). La serialidad es regla dura — un re-arm concurrente del MISMO issue (rearm del Watchdog, architect-resolve encolado, arm manual, override humano) NO lanza un segundo Creator. Este run se auto-aborta; la serie la libera el run vivo por su vía natural (PR abierto / muerte del Creator / watchdog). Para forzar un relanzamiento: retira \`serial-activo\` o usa \`serial-ok\`.\n\n<!-- serial-guard -->` });
              core.setOutput('blocked', 'true');
              core.warning(`Guard serial: re-arm concurrente de #${issue.number} con serial-activo ya puesto; auto-abortado.`);
            } else if (soloSameIssue && runsListed) {
              // Fast-path: el único titular de la serie es el PR huérfano del
              // propio issue y la API de runs respondió (fail-closed en su
              // ausencia: cae al bloque de cola de abajo). El árbitro determinista
              // (menor `run_id`) resuelve el caso de DOS continuaciones mismo-issue
              // simultáneas — mismo cinturón que AP-033 Change B, sin reabrir la
              // ventana de dos arranques.
              if (winner !== context.runId) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number,
                  body: `**claude-code · guard serial · fast-path continuación**: arranque simultáneo de continuación mismo-issue; el ganador determinista (run de menor id, \`${winner}\`) toma la continuación. Este run (\`${context.runId}\`) cede SIN re-etiquetar.\n\n<!-- serial-continuacion -->` });
                core.setOutput('blocked', 'true');
                core.warning(`Guard serial · fast-path continuación: run ${context.runId} cede ante ganador ${winner} para #${issue.number}.`);
              } else {
                // Continuación legítima: se deja pasar. El PR abierto ES ahora la
                // señal de vuelo (no se re-escribe `serial-activo` — el post-step
                // «Liberar serial-activo al existir PR» lo retiraría igual); sólo se
                // retira `en-cola` (deja de estar encolado: se arma AHORA). Marcador
                // `serial-continuacion` para el rastro del Auditor/5-whys.
                await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: 'en-cola' }).catch(() => {});
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number,
                  body: `**claude-code · guard serial · fast-path continuación (AP-048)**: el único titular de la serie es el PR del PROPIO issue (${sameIssuePRs.map(p => `#${p.number} (${p.head.ref})`).join(', ')}) y no hay otro run de Creator vivo sobre la serie — es continuación de la MISMA unidad de trabajo sobre la MISMA rama, no paralelismo. Se deja pasar; la clase de doble-arm de issues DISTINTOS (exige otro PR/otro \`serial-activo\`) queda intacta.\n\n<!-- serial-continuacion -->` });
                core.setOutput('blocked', 'false');
                core.notice(`Guard serial · fast-path continuación mismo-issue #${issue.number}: se deja pasar.`);
              }
            } else if (inFlightOther.length > 0) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number,
                body: `**claude-code · guard serial**: ya hay un Creator en vuelo (${inFlightOther.join(', ')}). La serialidad es regla dura — no se arma un segundo Creator en paralelo. Este issue NO se arma; queda **EN COLA** (label \`en-cola\`): al liberarse la serie, la cola se arma sola por su orden (AP-102: urgente → eslabón suspendido → alta → normal; dentro de cada nivel, el más antiguo). El guard de panel ya se evaluó en este arm: la salida de cola está exenta (central#320). Para forzar YA: \`serial-ok\`.\n\n<!-- serial-guard -->` });
              // AP-039: el encolado deja SOLO `en-cola` (+ marcador `serial-guard`
              // del comentario de arriba). NO se aplica `stalled`: `stalled`
              // significa «necesita ruling del resolutor» y aquí convocaba por
              // evento un architect-resolve cuyo único acto observado era retirar
              // la label sobre un estado que ya tiene dueño mecánico (popQueue/
              // armQueue). La espera de cola es legítima; el watchdog solo la
              // trata como anomalía (`cola-huerfana`) si la premisa de serie cae
              // y persiste >1 tick (watchdog.yml, detector issue-armed-no-pr).
              await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ['en-cola'] });
              core.setOutput('blocked', 'true');
              core.warning(`Guard serial: ${inFlightOther.length} en vuelo; no se arma #${issue.number}.`);
            } else {
              // Serie libre según el flag. El cinturón TOCTOU (AP-033 Change B —
              // ganador único determinista) ya está computado ARRIBA (`winner`):
              // cierra la ventana de segundos entre DOS arranques simultáneos que
              // leen AMBOS `flagged` vacío antes de que ninguno escriba el flag
              // (que el label solo no cubre). El run Creator de MENOR `run_id`
              // sobre ESTE MISMO issue gana; todos los contendientes calculan el
              // mismo ganador; SOLO el ganador escribe el flag y procede, los demás
              // ceden SIN escribir (nunca se orfana el mutex — a lo sumo, si el
              // ganador muere en la ventana, se pierde el arm y lo recupera el
              // watchdog/cola). Si la API de runs no respondió (`!runsListed`),
              // `contenders` = [este run] ⇒ `winner` = este run: degradación segura
              // pre-Change-B (toma el mutex sin cinturón).
              // ── CINTURÓN CRUZADO (AP-097, central#267) ──
              // El árbitro de arriba sólo ve runs del MISMO issue: dos issues
              // DISTINTOS armados con segundos de diferencia leían ambos la serie
              // libre, cada uno se veía único contendiente y AMBOS escribían
              // `serial-activo` (asesoramiento#2324 y #2333, mismo día, sin
              // marcador). Contendientes cruzados = runs de arm de OTRO issue del
              // mismo workflow caller con `run_id` MENOR (sólo un id menor puede
              // ganar). Discriminadores de «run de arm», todos ya disponibles:
              // evento de issue (`issue_comment`/`issues`), `display_title` que NO
              // es un PR abierto (el loop Creator↔Reviewer comenta en el PR y su
              // run lleva el título del PR), ni un issue exento del régimen serial
              // (`auditoria`/`auditoria-completa`/`serial-ok`: nunca toman el
              // mutex, cederles perdería el arm — p.ej. auditor + pop de cola al
              // cerrar una épica), creado dentro de `CROSS_WINDOW_MS` antes de
              // este run (cota de llamadas, NO el discriminador), y que AÚN NO ha
              // pasado su guard. Esto último es el discriminador exacto de la
              // TOCTOU: un arm cruzado más antiguo que ya pasó el guard NO es un
              // contendiente — o tomó la serie (y su flag está) o no la tomó (o ya
              // la soltó). El caso que lo exige es el POP DE COLA: el holder A
              // termina sin PR en minutos (muerte instantánea AP-091, bloqueo,
              // alcance completo), su post-step retira `serial-activo` y
              // `popQueue` arma B MIENTRAS el run de A sigue `in_progress` con sus
              // steps finales; sin este filtro B cedía ante un A que ya no va a
              // tomar la serie ⇒ nadie la ocupa y el pop se degradaba a `stalled`
              // (lo que AP-039 sacó de la cola). Por eso, para un candidato con el
              // step del guard `completed` se RE-LEE `serial-activo` (el flag pudo
              // escribirse después de la lectura de arriba): cuenta sólo si su
              // issue lo lleva ahora. Fail-closed: sin jobs legibles del candidato
              // o sin relectura ⇒ sigue contando (el comportamiento conservador).
              // Degradación: sin lista de runs o sin lista de issues ⇒ sin
              // cinturón cruzado (statu quo, nunca peor).
              // Convergencia: todos los contendientes que se ven calculan el mismo
              // ganador; si sólo el perdedor ve al ganador, el ganador toma y el
              // perdedor cede; si sólo el ganador ve al perdedor, es el statu quo.
              const CROSS_WINDOW_MS = 10 * 60 * 1000;
              // Nombre literal de ESTE step (la API de jobs expone `name`, no `id`).
              const GUARD_STEP = 'Guard serial — un solo Creator en vuelo (solo issues)';
              const CROSS_EXEMPT = ['auditoria', 'auditoria-completa', 'serial-ok'];
              let crossWinner = null;
              if (runsListed && winner === context.runId) {
                let recent = null;
                try {
                  ({ data: recent } = await github.rest.issues.listForRepo({
                    owner, repo, state: 'open', sort: 'updated', direction: 'desc', per_page: 100 }));
                } catch (e) {
                  core.warning(`Guard serial · cinturón cruzado: no se pudo listar issues (${e.message}); sin cinturón cruzado.`);
                }
                if (recent) {
                  const prTitles = new Set(prs.map(p => p.title));
                  const nonArmTitles = new Set(recent
                    .filter(i => i.pull_request || (i.labels || []).some(l => CROSS_EXEMPT.includes(l.name)))
                    .map(i => i.title));
                  const selfRun = runs.find(r => r.id === context.runId);
                  const selfMs = selfRun ? new Date(selfRun.created_at).getTime() : nowMs;
                  const candidates = runs.filter(r => r.name === context.workflow
                    && r.id < context.runId
                    && (r.event === 'issue_comment' || r.event === 'issues')
                    && r.display_title !== issue.title
                    && !(r.head_branch || '').startsWith('claude/')
                    && !prTitles.has(r.display_title)
                    && !nonArmTitles.has(r.display_title)
                    && (selfMs - new Date(r.created_at).getTime()) <= CROSS_WINDOW_MS);
                  const cross = [];
                  let fresh;   // undefined = sin releer; null = relectura fallida
                  for (const r of candidates) {
                    let pastGuard = false;
                    try {
                      const { data: jl } = await github.rest.actions.listJobsForWorkflowRun({ owner, repo, run_id: r.id, per_page: 50 });
                      pastGuard = (jl.jobs || []).flatMap(j => j.steps || [])
                        .some(st => st.name === GUARD_STEP && st.status === 'completed');
                    } catch (e) {
                      core.warning(`Guard serial · cinturón cruzado: jobs del run ${r.id} ilegibles (${e.message}); cuenta como contendiente.`);
                    }
                    if (pastGuard) {
                      if (fresh === undefined) {
                        try {
                          ({ data: fresh } = await github.rest.issues.listForRepo({
                            owner, repo, state: 'open', labels: 'serial-activo', per_page: 20 }));
                        } catch (e) {
                          fresh = null;
                          core.warning(`Guard serial · cinturón cruzado: relectura de serial-activo fallida (${e.message}); los candidatos con guard pasado cuentan.`);
                        }
                      }
                      if (fresh && !fresh.some(i => i.title === r.display_title)) continue;
                    }
                    cross.push(r);
                  }
                  if (cross.length > 0) crossWinner = cross.reduce((a, b) => (b.id < a.id ? b : a));
                }
              }
              if (crossWinner) {
                // Perdedor cruzado: el ganador arma OTRO issue ⇒ este issue NO se
                // arma ahora. Ruling mensual 2026-09-30: sale con `stalled` +
                // marcador (dedup AP-018 §1) y architect-resolve lo re-arma cuando
                // la serie quede libre. NO escribe `serial-activo` (lo escribe el
                // ganador ⇒ nunca se orfana el mutex).
                const cmts = await github.paginate(github.rest.issues.listComments,
                  { owner, repo, issue_number: issue.number, per_page: 100 });
                if (!cmts.some(c => (c.body || '').includes('<!-- serial-toctou-cruzado -->'))) {
                  await github.rest.issues.createComment({ owner, repo, issue_number: issue.number,
                    body: `**claude-code · guard serial · cinturón cruzado (AP-097)**: arranque simultáneo con el arm de OTRO issue («${crossWinner.display_title}», run \`${crossWinner.id}\`, creado ${crossWinner.created_at}). Ambos leyeron la serie libre; el ganador determinista es el run más antiguo (menor \`run_id\`) de CUALQUIER issue, y ese no es este (\`${context.runId}\`). Este issue NO se arma y queda \`stalled\`: architect-resolve lo re-arma cuando la serie quede libre. No se escribe \`serial-activo\` (lo escribe el ganador). Para forzar YA: \`serial-ok\`.\n\n<!-- serial-toctou-cruzado -->` });
                }
                await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ['stalled'] });
                core.setOutput('blocked', 'true');
                core.warning(`Guard serial · cinturón cruzado: run ${context.runId} (#${issue.number}) cede ante ${crossWinner.id} («${crossWinner.display_title}»).`);
              } else if (winner !== context.runId) {
                // Arranque simultáneo con `run_id` MENOR: es el ganador
                // determinista. Este run cede SIN escribir el flag (lo escribe el
                // ganador) ⇒ nunca se orfana. Auto-aborto SIN re-etiquetar: el
                // issue NO está en cola, el ganador lo arma ahora mismo.
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number,
                  body: `**claude-code · guard serial**: arranque simultáneo sobre este issue; el ganador determinista (run de menor id, \`${winner}\`) toma la serie. Este run (\`${context.runId}\`) cede SIN escribir \`serial-activo\` para no orfanar el mutex — no se re-etiqueta, el ganador arma ahora.\n\n<!-- serial-guard -->` });
                core.setOutput('blocked', 'true');
                core.warning(`Guard serial · cinturón TOCTOU: run ${context.runId} cede ante ganador ${winner} para #${issue.number}.`);
              } else {
                // Ganador (o único contendiente): toma ATÓMICAMENTE el mutex.
                await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: 'en-cola' }).catch(() => {});
                await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ['serial-activo'] });
                core.setOutput('blocked', 'false');
              }
            }

      - name: Sync a la rama base actual antes de ramificar (solo issues, no PRs)
        if: |
          steps.check_pause.outputs.paused != 'true'
          && steps.check_iterations.outputs.cap_reached != 'true'
          && steps.check_chain.outputs.broken != 'true'
          && steps.check_panel.outputs.blocked != 'true'
          && steps.check_serial.outputs.blocked != 'true'
          && steps.check_flight.outputs.blocked != 'true'
          && (
            (github.event_name == 'issue_comment' && !github.event.issue.pull_request)
            || github.event_name == 'issues'
          )
        env:
          BASE: ${{ inputs.default_branch }}
        run: |
          git fetch origin "$BASE"
          git checkout -B "$BASE" "origin/$BASE"
          git reset --hard "origin/$BASE"
          echo "$BASE sincronizado a $(git rev-parse --short HEAD)"

      - name: Capturar HEAD del PR (pre-sesión, contexto PR)
        # Para el re-review por ESTADO (2026-07-13, finplan#1319): la re-audit
        # tras nits no puede depender de que el Creator escriba `@reviewer`
        # (prosa estocástica — hoy lo omitió racionalizando trivialidad,
        # contra ADR-193). El hecho es el push: se captura el HEAD antes de
        # la sesión y el post-step compara.
        # AP-084: se ejecuta ANTES del graft (antes iba después) porque el
        # step siguiente necesita `ref` para colocar el workspace en la rama
        # del PR antes de injertar. Cubre los tres eventos de contexto PR; el
        # post-step de re-review sigue acotado por su propio `if`.
        id: pr_head_before
        if: |
          steps.check_flight.outputs.blocked != 'true' && (
          (github.event_name == 'issue_comment' && github.event.issue.pull_request)
          || github.event_name == 'pull_request_review'
          || github.event_name == 'pull_request_review_comment')
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.issue?.number ?? context.payload.pull_request?.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            core.setOutput('sha', pr.head.sha);
            core.setOutput('ref', pr.head.ref);
            core.setOutput('same_repo', String(pr.head.repo?.full_name === `${owner}/${repo}`));
            // AP-094: ¿el PR era DRAFT al arrancar la sesión? Si la sesión lo marca
            // ready, su `ready_for_review` ya convoca al Reviewer; Auto-label y
            // Re-review por estado lo usan para no convocar una segunda sesión.
            core.setOutput('draft', String(!!pr.draft));

      # ───────────────────────────────────────────────────────────────────
      # AP-084 — Sync a la rama HEAD del PR antes del graft (solo PRs).
      # Espejo del step anterior para issues. Causa raíz (finplan#2009, run
      # 34146501162): en contexto PR, actions/checkout deja `github.sha`
      # (rama base); el graft pisa `scripts/adr-lint.mjs` —TRACKEADO por
      # finplan— y le pone `skip-worktree` (AP-044); después la action hace
      # `git checkout <rama-del-PR> --` y, si esa rama difiere de la base en
      # ese fichero, git aborta: «Your local changes … would be overwritten by
      # checkout». Determinista: toda rama que toque un injertado trackeado
      # era inaccesible para el Creator. Colocando el workspace en la rama
      # del PR ANTES del graft, el checkout de la action es sobre la misma
      # rama (no-op: «Already on …») y el skip-worktree no tiene nada que
      # proteger. El injerto sigue pisando con la copia del central (AP-009/
      # AP-044 intactos: el consumidor no gana derecho a divergir).
      # Fork PRs: la rama no existe en origin ⇒ se deja el comportamiento
      # previo (la action hace fetch vía refs/pull). No aplica a este pipeline.
      # ───────────────────────────────────────────────────────────────────
      - name: Sync a la rama head del PR antes del graft (solo PRs)
        if: |
          steps.check_pause.outputs.paused != 'true'
          && steps.check_iterations.outputs.cap_reached != 'true'
          && steps.check_chain.outputs.broken != 'true'
          && steps.check_panel.outputs.blocked != 'true'
          && steps.check_serial.outputs.blocked != 'true'
          && steps.check_flight.outputs.blocked != 'true'
          && steps.pr_head_before.outputs.ref != ''
          && steps.pr_head_before.outputs.same_repo == 'true'
        env:
          HEAD_REF: ${{ steps.pr_head_before.outputs.ref }}
        run: |
          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          echo "rama del PR sincronizada: $HEAD_REF @ $(git rev-parse --short HEAD)"

      - name: Graft vendored (capa común servida desde el central — AP-009)
        if: |
          steps.check_pause.outputs.paused != 'true'
          && steps.check_iterations.outputs.cap_reached != 'true'
          && steps.check_chain.outputs.broken != 'true'
          && steps.check_panel.outputs.blocked != 'true'
          && steps.check_serial.outputs.blocked != 'true'
          && steps.check_flight.outputs.blocked != 'true'
        uses: talfarouriarte-cloud/agent-pipeline/.github/actions/graft-vendored@main

      # AP-085 (2026-09-08): hedge INERTE ante el fallo del instalador nativo de
      # Claude Code (upstream #1817). Si el instalador funciona, no hace nada; si
      # vuelve a omitir la creación del directorio del launcher, ya existe. NO es el
      # fix (mecanismo no demostrado en local): el fix es el pin del `uses` de abajo.
      - name: Asegurar ~/.local/bin (instalador nativo de Claude Code)
        if: |
          steps.check_pause.outputs.paused != 'true'
          && steps.check_iterations.outputs.cap_reached != 'true'
          && steps.check_chain.outputs.broken != 'true'
          && steps.check_panel.outputs.blocked != 'true'
          && steps.check_serial.outputs.blocked != 'true'
          && steps.check_flight.outputs.blocked != 'true'
        run: mkdir -p "$HOME/.local/bin"

      # AP-101 (review de #312): línea base del árbol ANTES de la sesión, tras el
      # graft. El step `rescate` resta las rutas que siguen idénticas a esta foto
      # (residuo del graft, suciedad heredada del checkout): no son trabajo del
      # Creator y no deben abrir un re-arm. Ruta + hash del contenido (`-` si no
      # existe): si la sesión toca una ruta ya sucia, el hash cambia y entra en
      # el WIP. Sin foto (step fallido) el rescate se comporta como sin resta.
      - name: Foto del árbol pre-sesión (línea base del rescate, AP-101)
        id: arbol_pre
        if: |
          steps.check_pause.outputs.paused != 'true'
          && steps.check_iterations.outputs.cap_reached != 'true'
          && steps.check_chain.outputs.broken != 'true'
          && steps.check_panel.outputs.blocked != 'true'
          && steps.check_serial.outputs.blocked != 'true'
          && steps.check_flight.outputs.blocked != 'true'
        continue-on-error: true
        env:
          PRE_SNAPSHOT: ${{ runner.temp }}/arbol-pre-sesion.z
        run: |
          set -euo pipefail
          : > "$PRE_SNAPSHOT"
          while IFS= read -r -d '' e; do
            xy=${e:0:2}; set -- "${e:3}"
            case "$xy" in R*|C*) IFS= read -r -d '' orig || true; set -- "$1" "$orig";; esac
            for q in "$@"; do
              h=-; if [ -f "$q" ] || [ -L "$q" ]; then h=$(git hash-object --no-filters -- "$q" 2>/dev/null || echo '?'); fi
              printf '%s\0%s\0' "$q" "$h" >> "$PRE_SNAPSHOT"
            done
          done < <(git status --porcelain=v1 -z --untracked-files=all)
          echo "foto pre-sesión: $(tr -cd '\0' < "$PRE_SNAPSHOT" | wc -c | awk '{print $1/2}') ruta(s) sucias"

      - name: Run Claude Code
        if: |
          steps.check_pause.outputs.paused != 'true'
          && steps.check_iterations.outputs.cap_reached != 'true'
          && steps.check_chain.outputs.broken != 'true'
          && steps.check_panel.outputs.blocked != 'true'
          && steps.check_serial.outputs.blocked != 'true'
          && steps.check_flight.outputs.blocked != 'true'
        # Blindaje de auth: forzamos OAuth Max como única vía de auth para el
        # Creator. Razón: la action `anthropics/claude-code-action@v1` usa
        # internamente la SDK estándar de Anthropic, que lee
        # `ANTHROPIC_API_KEY` del env automáticamente. Si está disponible,
        # la SDK puede priorizarla sobre el `claude_code_oauth_token` (orden
        # opaco, no documentado). Resultado empírico: PRs del Creator
        # factuaban ~$11 contra la API key facturada en lugar de consumir el
        # plan Max. (El Reviewer también usa claude-code-action@v1 desde
        # 2026-05-19 con el mismo blindaje; ver reviewer.yml.)
        #
        # Con `ANTHROPIC_API_KEY: ""` aquí, la SDK no encuentra API key en
        # env y queda solo el OAuth. Si OAuth Max falla por cualquier razón
        # (token expirado, rate limit), el job falla con error de auth claro
        # en lugar de facturar silenciosamente. Trade-off aceptado: pierdes
        # el fallback transparente al Creator a cambio de garantía de
        # que ningún PR del Creator se factura sin avisar. El Reviewer
        # sigue conservando su fallback documentado por footer.
        env:
          ANTHROPIC_API_KEY: ""
          # Auto-partición (CLAUDE.md): los arms de hijos deben salir como
          # actor humano — claude-code-action rechaza actores bot y el token
          # del agente aparece como claude[bot] (incidente #1048, 2026-07-04).
          ARM_TOKEN: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
        id: creator
        # AP-085 (2026-09-08) — pin a SHA completo, no a `@v1`. v1.0.217 =
        # 9c5ddab2e6d17b83ea679153b31f1d5f023cf636 (Claude Code 2.1.263,
        # 2026-09-06T02:55Z): ÚLTIMA release conocida buena, única con evidencia
        # cruzada de funcionar en el incidente. v1.0.218 = 0d0e0876d3eaa933f45dc692f7a4312c83caf36f
        # (Claude Code 2.1.265, tag `v1` movido 2026-09-08T20:39Z): desde ~22:30Z su
        # instalador nativo reporta éxito sin crear `~/.local/bin/claude` en runners
        # (upstream anthropics/claude-code-action#1817; 7 muertes en finplan 22:56–23:22Z).
        # Bump del pin = PR humano con criterio (AP-085). Mientras, el runtime sigue
        # flotando sobre install.sh + bootstrap `latest`: cerrar esa clase es AP aparte.
        # AP-087 (2026-09-25) — bump del pin a v1.0.233 = 8cf3482550831fb35a4fc3fbf7ca139cf8028b4c
        # (Claude Code 2.1.281, 2026-09-23T19:40Z): ≥48 h publicada, sin P1 upstream al
        # bumpear. Prerrequisito para `claude-opus-5-5` (soporte desde CLI 2.1.280). El
        # propietario decidió meter runtime y modelo (Creator+Reviewer) en el mismo PR.
        uses: anthropics/claude-code-action@8cf3482550831fb35a4fc3fbf7ca139cf8028b4c # v1.0.233
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Modelo: input `creator_model`, default en workflow_call —
          # claude-opus-5-5 desde 2026-09-25 (AP-087; antes opus-5 27-07 y
          # revert a 4.8 por AP-080). El modelo se gobierna
          # SOLO por el default del central: los stubs NO lo pinean (clase
          # #142 — un pin de stub pisa en silencio el default aprendido).
          # max-turns 100 razonable con OAuth Max (no hay coste por uso,
          # solo cuota de bucket).
          # `Bash(gh api:*)` en el allowlist (AP-028, repesca finplan#1467;
          # canal enmendado por AP-035): los tres terminales del Creator se
          # declaran ahora como token de TEXTO en la primera línea del cierre
          # (`[CREATOR-BLOCKED]`/`[CREATOR-ESCALATED]`/`[ALCANCE-COMPLETO]`);
          # el comentario SEPARADO vía `gh api` con marcador HTML queda como
          # belt aceptado — `gh api` sigue en el allowlist por él y por el
          # body declarado de AP-030.
          # `Bash(gh pr ready:*)` (2026-07-28, AP-057): con draft-first el
          # `ready` es el ACTO DE CIERRE del flujo entero (el draft lo abre el
          # hook; la review se materializa en la transición a ready). Faltaba
          # del allowlist mientras la doctrina lo volvía load-bearing —
          # exactamente la clase 5 (mandate/toolbox drift) que este bloque
          # declara perseguir. No restringía nada en la práctica
          # (`bypassPermissions` activo), y el pipeline nunca lo había
          # ejercitado: con 0/7 drafts, ningún `ready` real había corrido.
          # Explícito además del `bypassPermissions` ya activo: el allowlist es
          # central en el reusable ⇒ uniforme para toda la flota (clase 5
          # mandate/toolbox drift).
          # AP-088 (2026-09-28): `--effort medium` explícito; sin flag cada modelo aplica
          # su default de lanzamiento y un cambio upstream lo movería sin aviso.
          claude_args: |
            --model ${{ inputs.creator_model }}
            --effort medium
            --max-turns ${{ inputs.creator_max_turns }}
            --permission-mode bypassPermissions
            --allowedTools "Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr edit:*),Bash(gh pr ready:*),Bash(gh pr checks:*),Bash(gh pr merge:*),Bash(gh api:*)"

      # Auto-labeling según tag de cierre del Creator. ADR-063.
      # Solo en contextos de PR (los tags solo aplican en loop con Reviewer).
      #
      # FIX bucle silencioso (PR #180, 2026-05-21, ADR-064 amendment):
      # El step solo re-aplica la label si el último comment de claude[bot]
      # es POSTERIOR al comment que disparó el job. Razón: el trigger del
      # workflow (if: contains(comment.body, '@claude')) hace substring
      # match crudo y dispara también cuando otro agente (Reviewer)
      # menciona el literal `@claude` en su cuerpo aunque sea entre
      # backticks documentando convergencia. Si el step re-aplica label
      # leyendo SIEMPRE el último comment de claude[bot] (que sigue siendo
      # el del Creator de la ronda 1 con `@reviewer` al final), se genera
      # un loop Reviewer↔Auto-label sin que el Creator produzca trabajo
      # nuevo (14 rondas observadas en PR #180). El check de freshness
      # rompe el bucle estructuralmente.
      - name: Push residual con token de workflows (post-sesión)
        id: rescate
        # 2026-07-15, central#46 (3 sesiones quemadas): claude-code-action
        # re-inicializa `origin` con su credencial de App al preparar el
        # entorno — el token del checkout queda pisado y el push de
        # `.github/workflows/**` muere (la App no tiene ese permiso). El
        # trabajo quedaba commiteado en LOCAL y se perdía con el runner.
        # Este post-step rescata el push FUERA de la sesión: si la rama
        # local claude/* tiene commits que no están en el remoto, empuja con
        # la URL credencializada (inmune al credential helper de la action)
        # y abre el PR si falta. Guard duro: SOLO ramas claude/*, jamás main.
        # AP-101 (central#300, ruling mensual 2026-10-05; asesoramiento#2457,
        # PR #2450: sesión `success` con el árbol sucio y sin push, 447 345
        # tokens ponderados rehechos). Una sola casa para el rescate:
        #  - corre también en consumidores: token = WORKFLOWS_PUSH_TOKEN si
        #    existe, si no REVIEWER_GITHUB_TOKEN;
        #  - cubre el ÁRBOL SUCIO: cambios fuera del conjunto de restauración
        #    AP-097 (misma lista que `restoreConfigFromBase`) se commitean como
        #    WIP con `git add` SOLO de esas rutas (jamás -A: subiría la
        #    reversión de config de la base) y se pushean con los residuales;
        #    se restan las rutas idénticas a la foto pre-sesión (`arbol_pre`);
        #  - con WIP NO se abre PR (el `opened` convocaría al Reviewer sobre un
        #    WIP): rama virgen ⇒ una línea en el issue; PR abierto ⇒ comentario
        #    con marcador `arbol-rescatado-por-estado` + `estado:esperando-architect`
        #    + `stalled` (turno del Creator, re-arma architect-resolve por evento,
        #    como `escalada-materializada-con-pr`, AP-046). Auto-label,
        #    open-review-failsafe y «Materializar muerte sin PR» ceden (output `wip`);
        #  - fail-loud: commit o push fallidos ⇒ comentario con el error y step rojo.
        # El gate de AP-089 (hook test-discipline) solo actúa si la sesión lanza
        # un runner; este step lee el estado, no depende de lo que hizo la sesión.
        # Corre ANTES de todos los post-steps de materialización.
        if: always() && env.PUSH_TOKEN != '' && steps.preflight.outputs.dead != 'true' && steps.creator.outcome != 'skipped'
        env:
          PUSH_TOKEN: ${{ secrets.WORKFLOWS_PUSH_TOKEN || secrets.REVIEWER_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
          IN_DEFAULT_BRANCH: ${{ inputs.default_branch }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
          EVENT_IS_PR: ${{ github.event.issue.pull_request && 'true' || 'false' }}
          # PR del evento (contexto PR): respaldo si `gh pr list` falla, para que
          # un fallo puntual de la API no mande el rescate por la rama virgen.
          EVENT_PR: ${{ github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) || '' }}
          # Foto pre-sesión (step `arbol_pre`): lo que sigue idéntico no se rescata.
          PRE_SNAPSHOT: ${{ runner.temp }}/arbol-pre-sesion.z
        run: |
          set -euo pipefail
          echo "wip=false" >> "$GITHUB_OUTPUT"
          BRANCH=$(git branch --show-current || true)
          BASE="$IN_DEFAULT_BRANCH"
          case "$BRANCH" in claude/*) ;; *) echo "rama '$BRANCH' fuera del patrón claude/*: nada que rescatar"; exit 0;; esac
          [ "$BRANCH" != "$BASE" ] || { echo "rama '$BRANCH' es la base: jamás se rescata sobre ella"; exit 0; }
          REPO_URL="https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          RUN_URL="${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git fetch -q "$REPO_URL" "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" 2>/dev/null || true
          git fetch -q "$REPO_URL" "+refs/heads/$BASE:refs/remotes/origin/$BASE" 2>/dev/null || true
          # Árbol sucio FUERA del conjunto de restauración AP-097 (central#271):
          # esas rutas las reescribe la action con la versión de la base y no
          # son trabajo del Creator. `-z` para rutas con espacios y renombrados
          # (R/C traen la ruta de origen como entrada siguiente).
          # Se resta además la foto pre-sesión (`arbol_pre`): una ruta que sigue
          # con el mismo hash que antes de la sesión no la produjo el Creator.
          hashof() { if [ -f "$1" ] || [ -L "$1" ]; then git hash-object --no-filters -- "$1" 2>/dev/null || echo '?'; else echo -; fi; }
          declare -A PRE=()
          if [ -n "${PRE_SNAPSHOT:-}" ] && [ -s "$PRE_SNAPSHOT" ]; then
            while IFS= read -r -d '' p && IFS= read -r -d '' h; do PRE["$p"]=$h; done < "$PRE_SNAPSHOT"
          fi
          FILES=(); PRESKIP=0
          while IFS= read -r -d '' e; do
            xy=${e:0:2}; set -- "${e:3}"
            case "$xy" in R*|C*) IFS= read -r -d '' orig || true; set -- "$1" "$orig";; esac
            for q in "$@"; do
              case "$q" in
                .claude|.claude/*|.claude-pr|.claude-pr/*|CLAUDE.md|CLAUDE.local.md|.mcp.json|.claude.json|.gitmodules|.ripgreprc|.husky|.husky/*) continue;;
              esac
              if [ -n "${PRE[$q]+x}" ] && [ "${PRE[$q]}" = "$(hashof "$q")" ]; then PRESKIP=$((PRESKIP + 1)); continue; fi
              FILES+=("$q")
            done
          done < <(git status --porcelain=v1 -z --untracked-files=all)
          [ "$PRESKIP" = "0" ] || echo "$PRESKIP ruta(s) sucias idénticas a la foto pre-sesión: fuera del rescate"
          # Referencia contra la que medir residuales: la rama remota si existe;
          # si la rama es VIRGEN (nunca pusheada), la base. Incidente central#59:
          # el fallback `|| echo "1"` inventaba AHEAD=1 sobre rama virgen SIN
          # commits (rev-list contra un origin/BRANCH inexistente falla),
          # empujaba una rama vacía y la apertura del PR moría («No commits
          # between…») — job rojo por un no-op.
          REF=""
          if git rev-parse -q --verify "origin/$BRANCH" >/dev/null 2>&1; then REF="origin/$BRANCH"
          elif git rev-parse -q --verify "origin/$BASE" >/dev/null 2>&1; then REF="origin/$BASE"; fi
          AHEAD=0
          [ -z "$REF" ] || AHEAD=$(git rev-list --count "$REF..HEAD")
          if [ "${#FILES[@]}" = "0" ]; then
            [ -n "$REF" ] || { echo "sin referencia remota verificable (ni $BRANCH ni $BASE): no puedo medir residuales"; exit 0; }
            [ "$AHEAD" != "0" ] || { echo "árbol limpio (fuera de AP-097) y sin commits residuales contra $REF: nada que rescatar"; exit 0; }
          fi
          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)
          [ -n "$PR" ] || PR="$EVENT_PR"
          ISSUE=$(printf '%s' "$BRANCH" | sed -nE 's#^claude/issue-([0-9]+)-.*#\1#p')
          [ -n "$ISSUE" ] || { [ "$EVENT_IS_PR" = "true" ] || ISSUE="$EVENT_ISSUE"; }
          # Fail-loud (ruling punto 5): commit o push fallidos dejan comentario con
          # el error (token tachado) en el PR, o en el issue sin PR, y el step rojo.
          # Tras un push correcto (PUSHED=true: falló el comentario o el
          # etiquetado) el WIP SÍ está en el remoto: el texto lo dice y, con PR,
          # se reintentan los labels del turno del Creator (best-effort) para que
          # architect-resolve re-arme por evento aunque el comentario no saliera.
          PUSHED=false; SHA=""
          fail() {
            local what="$1" detail="${2//"$PUSH_TOKEN"/***}"
            detail=$(printf '%s\n' "$detail" | tail -n 20)
            local body
            if [ "$PUSHED" = "true" ]; then
              if [ -n "$PR" ]; then
                gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/labels" -f 'labels[]=estado:esperando-architect' >/dev/null 2>&1 || true
                gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/labels" -f 'labels[]=stalled' >/dev/null 2>&1 || echo "::error::no se pudo aplicar stalled al PR #$PR"
              fi
              body=$(printf '**claude-code · rescate del árbol FALLIDO tras el push** (AP-101): el WIP `%s` **SÍ está en la rama** `%s`; falló el %s al cierre de la sesión ([run](%s)). **Para el re-arm: continúa desde la rama, no rehagas.**\n\n```\n%s\n```\n\n<!-- arbol-rescate-fallido -->' "$SHA" "$BRANCH" "$what" "$RUN_URL" "$detail")
            else
              body=$(printf '**claude-code · rescate del árbol FALLIDO** (AP-101): el %s de `%s` falló al cierre de la sesión ([run](%s)). El trabajo sin pushear de esa sesión muere con el runner; el re-arm debe partir del último push visible.\n\n```\n%s\n```\n\n<!-- arbol-rescate-fallido -->' "$what" "$BRANCH" "$RUN_URL" "$detail")
            fi
            if [ -n "$PR" ]; then gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body" || echo "::error::no se pudo comentar el fallo en el PR #$PR"
            elif [ -n "$ISSUE" ]; then gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$body" || echo "::error::no se pudo comentar el fallo en el issue #$ISSUE"
            else echo "::error::sin PR ni issue donde comentar el fallo"; fi
            echo "::error::rescate del árbol de $BRANCH: falló el $what"
            exit 1
          }
          WIP=false
          if [ "${#FILES[@]}" != "0" ]; then
            echo "árbol sucio en $BRANCH (${#FILES[@]} rutas fuera de AP-097): commit WIP"
            git config user.email >/dev/null 2>&1 || git config user.email "209825114+claude[bot]@users.noreply.github.com"
            git config user.name >/dev/null 2>&1 || git config user.name "claude[bot]"
            MSG="wip(creator): árbol sin pushear al cierre de la sesión — rescatado por estado (run ${GITHUB_RUN_ID})"
            # Rutas que ya no existen (borrado, origen de un `git mv`): `git add`
            # fallaría con «pathspec did not match» y tumbaría el rescate entero;
            # su borrado se prepara con `rm --cached` (no-op si ya estaba staged).
            # `commit -- <rutas>` (modo --only): ni siquiera algo que la sesión
            # dejara staged en el conjunto AP-097 entra en el commit.
            out=""
            for q in "${FILES[@]}"; do
              if [ -e "$q" ] || [ -L "$q" ]; then out=$(git add -- "$q" 2>&1) || fail "commit" "$out"
              else out=$(git rm -q --cached --ignore-unmatch -- "$q" 2>&1) || fail "commit" "$out"; fi
            done
            out=$(git commit --no-verify -q -m "$MSG" -- "${FILES[@]}" 2>&1) || fail "commit" "$out"
            WIP=true
          fi
          echo "rescatando $BRANCH (WIP=$WIP, commits residuales previos=$AHEAD)"
          out=$(git push "$REPO_URL" "HEAD:refs/heads/$BRANCH" 2>&1) || fail "push" "$out"
          PUSHED=true; SHA=$(git rev-parse --short HEAD)
          if [ "$WIP" = "true" ]; then
            echo "wip=true" >> "$GITHUB_OUTPUT"
            echo "pr=$PR" >> "$GITHUB_OUTPUT"
            LIST=$(printf -- '- `%s`\n' "${FILES[@]}" | head -n 50)
            [ "${#FILES[@]}" -le 50 ] || LIST=$(printf '%s\n- … y %s más' "$LIST" "$(( ${#FILES[@]} - 50 ))")
            if [ -n "$PR" ]; then
              body=$(printf '**claude-code · arbol-rescatado-por-estado** (AP-101): la sesión del Creator ([run](%s)) terminó con trabajo SIN pushear en `%s`. El post-step lo commiteó como WIP (`%s`, sin typecheck ni tests) y lo pusheó junto con %s commit(s) residual(es) previos:\n\n%s\n\nEl turno sigue siendo del **Creator**, no del Reviewer: `estado:esperando-architect` + `stalled` ⇒ architect-resolve re-arma por evento. **Para el re-arm: continúa desde el árbol rescatado, no rehagas** — verifica el WIP (typecheck y tests de los ficheros afectados), corrige y cierra el turno como siempre.\n\n<!-- arbol-rescatado-por-estado -->' "$RUN_URL" "$BRANCH" "$SHA" "$AHEAD" "$LIST")
              gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body" || fail "comentario del rescate" "gh pr comment falló"
              # Estado visible primero, `stalled` después (mismo orden que AP-046).
              gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/labels" -f 'labels[]=estado:esperando-architect' >/dev/null || fail "etiquetado" "estado:esperando-architect"
              gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/labels" -f 'labels[]=stalled' >/dev/null || fail "etiquetado" "stalled"
              echo "::warning::PR #$PR: árbol sin pushear rescatado como WIP $SHA — stalled + estado:esperando-architect (AP-101)."
            else
              # Rama virgen: push SIN PR (el `opened` convocaría al Reviewer sobre
              # un WIP). El `stalled` lo cuelga «Materializar muerte sin PR».
              FLAT=$(printf '`%s` ' "${FILES[@]:0:50}")
              body=$(printf 'claude-code · árbol rescatado por estado (AP-101): WIP `%s` pusheado a la rama `%s` sin abrir PR — %s([run](%s))\n\n<!-- arbol-rescatado-por-estado -->' "$SHA" "$BRANCH" "$FLAT" "$RUN_URL")
              if [ -n "$ISSUE" ]; then gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$body" || fail "comentario del rescate" "gh issue comment falló"; fi
              echo "::warning::$BRANCH: árbol sin pushear rescatado como WIP $SHA, sin PR (AP-101)."
            fi
            exit 0
          fi
          # Solo commits residuales hechos por la sesión (caso central#46): se
          # mantiene la apertura del PR si falta.
          # Guard anti-PR-vacío: PR solo si hay diff real contra la base.
          if git rev-parse -q --verify "origin/$BASE" >/dev/null 2>&1 && [ "$(git rev-list --count "origin/$BASE..HEAD")" = "0" ]; then
            echo "rama sin diff contra $BASE tras el push: sin PR que abrir"; exit 0; fi
          if [ -z "$PR" ]; then
            TITLE=$(git log -1 --pretty=%s)
            BODY=$(git log -1 --pretty=%b)
            FULLBODY=$(printf '%s\n\n---\n_PR abierto por el post-step de rescate (push residual, central#46): el trabajo estaba commiteado en local y la sesión no lo pusheó._' "$BODY")
            gh pr create --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base "$BASE" --title "$TITLE" --body "$FULLBODY"
          fi

      # Firma de FLOTA CAÍDA (AP-091, central#212): materializa la clase de la
      # sesión LLM (muerte instantánea / viva) como la conclusión de UNO de los
      # dos steps-marcador de abajo. El `detect` del Watchdog los lee por API
      # (nombre EXACTO del step — no renombrar sin tocar la firma de flota).
      - name: Clasificar la ejecución LLM (firma de flota, AP-091)
        id: llm_exec
        if: always() && steps.creator.outcome != 'skipped' && steps.creator.outcome != 'cancelled'
        uses: actions/github-script@v7
        env:
          EXEC_FILE: ${{ steps.creator.outputs.execution_file }}
        with:
          script: |
            // Firma de muerte INSTANTÁNEA de la sesión LLM (AP-091, central#212). Lee la
            // salida ESTRUCTURADA de la action (execution file, AP-040) — jamás substring
            // de log — y la materializa como la conclusión de UNO de los dos steps
            // siguientes, que el `detect` del Watchdog lee por API (`listJobsForWorkflowRun`,
            // `actions: read`, sin permiso nuevo) para computar la firma de FLOTA CAÍDA.
            // Firma COMPLETA exigida (anti falso positivo): `num_turns ≤ 1` · coste 0 ·
            // `modelUsage` objeto vacío. `alive` exige EVIDENCIA de vida (turnos > 1, coste
            // > 0 o `modelUsage` con uso). Lo demás —execution file ilegible, o un campo de
            // la firma ausente (`total_cost_usd`, `modelUsage`)— es firma no juzgable ⇒ ni
            // uno ni otro (neutro): ni suma a la racha ni la resetea (review de #280).
            const fs = require('fs');
            const f = process.env.EXEC_FILE || `${process.env.RUNNER_TEMP || '/tmp'}/claude-execution-output.json`;
            let d = null;
            try { d = JSON.parse(fs.readFileSync(f, 'utf8')); } catch (e) { core.info(`execution file ilegible (${e.message}): neutro.`); }
            const msgs = Array.isArray(d) ? d : (d ? [d] : []);
            const r = [...msgs].reverse().find(m => m && m.type === 'result') || null;
            if (!r) { core.setOutput('kind', 'ilegible'); return; }
            const turns = Number(r.num_turns), cost = Number(r.total_cost_usd);
            const mu = r.modelUsage;
            const muObj = !!mu && typeof mu === 'object';
            const muVacio = muObj && Object.keys(mu).length === 0;
            const viva = (Number.isFinite(turns) && turns > 1) || (Number.isFinite(cost) && cost > 0) || (muObj && !muVacio);
            const kind = viva ? 'alive'
              : (Number.isFinite(turns) && turns <= 1 && cost === 0 && muVacio ? 'instant' : 'ilegible');
            core.info(`ejecución LLM: num_turns=${r.num_turns} · total_cost_usd=${r.total_cost_usd} · modelUsage=${mu === undefined ? '(ausente)' : muVacio ? '{}' : 'con uso'} ⇒ ${kind}`);
            core.setOutput('kind', kind);
            // Ledger de coste del Auditor (AP-099, central#281): el execution file vive en el
            // runner y muere con el job, así que el `modelUsage` se materializa como UNA
            // anotación `model-usage:` de este step — legible después por la API de
            // annotations (`check-runs/<jobId>/annotations`, el canal de AP-070), sin
            // artifact ni permiso nuevo. Solo tokens por modelo: el peso lo pone
            // `templates/model-costs.json` en el Auditor, no aquí (una tabla, una casa).
            // Sin `modelUsage` legible no se anota nada: «sin dato», jamás 0.
            if (muObj && !muVacio) {
              const tok = Object.fromEntries(Object.entries(mu).map(([m, u]) => [m, {
                in: Number(u && u.inputTokens) || 0, out: Number(u && u.outputTokens) || 0,
                cr: Number(u && u.cacheReadInputTokens) || 0, cw: Number(u && u.cacheCreationInputTokens) || 0 }]));
              core.notice(`model-usage: ${JSON.stringify({ num_turns: r.num_turns, models: tok })}`);
            }
      - name: 'llm-flota: muerte instantánea'
        if: always() && steps.llm_exec.outputs.kind == 'instant'
        run: echo "::warning::Sesión LLM muerta al nacer (num_turns ≤ 1, coste 0, modelUsage vacío) — cuenta para la firma de FLOTA CAÍDA del Watchdog (AP-091)."
      - name: 'llm-flota: sesión viva'
        if: always() && steps.llm_exec.outputs.kind == 'alive'
        run: echo "Sesión LLM viva — resetea la firma de FLOTA CAÍDA del Watchdog (AP-091)."

      - name: Materializar auditoria-completa (post-step determinista)
        # Fix 2026-07-12 (propuesta #1288 finplan): el informe del Auditor
        # aparece cuando la acción reescribe el tracking comment AL TERMINAR
        # la sesión; si la label (trigger de process-review) la aplica el
        # propio agente por bash DURANTE la sesión, el orden efectivo es
        # label→informe y process-review lee un panel a medias (medido:
        # 59s-3m17s de ventana). El mismo patrón que el veredicto del
        # Reviewer: el hecho lo materializa un paso determinista DESPUÉS.
        # Sale con el PAT: su evento labeled es el trigger.
        if: |
          always()
          && steps.preflight.outputs.dead != 'true'
          && steps.check_pause.outputs.paused != 'true'
          && contains(join(github.event.issue.labels.*.name, ','), 'auditoria')
          && !contains(join(github.event.issue.labels.*.name, ','), 'auditoria-completa')
          && github.event.issue.pull_request == null
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            // Verificación de estado materializado (2026-07-13, finplan#1296:
            // el post-step etiquetaba a ciegas y una sesión `success` que no
            // publicó informe consumó un panel fantasma en #1295 — 2ª instancia
            // de la clase informe-no-publicado). El hecho que la label declara
            // es «informe publicado»: se LEE (marcador grep-able del mandato
            // del Auditor: bloque fijo «## Métricas de proceso»), no se infiere
            // del resultado de la sesión. Cubre muerte de sesión Y
            // success-sin-publicar (always() ya trae ambos aquí).
            const HAS_REPORT = /##\s*Métricas de proceso/;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100 });
            const published = comments.some(c => HAS_REPORT.test(c.body || ''));
            if (!published) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['stalled'] });
              await github.rest.issues.createComment({ owner, repo, issue_number,
                body: '**claude-code · post-step de auditoría**: la sesión del Auditor terminó SIN informe publicado (ningún comentario contiene el bloque `## Métricas de proceso`). NO se aplica `auditoria-completa` — el process-review no debe correr contra un panel vacío (clase informe-no-publicado, finplan#1296/#1295). Escalado vía `stalled`.\n\n<!-- informe-no-publicado -->' });
              core.warning(`auditoría #${issue_number}: sin informe publicado — auditoria-completa NO aplicada; stalled.`);
              return;
            }
            // Materialización del veredicto POR ESTADO (AP-013, 2026-07-15,
            // central#44). El marcador audit-verdict es la mitad-Auditor del
            // auto-archivo del panel (co-presencia con process-proposals,
            // process-review.yml). Su canal primario —línea final del informe—
            // era estéril POR CONSTRUCCIÓN: el tracking comment de claude[bot]
            // que la action reescribe con el informe ELIMINA todo comentario
            // HTML (5/5 hilos sin marcador, 4/4 re-arms humanos estériles:
            // wmcb#55/#58/#65/#66/#68, finplan#1381/#1383/#1386 — es el CANAL,
            // no el modelo). El `verdict-rearm` (que re-pedía prosa) se
            // sustituye por DERIVACIÓN POR ESTADO: con el informe publicado y
            // sin marcador, el veredicto se deriva del estado materializado y
            // lo publica ESTE step por PAT (REVIEWER_GITHUB_TOKEN — canal que
            // conserva HTML), nunca por prosa. Doctrina estado-primario: el
            // estado se materializa en el mismo job, no se re-infiere después.
            const HAS_VERDICT = /<!--\s*audit-verdict:\s*(clean|findings)\s*-->/;
            const hasVerdict = comments.some(c => HAS_VERDICT.test(c.body || ''));
            if (!hasVerdict) {
              // Estado 1 — escalada: labels FRESCAS por API (el Auditor añade
              // needs-human DURANTE la sesión; el payload del evento está frío).
              const { data: fresh } = await github.rest.issues.get({ owner, repo, issue_number });
              const labelNames = (fresh.labels || []).map(l => (typeof l === 'string' ? l : l.name));
              const escalated = labelNames.some(n => n === 'needs-human' || n === 'human-needed');
              // Estado 2 — correctivos vinculados al panel por cross-reference
              // del timeline (back-ref `auditoría #<panel>` del mandato,
              // epic-auditor.md §5). Paginación COMPLETA: truncar el timeline
              // sub-contaría correctivos y derivaría un falso `clean`.
              const timeline = await github.paginate(
                github.rest.issues.listEventsForTimeline,
                { owner, repo, issue_number, per_page: 100 });
              const correctiveNums = new Set();
              for (const ev of timeline) {
                if (ev.event !== 'cross-referenced') continue;
                const src = ev.source && ev.source.issue;
                if (!src || src.pull_request) continue; // solo issues, no PRs
                const srcLabels = (src.labels || []).map(l => (typeof l === 'string' ? l : l.name));
                if (srcLabels.includes('correctivo')) correctiveNums.add(src.number);
              }
              const correctivos = correctiveNums.size;
              // Derivación (AP-013 §1): ≥1 correctivo ⇒ findings; 0 y sin
              // escalada ⇒ clean; 0 CON escalada ⇒ AMBIGUO (hallazgo/escalado
              // sin correctivo materializado) ⇒ NO deriva, fail-safe VISIBLE
              // (setFailed + panel abierto), simétrico a finplan#1326 — un
              // `clean` mal derivado archivaría un panel con hallazgos, por eso
              // `clean` exige ausencia TOTAL de señal de hallazgo.
              let verdict;
              if (correctivos >= 1) verdict = 'findings';
              else if (!escalated) verdict = 'clean';
              if (!verdict) {
                await github.rest.issues.createComment({ owner, repo, issue_number,
                  body: '**claude-code · post-step de auditoría**: informe publicado sin `audit-verdict` y estado AMBIGUO (0 correctivos vinculados + escalada presente). NO se deriva el veredicto — un `clean` archivaría un panel con hallazgos. Panel abierto señalando la anomalía; requiere veredicto explícito del Auditor o del humano (AP-013 § ambigüedad).\n\n<!-- verdict-ambiguo -->' });
                core.setFailed(`auditoría #${issue_number}: veredicto no derivable (0 correctivos + escalada) — fail-safe visible, auditoria-completa NO aplicada.`);
                return;
              }
              await github.rest.issues.createComment({ owner, repo, issue_number,
                body: `**claude-code · post-step de auditoría**: \`audit-verdict\` DERIVADO por ESTADO (correctivos vinculados=${correctivos}, escalada=${escalated}) y publicado por PAT — el Auditor no pudo materializarlo por su canal (tracking comment pierde HTML, AP-013).\n\n<!-- audit-verdict: ${verdict} -->` });
              core.notice(`auditoría #${issue_number}: audit-verdict=${verdict} DERIVADO por estado (correctivos=${correctivos}, escalada=${escalated}) y publicado por PAT (AP-013).`);
            }
            // AP-098 (central#279): marcador P0 POR ESTADO, ANTES de la label (el
            // `labeled` de `auditoria-completa` es el trigger de process-review, y
            // su selector decide P0 ⇒ revisión inmediata vs. esperar lote). El
            // camino primario es el Auditor por `gh api` (`<!-- audit-p0 -->` en el
            // mismo comentario que su `audit-verdict`, epic-auditor.md §7:
            // trabajo perdido, sesión NULO por
            // credencial, pipeline parado); este step solo materializa la causa
            // que el estado declara: `human-needed`/`needs-human` sobre el panel.
            // Fail-open: sin marcador, el panel entra en el siguiente lote
            // (latencia, no pérdida) — jamás impide aplicar la label.
            try {
              const RE_P0 = /<!--\s*audit-p0(?::[^>]*)?\s*-->/;
              const comentariosP0 = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
              if (!comentariosP0.some(c => RE_P0.test(c.body || ''))) {
                const { data: freshP0 } = await github.rest.issues.get({ owner, repo, issue_number });
                const lblP0 = (freshP0.labels || []).map(l => (typeof l === 'string' ? l : l.name));
                const causa = lblP0.find(n => n === 'human-needed' || n === 'needs-human');
                if (causa) {
                  await github.rest.issues.createComment({ owner, repo, issue_number,
                    body: `**claude-code · post-step de auditoría**: panel con \`${causa}\` vigente ⇒ **P0** materializado por estado (AP-098; causa: \`${causa}\`): la revisión de proceso de ESTE panel es inmediata, sin esperar lote.\n\n<!-- audit-p0 -->` });
                  core.notice(`auditoría #${issue_number}: audit-p0 materializado por estado (${causa}).`);
                }
              }
            } catch (e) {
              core.warning(`AP-098: marcador P0 no evaluable (${e.message}) — el panel irá al siguiente lote.`);
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number,
              labels: ['auditoria-completa'] });
            core.notice('auditoria-completa materializada post-sesión (informe y veredicto verificados/derivados).');

      - name: Liberar serial-activo al existir PR (post-Creator)
        # El Creator abre su PR dentro de la sesión; este post-step retira el
        # flag `serial-activo` del issue en cuanto el PR existe (a partir de
        # aquí el PR abierto es la señal de vuelo). Si el Creator murió sin
        # abrir PR, el flag NO se borra aquí — lo libera el watchdog.
        if: |
          always()
          && steps.preflight.outputs.dead != 'true'
          && steps.check_serial.outputs.blocked != 'true'
          && steps.check_flight.outputs.blocked != 'true'
          && (
            (github.event_name == 'issue_comment' && !github.event.issue.pull_request)
            || github.event_name == 'issues'
          )
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const n = context.payload.issue.number;
            const { data: prs } = await github.rest.pulls.list({ owner, repo, state: 'open', per_page: 100 });
            const hasPR = prs.some(p => p.head.ref.startsWith(`claude/issue-${n}-`));
            if (hasPR) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: n, name: 'serial-activo' }).catch(() => {});
              core.notice(`serial-activo retirado de #${n}: PR abierto.`);
            } else {
              core.notice(`serial-activo intacto en #${n}: sin PR aún (Creator en curso o caído — lo libera el watchdog si murió).`);
            }

      - name: Materializar review en la apertura del PR (open-review-failsafe)
        # Repesca finplan#1382 (AP-016, 2026-07-15): el evento `opened` que
        # auto-dispara al Reviewer al NACER el PR es ÚNICO y NO idempotente — si
        # GitHub no lo entrega (finplan#1382: PR abierto por claude[bot] a las
        # 13:04, sin run ni veredicto ~19 min, rescatado por el dispatcher de
        # turno del watchdog ADR-217 a las 13:23), la transición Creator→Reviewer
        # queda colgada del fallback, y «el fallback trabajando ES el failure del
        # camino primario». La doctrina estado-primario (AP-013, wmcb#38) ya
        # materializó POR ESTADO las demás aristas Creator→Reviewer
        # (turn-close-failsafe para cierres sin tag, re-review-por-estado para
        # push sin relabel, lgtm/ci-verde ADR-218); el nacimiento del PR era la
        # ÚLTIMA arista single-shot del camino crítico. Este belt la cierra: tras
        # un settle al bound de liveness (~90s, física de materialización de runs
        # — ADR-217 §3), si NINGÚN run del Reviewer nació para el head SHA del PR,
        # aplica `needs-review` con el PAT (mismo actor/mecanismo que el
        # turn-close-failsafe: el `labeled` del PAT dispara al Reviewer; su guard
        # ignora `labeled` de claude[bot]). El DEDUPE (consulta previa de runs) es
        # la CONDICIÓN DE APLICABILIDAD, no un extra: sin él, doblaría una review
        # Opus completa en CADA PR. Idempotente: si el `opened` disparó (caso
        # común), el run existe y el step no toca nada. El dispatcher del watchdog
        # (ADR-217) queda como red; sus relanzamientos por `opened` perdido deben
        # caer a ~0 (métrica de la próxima auditoría de cada consumidor).
        # AP-094 (central#224): bajo draft-first el `opened` de un draft se salta
        # por construcción y este belt disparaba en el 100% de los PRs ordinarios.
        # Desde AP-094 el evento primario es `ready_for_review` (el `gh pr ready`
        # del cierre del Creator; trigger del stub del Reviewer) y este belt vuelve
        # a ser RESIDUAL: su mismo dedupe por runs del head SHA lo apaga cuando el
        # evento convocó. Sin cambio de lógica aquí.
        if: |
          always()
          && steps.preflight.outputs.dead != 'true'
          && steps.check_serial.outputs.blocked != 'true'
          && steps.check_flight.outputs.blocked != 'true'
          && steps.rescate.outputs.wip != 'true'
          && (
            (github.event_name == 'issue_comment' && !github.event.issue.pull_request)
            || github.event_name == 'issues'
          )
        uses: actions/github-script@v7
        env:
          # AP-101: con árbol rescatado como WIP el turno es del Creator (lo
          # materializa el step `rescate`): no se convoca al Reviewer sobre él.
          # Lectura Y escritura con el PAT. La lectura con el GITHUB_TOKEN default
          # exigía `actions: read` en el job del reusable, y el callee no puede
          # pedir más permisos que su caller: todo stub con bloque `permissions`
          # explícito sin `actions` ⇒ startup_failure de flota (incidente
          # 2026-07-15, central+finplan). El anti-loop solo concierne a la
          # ESCRITURA del label (un `labeled` del GITHUB_TOKEN no dispararía
          # reviewer.yml); leer runs con el PAT es inocuo y no toca ningún stub.
          ARM_PAT: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
          IN_REVIEWER_WF: ${{ inputs.reviewer_workflow_name }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const n = context.payload.issue.number;
            // ¿Nació un PR de este Creator? (misma detección que el step de
            // liberación de serial-activo). Sin PR ⇒ nada que materializar aquí:
            // la muerte sin PR la cubre su propio post-step.
            const { data: prs } = await github.rest.pulls.list({ owner, repo, state: 'open', per_page: 100 });
            const pr = prs.find(p => p.head.ref.startsWith(`claude/issue-${n}-`));
            if (!pr) { core.notice(`open-review-failsafe: sin PR de #${n} — nada que materializar.`); return; }
            // AP-047: un PR en DRAFT es un hito intermedio — NO se materializa la
            // review aquí. El cierre en verde del Creator marca ready (`gh pr ready`)
            // ANTES de terminar, así que este belt ve un PR ya-ready y actúa normal.
            // Si el Creator murió dejando el draft, el post-step «Materializar muerte»
            // (más abajo, MISMO job) lo marca ready + `needs-review`; aplicar
            // `needs-review` a un draft aquí sería inerte (el gate de reviewer.yml lo
            // salta) y se perdería (sin re-evento tras el ready). Dejar el ready a ese
            // post-step evita la doble costura.
            if (pr.draft) { core.notice(`open-review-failsafe: PR #${pr.number} de #${n} en DRAFT — la transición ready la materializa el post-step de muerte; no se aplica needs-review a un draft.`); return; }
            // DEDUPE (condición de aplicabilidad): ¿algún run del Reviewer para el
            // head SHA del PR? El run pertenece al stub caller; se identifica por
            // su `name` (mismo criterio que el watchdog, input reviewer_workflow_name).
            const REVIEWER_WF = process.env.IN_REVIEWER_WF || 'Opus Reviewer';
            // null = lectura no fiable (p.ej. PAT sin actions:read): NO decidir —
            // materializar sobre lectura fallida doblaría reviews; queda el watchdog.
            const found = async () => {
              const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/runs?head_sha=${pr.head.sha}&per_page=50`, {
                headers: { Authorization: `Bearer ${process.env.ARM_PAT}`, Accept: 'application/vnd.github+json' } });
              if (!res.ok) { core.warning(`open-review-failsafe: HTTP ${res.status} listando runs — no se decide.`); return null; }
              // Higiene del dedupe (AP-025, repesca finplan#1450): un run del
              // Reviewer YA CONCLUIDO en `failure` sin veredicto NO cuenta como
              // «trigger opened OK» — es una muerte por presupuesto/crash, la
              // cubre la rama sin-veredicto del post-step de reviewer.yml, no debe
              // bloquear este belt. Dedupea solo contra runs vivos (queued/
              // in_progress) o exitosos (success ⇒ el Reviewer sí posteó veredicto).
              return (await res.json()).workflow_runs.filter(r => r.name === REVIEWER_WF).some(r =>
                r.status === 'queued' || r.status === 'in_progress'
                || (r.status === 'completed' && r.conclusion === 'success'));
            };
            // Camino sano: este post-step corre minutos después del `opened`, así
            // que el run ya existe y el corto-circuito ahorra el settle. Un match
            // POSITIVO nunca es falso negativo ⇒ el corto-circuito no reintroduce
            // el riesgo que el settle cubre (nit de la review de PR #57).
            const first = await found();
            if (first !== false) {
              if (first) core.notice(`open-review-failsafe: run del Reviewer ya existe para ${pr.head.sha.slice(0,7)} (trigger opened/ready_for_review OK) — no se duplica.`);
              return;
            }
            // Sólo el caso dudoso (run ausente) paga el settle al bound de liveness
            // (~90s): dar tiempo a que el run del `opened` se materialice antes de
            // decidir. Decidir demasiado pronto sería un falso negativo ⇒ review
            // duplicada (ADR-217 §3: física de runs, no envejecimiento heurístico).
            await new Promise(r => setTimeout(r, 90000));
            const second = await found();
            if (second !== false) {
              if (second) core.notice(`open-review-failsafe: run del Reviewer apareció en el settle para ${pr.head.sha.slice(0,7)} — no se duplica.`);
              return;
            }
            // Ningún run: el `opened` se perdió. Materializar la transición por
            // ESTADO — needs-review con el PAT (remove+add para forzar el evento
            // labeled aunque hubiera un resto). Raw fetch con ARM_PAT: github-script
            // corre con el GITHUB_TOKEN default, cuyo `labeled` no dispara al Reviewer.
            const patCall = async (method, path, body) => {
              const res = await fetch(`https://api.github.com/repos/${owner}/${repo}${path}`, {
                method,
                headers: { Authorization: `Bearer ${process.env.ARM_PAT}`, Accept: 'application/vnd.github+json' },
                body: body ? JSON.stringify(body) : undefined });
              if (!res.ok && res.status !== 404) throw new Error(`HTTP ${res.status} ${path}`);
              return res;
            };
            await patCall('DELETE', `/issues/${pr.number}/labels/needs-review`);
            await patCall('POST', `/issues/${pr.number}/labels`, { labels: ['needs-review'] });
            await github.rest.issues.createComment({ owner, repo, issue_number: pr.number,
              body: '**claude-code · open-review-failsafe**: el evento que auto-dispara al Reviewer al volverse revisable el PR (`ready_for_review` del cierre draft-first, AP-094; `opened` si nació no-draft) no produjo ningún run tras el settle de liveness (~90s). Transición Creator→Reviewer materializada por ESTADO (camino RESIDUAL): `needs-review` aplicada con el PAT en el mismo job (repesca finplan#1382, AP-016). Idempotente por dedupe: si el evento hubiera disparado, este step no habría tocado nada. Si el stub del Reviewer de este repo no declara `ready_for_review` en sus `types`, este disparo es esperado (MIGRATION.md, AP-094).\n\n<!-- open-review-failsafe -->' });
            core.warning(`open-review-failsafe: PR #${pr.number} sin run del Reviewer para ${pr.head.sha.slice(0,7)} — needs-review aplicada por PAT (evento opened/ready_for_review perdido o no cableado en el stub).`);

      - name: Materializar muerte del Creator sin PR (post-step determinista)
        id: post_muerte_sin_pr
        # 2026-07-13, incidente finplan#1318: el Creator murió por max_turns a
        # las 11:42 tras commitear 9 commits y ANTES de abrir el PR. El
        # detector issue-armed-no-pr del watchdog lo habría cazado en su
        # siguiente tick (poll, 15-45 min de latencia); el propietario le ganó
        # la carrera e hizo el diagnóstico a mano. Este post-step lo hace PUSH
        # con latencia cero: el propio run sabe en el instante que la sesión
        # concluyó mal. Materializa el estado (AP-008.1) — comentario
        # diagnóstico con marcador, stalled (señal de architect-resolve; skip()
        # del watchdog NO la excluye) y retirada de serial-activo (evita el
        # deadlock clase #1312 en su variante Creator-muerto). El REARM no se
        # hace aquí: comentarios de GITHUB_TOKEN no disparan workflows
        # (incidente #1048) — es del watchdog o del humano, ahora con el
        # diagnóstico ya hecho. Las auditorías quedan fuera: su post-step
        # («Materializar auditoria-completa») ya cubre su modo de muerte.
        # v2 (2026-07-13, incidente #1329): también cubre `success`-sin-PR —
        # una sesión que COMMITEÓ trabajo en su rama y terminó «bien» según
        # ella, sin abrir PR ni escalar, es el mismo fallo de transición que
        # la muerte por max_turns (el Creator de #1329 dijo «implementadas y
        # validadas» y dejó todo en silencio). Criterio anti-falso-positivo:
        # en success solo materializa si la rama claude/issue-N-* EXISTE con
        # commits ahead — una sesión success sin commits es conversacional
        # legítima (escalada, respuesta) y su output es la conversación.
        # v5 (2026-07-16, central#46, AP-020): cierra la clase «terminal
        # completo-sin-PR no libera la serie ni arma la cola». Una sesión
        # success cuyo veredicto verificado es «alcance YA completo en la rama
        # base, sin PR que abrir» (marcador `creator-alcance-completo`) es un
        # estado terminal LEGÍTIMO, no una escalada: sin ramal propio caía en
        # la clasificación v4 («escalada no-declarada» ⇒ `human-needed`), falso
        # positivo que trató como fallo el cierre correcto de la serie (#46).
        # La serie se libera por el FIN DE TURNO del agente, no solo por merge
        # (AP-014); el cierre del issue sigue siendo HUMANO en el central
        # (merge/cierre no se delega, AP-019) ⇒ estado declarado, no `close`.
        if: |
          always() && steps.creator.outcome != 'skipped' && steps.creator.outcome != 'cancelled'
          && github.event.issue && !github.event.issue.pull_request
          && !contains(github.event.issue.labels.*.name, 'auditoria')
        uses: actions/github-script@v7
        env:
          # AP-027: CERO `${{ }}` dentro del script — el bloque supera los
          # 21000 chars y con una sola expresión Actions lo evalúa entero como
          # plantilla y rechaza el workflow al parsear (fichero inválido, runs
          # con 0 jobs; incidente 2026-07-17, PR #86). Mismo saneado que
          # epic-merge (Fase C): inputs y outputs de steps via env.
          STEP_CREATOR_OUTCOME: ${{ steps.creator.outcome }}
          IN_DEFAULT_BRANCH: ${{ inputs.default_branch }}
          # AP-101: el step `rescate` commiteó y pusheó un WIP del árbol sucio.
          RESCUE_WIP: ${{ steps.rescate.outputs.wip }}
          RESCUE_PR: ${{ steps.rescate.outputs.pr }}
          # central#309: firma de «la sesión existió» (ver ramal al inicio del script).
          EXEC_FILE: ${{ steps.creator.outputs.execution_file }}
          # AP-094: token por defecto SOLO para el `markReady` del draft huérfano.
          # Con el PAT, el `ready_for_review` que emite convocaría al Reviewer
          # (trigger nuevo del stub) Y el `needs-review` por PAT de a continuación
          # también ⇒ dos sesiones Opus en serie (`cancel-in-progress: false`).
          # Con el GITHUB_TOKEN el evento no dispara nada y la convocatoria es
          # UNA: el `labeled` por PAT, como hasta ahora (mismo reparto que el
          # backstop del watchdog).
          DEFAULT_GH_TOKEN: ${{ github.token }}
        with:
          # PAT, no GITHUB_TOKEN default (2026-07-14, finplan#1350): la label
          # `stalled` que aplica este step es el trigger por EVENTO de
          # architect-resolve (watchdog `on: labeled`). Con el token default el
          # evento no se emite (anti-loop de GitHub) y la señal degradaba al
          # tick del cron — el push prometido en el encabezado era en realidad
          # poll. Mismo patrón ya documentado para `needs-review` (abajo).
          github-token: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const n = issue.number;
            // central#309 (ruling mensual 2026-10-05; falso `stalled` en la propia
            // #309, run 37278082763): la firma de AP-036 exige que la sesión
            // EXISTIÓ. Si `claude-code-action` no llegó a lanzarla (su detector de
            // trigger no reconoció el disparo: «No trigger found, skipping
            // remaining steps») el step termina `success` SIN execution file
            // (ENOENT) — no hubo Creator que muriera ni prosa de cierre que rular.
            // Ramal: se libera `serial-activo` si lo colgó este arm (y la cola
            // recibe su turno, como en todo fin de turno que suelta la serie) y NO
            // se cuelga `stalled` ni marcador. Exige `success`: un fallo de la
            // action sin execution file sigue el camino de siempre (fail-closed:
            // puede haber trabajo empujado que diagnosticar).
            {
              const fs = require('fs');
              const f = process.env.EXEC_FILE || `${process.env.RUNNER_TEMP || '/tmp'}/claude-execution-output.json`;
              let sessionExisted = true;
              try { fs.accessSync(f, fs.constants.R_OK); } catch (e) { sessionExisted = false; core.info(`execution file ausente (${e.message}).`); }
              if (!sessionExisted && process.env.STEP_CREATOR_OUTCOME === 'success') {
                const held = (await liveLabels()).includes('serial-activo');
                if (held) {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: n, name: 'serial-activo' }).catch(() => {});
                  await popQueue(n, `arm sin sesión de #${n}`);
                }
                core.notice(`#${n}: la action no lanzó sesión (sin execution file) — sin stalled ni marcador; serie ${held ? 'liberada + cola' : 'no ocupada'}.`);
                return;
              }
            }
            // ¿Murió/terminó DESPUÉS de abrir su PR? Entonces gobierna el flujo
            // PR-driven — SALVO que el PR siga en DRAFT (AP-047, aterrizaje del
            // draft-en-primer-hito). El Creator abre el PR en DRAFT en su PRIMER push
            // de hito y lo marca ready al cerrar; si murió antes del cierre, el draft
            // quedó sin la transición ready. Ese acto —la ÚLTIMA acción discrecional
            // que esta clase de incidente (muerte-en-`success` sin PR) pierde— se
            // materializa aquí POR ESTADO: el draft EXISTE (abierto en el hito 1),
            // así que basta marcarlo ready + `needs-review` con el PAT (este step
            // corre con REVIEWER_GITHUB_TOKEN ⇒ el `labeled` dispara al Reviewer y su
            // gate ya ve el PR ready, sin depender del `opened` que un draft salta; el
            // `markReady` va con el GITHUB_TOKEN para que su `ready_for_review` no
            // convoque una segunda sesión, AP-094). El body es el del último hito
            // (fidelidad por construcción — lo que el belt declarativo AP-042
            // perseguía, ahora garantizado por el ARTEFACTO real). PR ya-ready ⇒ el
            // flujo PR-driven gobierna, nada que materializar.
            const { data: prs } = await github.rest.pulls.list({ owner, repo, state: 'open', per_page: 100 });
            const openPr = prs.find(p => p.head.ref.startsWith(`claude/issue-${n}-`));
            if (openPr) {
              // AP-101 (central#300): el step `rescate` pusheó un WIP del árbol sucio
              // a este PR y ya dejó el turno al Creator (`stalled` +
              // `estado:esperando-architect`). Marcarlo ready + `needs-review`
              // mandaría un WIP sin verificar al Reviewer.
              if (process.env.RESCUE_WIP === 'true') {
                // Si el rescate no vio este PR (lectura de `gh pr list` fallida), el
                // turno del Creator se materializa aquí con los mismos labels.
                if (process.env.RESCUE_PR !== String(openPr.number)) {
                  await github.rest.issues.addLabels({ owner, repo, issue_number: openPr.number, labels: ['estado:esperando-architect'] });
                  await github.rest.issues.addLabels({ owner, repo, issue_number: openPr.number, labels: ['stalled'] });
                  await github.rest.issues.createComment({ owner, repo, issue_number: openPr.number,
                    body: `**claude-code · arbol-rescatado-por-estado** (AP-101): el post-step de rescate pusheó un WIP del árbol sin pushear de la sesión del Creator de #${n} sin ver este PR. El turno sigue siendo del **Creator**: \`estado:esperando-architect\` + \`stalled\` ⇒ architect-resolve re-arma por evento. **Para el re-arm: continúa desde el árbol rescatado, no rehagas.**\n\n<!-- arbol-rescatado-por-estado -->` });
                }
                core.notice(`Creator de #${n}: árbol rescatado como WIP en PR #${openPr.number} (arbol-rescatado-por-estado) — turno del Creator; sin ready ni needs-review.`);
                return;
              }
              if (!openPr.draft) {
                core.notice(`Creator de #${n} concluyó con PR #${openPr.number} ya ready — flujo PR-driven gobierna; nada que materializar aquí.`);
                return;
              }
              // AP-095 (central#219): cierre DECLARADO. Si el bloque `pr-body-declarado`
              // válido más reciente de la sesión lleva `ready: sí` (paso (a) del orden
              // barato-primero de creator.md), el Creator ya fijó el body definitivo.
              // Se aplica al draft antes del `ready`, con cualquier outcome. Guardas:
              // el bloque es posterior a la apertura del draft (`updated_at`: cubre
              // también un bloque pre-draft editado para añadir la línea), así que un bloque de
              // una sesión anterior no entra aunque el arm no tenga comentario
              // disparador (trigTs = 0). `freshDeclaredPr` ya exige polaridad y
              // referencia coherentes y devuelve el body sin la línea `ready:`.
              // Fallo al leer o aplicar ⇒ se degrada a AP-047 (body del draft tal cual).
              let declaredReady = null;
              try {
                const d = await freshDeclaredPr();
                if (d && d.ready && new Date(d.updatedAt || d.createdAt).getTime() > new Date(openPr.created_at).getTime()) declaredReady = d;
              } catch (e) {
                core.warning(`AP-095: lectura del bloque pr-body-declarado falló para #${n}: ${e.message} — se sigue con el body del draft (AP-047).`);
              }
              let bodyApplied = false;
              if (declaredReady) {
                try {
                  await github.rest.pulls.update({ owner, repo, pull_number: openPr.number, body: declaredReady.body });
                  bodyApplied = true;
                } catch (e) {
                  core.warning(`AP-095: no se pudo aplicar el body declarado al PR #${openPr.number}: ${e.message} — se sigue con el body del draft (AP-047).`);
                }
              }
              // Draft huérfano (Creator murió antes del `gh pr ready` del cierre):
              // materializar la transición ready POR ESTADO. `markReady` con el
              // GITHUB_TOKEN (AP-094): su `ready_for_review` no dispara al Reviewer,
              // así que la única convocatoria es el `needs-review` por PAT de abajo.
              let readyOk = true;
              try {
                const res = await fetch('https://api.github.com/graphql', {
                  method: 'POST',
                  headers: { Authorization: `Bearer ${process.env.DEFAULT_GH_TOKEN}`, 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    query: `mutation($id:ID!){ markPullRequestReadyForReview(input:{pullRequestId:$id}){ pullRequest { number isDraft } } }`,
                    variables: { id: openPr.node_id } }) });
                const j = await res.json().catch(() => ({}));
                if (!res.ok || j.errors) throw new Error(`HTTP ${res.status} ${JSON.stringify(j.errors || '')}`);
              } catch (e) {
                readyOk = false;
                core.warning(`AP-047: markReadyForReview falló para PR #${openPr.number} de #${n}: ${e.message} — se aplica needs-review igual (el gate del Reviewer saltará si el PR sigue en draft; queda el watchdog).`);
              }
              // `needs-review` con el PAT (remove+add para forzar el evento `labeled`
              // aunque hubiera un resto). El PR ya-ready ⇒ el gate de reviewer.yml
              // corre; el `labeled` del PAT (no claude[bot]) pasa su anti-recursión.
              await github.rest.issues.removeLabel({ owner, repo, issue_number: openPr.number, name: 'needs-review' }).catch(() => {});
              await github.rest.issues.addLabels({ owner, repo, issue_number: openPr.number, labels: ['needs-review'] });
              if (bodyApplied) {
                await github.rest.issues.createComment({ owner, repo, issue_number: openPr.number,
                  body: `**claude-code · post-step**: la sesión del Creator de #${n} terminó en \`${process.env.STEP_CREATOR_OUTCOME}\` con su PR en DRAFT, pero había DECLARADO el cierre: bloque \`pr-body-declarado\` con \`ready: sí\` (AP-095, orden barato-primero). Transición ejecutada por estado:\n\n- **Body del PR** = el del bloque declarado (polaridad \`${declaredReady.polarity}\`, sin la línea \`ready:\`).\n- ${readyOk ? `**PR #${openPr.number} marcado \`ready\`** (\`markPullRequestReadyForReview\` con el token del job; su \`ready_for_review\` no convoca, AP-094).` : `**\`markPullRequestReadyForReview\` FALLÓ** para PR #${openPr.number}: sigue en draft y lo recoge el backstop del watchdog (AP-047), ya con el body declarado.`}\n- **\`needs-review\`** aplicada con el PAT: una sola convocatoria del Reviewer.\n\n${readyOk ? 'Es una transición con dueño, no una repesca: el Creator declaró el cierre y el post-step lo ejecuta.' : 'El body declarado sí es transición con dueño; el `ready` no se materializó y, si lo rescata el backstop del watchdog (`creator-muerto-draft-materializado-ready`), ese episodio es repesca.'}\n\n<!-- ready-declarado-materializado -->` });
                core.notice(`AP-095: PR #${openPr.number} de #${n} con body declarado aplicado + ready + needs-review por PAT (cierre declarado con ready: sí).`);
                return;
              }
              await github.rest.issues.createComment({ owner, repo, issue_number: openPr.number,
                body: `**claude-code · post-step**: la sesión del Creator de #${n} terminó en \`${process.env.STEP_CREATOR_OUTCOME}\` con su PR **en DRAFT** (abierto en el primer push de hito, AP-047) y SIN marcarlo ready — el acto de cierre discrecional que esta clase de incidente (muerte-en-\`success\` sin PR) pierde. Materializado por ESTADO en el instante:\n\n- **PR #${openPr.number} marcado \`ready\`** (\`markPullRequestReadyForReview\` con el token del job — su \`ready_for_review\` no convoca, AP-094) con el body del último hito (fidelidad por construcción — lo que AP-042 perseguía, ahora por artefacto real).\n- **\`needs-review\`** aplicada con el PAT ⇒ el Reviewer dispara por \`labeled\` (su gate ya ve el PR ready), sin depender del \`opened\` (que un draft salta) sin doble convocatoria.\n- \`serial-activo\` ya retirada al existir el PR (post-step de liberación); el PR ready es la señal de vuelo — la serie la libera el MERGE.\n\n<!-- creator-muerto-draft-materializado-ready -->` });
              core.warning(`AP-047: PR #${openPr.number} de #${n} en draft materializado a ready + needs-review por PAT (muerte antes del cierre en verde).`);
              return;
            }
            const outcome = process.env.STEP_CREATOR_OUTCOME;
            // Labels VIVAS, no del payload (incidente central#59): el snapshot
            // del evento de rearm PRECEDE a la re-aplicación de `serial-activo`
            // por epic-merge — el guard veía «sin serie» con la serie ocupada y
            // la cerraba en silencio. Toda lectura de labels en este post-step
            // pasa por aquí.
            async function liveLabels() {
              const { data: li } = await github.rest.issues.get({ owner, repo, issue_number: n });
              return (li.labels || []).map(l => (typeof l === 'string' ? l : l.name));
            }
            // Pop de la cola serial (espejo del armQueue de epic-merge — si
            // tocas uno, toca el otro): arma la cabeza de `en-cola` (orden por
            // prioridad de central#313; sin etiquetas, el más antiguo — FIFO).
            // AP-062: el `armed` que publica al armar es lo que apaga el
            // barrido de cola del cierre del job (step «Barrido de cola al
            // cierre») — un arm de este step ES el nuevo titular de la serie
            // desde que se postea el comentario, aunque su run tarde segundos
            // en nacer y todavía no tenga `serial-activo` ni PR que lo delaten.
            // central#313: orden de la cola por prioridad (`cola-prioridad.cjs`,
            // checkout sparse `.cola-central`; respaldo: la copia injertada en
            // `scripts/`). Sin módulo, FIFO (statu quo) — degradación, nunca peor.
            let COLA = null;
            for (const p of [`${process.env.GITHUB_WORKSPACE}/.cola-central/vendored/scripts/cola-prioridad.cjs`, `${process.env.GITHUB_WORKSPACE}/scripts/cola-prioridad.cjs`]) {
              try { COLA = require(p); break; } catch (e) { /* siguiente ubicación */ }
            }
            if (!COLA) core.warning('cola-prioridad no disponible — la cola sale FIFO (statu quo).');
            async function popQueue(fromIssue, why) {
              try {
                // central#314 (ruling, punto 2): en pausa, el pop no arma nada.
                // Sin `armed`: el barrido del cierre lee la pausa y tampoco arma.
                const pausa = (COLA && COLA.leerPausa) ? await COLA.leerPausa({ github, owner, repo, warn: (m) => core.warning(m) }) : null;
                if (pausa && pausa.pausado) {
                  core.notice(`pop de cola (${why}): RETENIDO por pausa-cola (${COLA.describirPausa(pausa)}) — nada nuevo se arma hasta retirarla.`);
                  return;
                }
                const { data: queued } = await github.rest.issues.listForRepo({
                  owner, repo, state: 'open', labels: 'en-cola', sort: 'created', direction: 'asc', per_page: 100 });
                // central#313: urgente → eslabón suspendido → alta → normal.
                const next = (COLA
                  ? await COLA.ordenarConSuspension({ github, owner, repo, items: queued, warn: (m) => core.warning(m) })
                  : queued.filter(i => !i.pull_request))[0];
                // Diagnóstico de la lectura (AP-062, espejo del de armQueue):
                // sin él, un pop que no arma no distingue «la lista volvió
                // VACÍA» (ventana de escritura de la label) de «volvió con el
                // ítem y lo filtró `!i.pull_request`» — causas raíz DISTINTAS
                // y sólo una la cierra el barrido. finplan#1702 no dejó rastro
                // que permitiera separarlas a posteriori.
                if (!next) {
                  core.info(`pop de cola (${why}): sin candidato — listForRepo?labels=en-cola devolvió ${queued.length} ítem(s), 0 issues tras filtrar PRs.`);
                  return;
                }
                await github.rest.issues.removeLabel({ owner, repo, issue_number: next.number, name: 'en-cola' }).catch(() => {});
                await github.rest.issues.removeLabel({ owner, repo, issue_number: next.number, name: 'stalled' }).catch(() => {});
                await github.rest.issues.createComment({ owner, repo, issue_number: next.number,
                  body: `@claude arranca — turno de cola: la serie quedó libre (${why}). ${COLA ? COLA.describir(next) : 'Eras el más antiguo en \`en-cola\`.'}\n\n<!-- arm-de-cola -->` });
                core.setOutput('armed', 'true');
                core.notice(`cola: #${next.number} armado (${why}).`);
              } catch (e) { core.warning(`pop de cola falló: ${e.message}`); }
            }
            // AP-020 v5 + enmienda v5.1 (central#56, criterio 1 «success O
            // muerte»): materializa el veredicto terminal legítimo «alcance ya
            // completo en la rama base, sin PR que abrir». Extraído a helper
            // para COMPARTIR el mismo efecto entre el camino `success`-sin-PR y
            // el de MUERTE-sin-PR: una sesión que posteó su veredicto y murió
            // después (max_turns) es igual de terminal-legítima que el cierre
            // limpio — el criterio 1 del issue lo dice literal. Antes el ramal
            // vivía solo en el bloque `success` y la muerte post-veredicto caía
            // en `creator-muerto-sin-pr` (`stalled`), misclasificando el
            // veredicto correcto como stall.
            async function materializeScopeComplete(opts = {}) {
              const viaState = !!opts.viaState;
              const held = (await liveLabels()).includes('serial-activo');
              if (held) await github.rest.issues.removeLabel({ owner, repo, issue_number: n, name: 'serial-activo' }).catch(() => {});
              // AP-037 (2026-07-20): el cierre de la completitud por-estado es
              // AUTÓNOMO — se añade `stalled` (este step corre con PAT) ⇒
              // architect-resolve POR EVENTO verifica el veredicto contra HEAD
              // con verificación MATERIALIZADA y cierra `completed`; el handler
              // AP-031 consume los sentinels al cierre. Rectifica la cláusula
              // «opción A sin necesidad» de AP-019 y el «NO stalled» de
              // AP-020/AP-026 (necesidad medida: finplan#1547 paró la cadena
              // horas por un cierre que el resolutor puede ejercer). La label
              // `estado:cierre-pendiente-humano` se conserva (guard de
              // postStateClose + firma del belt de cierre del detect).
              await github.rest.issues.addLabels({ owner, repo, issue_number: n, labels: ['estado:cierre-pendiente-humano', 'stalled'] });
              // AP-026 (2026-07-17, repesca finplan#1466): el terminal
              // alcance-completo se materializa por DOS vías con el MISMO efecto
              // mecánico — (a) el marcador `creator-alcance-completo` del Creator
              // (vía normal, AP-020); (b) el BELT por estado del re-arm de un
              // parcial fantasma (`viaState`), cuando la sesión re-verificó en
              // verde pero no emitió el marcador (el modo exacto del incidente:
              // recomendó cierre manual en prosa). El comentario y el marcador de
              // rastro difieren para que la auditoría/5-whys distinga
              // marcador-emitido de estado-derivado.
              const preamble = viaState
                ? `**claude-code · post-step**: sesión de **re-arm de un parcial fantasma** (\`pr-abierto-por-estado\` mergeado ⇒ \`epic-partial-relaunch-por-estado\` **sin** \`...-con-cita\`) terminó \`success\` sin PR, sin commits y SIN emitir \`creator-alcance-completo\`. El "resto" de ese parcial forzado era \`desconocido\` — placeholder, no alcance real, y **verificado como tal por la ausencia del marcador \`-con-cita\`** (con cita transportada, AP-054, este belt NO dispara: se enruta a architect-resolve por \`stalled\`, AP-036). Siendo el resto un placeholder, la re-verificación en verde que no encuentra nada ES el terminal **alcance ya COMPLETO** — **NO es escalada** ⇒ el estado lo DERIVA en vez de degradar a \`human-needed\` (cola fantasma, AP-026):`
                : `**claude-code · post-step**: el Creator concluyó con veredicto **alcance ya COMPLETO en la rama base, sin PR que abrir** (\`<!-- creator-alcance-completo -->\`). Estado terminal legítimo materializado en el instante — **NO es escalada**:`;
              const traceMarker = viaState ? 'creator-alcance-completo-materializado-por-estado' : 'creator-alcance-completo-materializado';
              const humanNote = viaState
                ? '\n- **Derivado por ESTADO, no por marcador**: la verificación materializada del resolver es OBLIGATORIA y con anclas frescas — si el veredicto NO se sustenta, re-arma al Creator con el hueco (alcance real sin cubrir), no cierres (AP-026/AP-037).'
                : '';
              await github.rest.issues.createComment({ owner, repo, issue_number: n,
                body: `${preamble}\n\n- ${held ? '`serial-activo` retirada y **turno pasado a la cola** — la serie se libera por el fin de turno del agente, no solo por merge (AP-014/AP-020).' : 'la serie no estaba ocupada por este issue: nada que liberar ni que armar.'}\n- \`estado:cierre-pendiente-humano\` + \`stalled\` aplicadas (AP-037): architect-resolve verifica el veredicto contra HEAD con verificación MATERIALIZADA (checks anclados \`file:line\` en comentario) y cierra \`completed\` — el humano entra por doble rebote o veto asíncrono, no de primera línea.${humanNote}\n\n<!-- ${traceMarker} -->` });
              if (held) await popQueue(n, `alcance completo ${viaState ? 'derivado por estado' : 'verificado'} de #${n}`);
              core.notice(`Creator de #${n}: alcance-completo materializado (${viaState ? 'BELT por estado' : 'marcador'}, serie ${held ? 'liberada + cola armada' : 'no ocupada'}, cierre-pendiente-humano).`);
            }
            // Detección del marcador fresco `creator-alcance-completo` (freshness
            // vs comentario disparador — lección del bucle PR #180), reutilizada
            // por ambos caminos terminales. `scoped` sólo es true si el último
            // comentario de claude[bot] es POSTERIOR al disparador y lleva el
            // marcador HTML anclado (nunca substring de prosa — clase PR #1133).
            async function freshScopeComplete() {
              const trigTs = context.payload.comment ? new Date(context.payload.comment.created_at).getTime() : 0;
              const { data: cs } = await github.rest.issues.listComments({ owner, repo, issue_number: n, per_page: 100 });
              const bots = cs.filter(c => c.user?.login === 'claude[bot]');
              const lastBot = bots.length ? bots[bots.length - 1] : null;
              // AP-028 capa 2 (repesca finplan#1467): el marcador terminal viaja
              // en un comentario SEPARADO vía `gh api` (canal que conserva HTML),
              // NO en el tracking comment (que lo elimina — AP-013) y rara vez es
              // el comentario más reciente (el tracking comment se reescribe al
              // final). Grepea el marcador en TODOS los comentarios frescos de
              // claude[bot] (POSTERIORES al disparador — lección #180), no solo en
              // el último. Anclado como HTML (clase PR #1133), jamás substring.
              const freshBots = bots.filter(c => new Date(c.created_at).getTime() > trigTs);
              const fresh = freshBots.length > 0;
              // AP-035: vía primaria = token de TEXTO anclado a inicio de línea
              // en la PRIMERA línea del cierre (sobrevive al tracking comment,
              // clase posicional compliant AP-011); el HTML separado (AP-028)
              // degrada a belt — se sigue aceptando en OR.
              const scoped = freshBots.some(c => /<!--\s*creator-alcance-completo\s*-->/.test(c.body || '') || /^\[ALCANCE-COMPLETO\]/m.test(c.body || ''));
              return { lastBot, fresh, scoped, freshBots };
            }
            // AP-030 (2026-07-18, repesca finplan#1478) · GENERALIZADO por AP-042
            // (2026-07-21, repesca finplan#1547): cuando el Creator NO pudo abrir
            // el PR pero dejó la rama ahead + un bloque `pr-body-declarado` FRESCO
            // con el body ÍNTEGRO del PR declarado (su polaridad fiel + referencia
            // consistente `Closes`/`Refs #N`), el post-step abre el PR con ESE body
            // y ESA polaridad en vez de forzar `partial-pr`. AP-030 nació para la
            // emergencia «App token de `claude[bot]` caducado a mitad de sesión —
            // TTL ~1h»; AP-042 lo lleva a CADENCIA DE HITO (el Creator publica/
            // actualiza el bloque en cada push de hito) ⇒ hay declaración FIEL
            // muera el Creator donde muera (token caducado, turnos/contexto
            // agotados en la derivación densa antes del paso de apertura, etc.). La polaridad falsa desata una
            // cascada cara (parcial fantasma: re-arm nulo + belt AP-026 + watchdog
            // falso-positivo + arm manual — 5-whys finplan#1481); un `full-pr`
            // fiel cierra el issue (`Closes #N`) y consume `launch-next` en el
            // propio merge de epic-merge ⇒ cascada cero. El body viaja delimitado
            // por marcadores HTML en LÍNEA PROPIA por comentario SEPARADO vía
            // `gh api` (canal que conserva HTML — clase central#44/#85/AP-028; el
            // tracking comment los elimina), jamás substring de prosa (clase PR
            // #1133). Freshness: solo cuenta un comentario de claude[bot]
            // POSTERIOR al disparador de ESTA sesión (la que dejó la rama ahead) —
            // lección #180; una declaración `full-pr` estale de otra sesión queda
            // excluida por el filtro, y CI + Reviewer siguen siendo gates
            // completos del PR resultante (mitigación del riesgo declaración-estale).
            async function freshDeclaredPr() {
              const trigTs = context.payload.comment ? new Date(context.payload.comment.created_at).getTime() : 0;
              const { data: cs } = await github.rest.issues.listComments({ owner, repo, issue_number: n, per_page: 100 });
              const freshBots = cs.filter(c => c.user?.login === 'claude[bot]' && new Date(c.created_at).getTime() > trigTs);
              // Del más reciente al más antiguo: gana la declaración FRESCA más
              // NUEVA de ESTA sesión. Con la cadencia de hito (AP-042, generaliza
              // AP-030) el Creator publica/ACTUALIZA el bloque en CADA push de
              // hito —no solo en la emergencia de token caducado—, así que muera
              // donde muera hay un bloque FIEL y el más reciente refleja el último
              // estado empujado. El lower bound `> trigTs` mantiene la lección
              // #180 (jamás un bloque de una sesión ANTERIOR al disparador); es la
              // MISMA sesión (la que dejó la rama ahead), no «cualquier bloque
              // posterior al disparador» sin más — se elige el más reciente válido.
              for (let i = freshBots.length - 1; i >= 0; i--) {
                const body = freshBots[i].body || '';
                const m = body.match(/<!--\s*pr-body-declarado:start\s*-->\r?\n([\s\S]*?)\r?\n<!--\s*pr-body-declarado:end\s*-->/);
                if (!m) continue;
                const declaredBody = m[1].trim();
                // Polaridad anclada a INICIO DE LÍNEA (clase 6 regex polarity),
                // exactamente UNA de las dos (ninguna o ambas ⇒ declaración
                // inválida, sigue buscando una anterior).
                const isFull = /^<!--\s*full-pr\s*-->\s*$/m.test(declaredBody);
                const isPartial = /^<!--\s*partial-pr\s*-->\s*$/m.test(declaredBody);
                if (isFull === isPartial) continue;
