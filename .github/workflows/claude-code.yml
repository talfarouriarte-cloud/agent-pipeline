                // guarda de prefijo `(?!\d)` para no colisionar con #Nx — clase 6,
                // ningún substring de prosa):
                //  - full-pr    ⇒ `Closes #N` FIEL: restituye el cierre automático
                //    del issue y el consumo de `launch-next` por epic-merge al
                //    mergear (cascada cero);
                //  - partial-pr ⇒ `Refs #N` (NO `Closes`: un parcial que cerrara
                //    el issue huérfana el alcance restante). El parcial FIEL solo
                //    mejora el body «Alcance restante» sobre el «desconocido»
                //    forzado de AP-023, sin optimismo de cierre (degradación
                //    segura — riesgo 1 de AP-042). Un bloque partial+`Closes` es
                //    incoherente ⇒ se rechaza y cae al forzado (con `Refs`).
