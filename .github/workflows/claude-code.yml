            }
            // AP-054 (2026-07-27, repesca finplan#1685): TRANSPORTE del cierre
            // PÚBLICO de la sesión muerta. `freshDeclaredPr` lee el canal
            // ESTRUCTURADO (bloque `pr-body-declarado`, AP-042) y, ausente éste,
            // el compositor degradaba a «Alcance restante: `desconocido`» —
            // AUNQUE el alcance restante estuviera declarado, verbatim y público,
            // en el último comentario de la sesión. Incidente: finplan#1685
            // publicó a las 10:30:58Z su checklist de cierre con «[→] §D2
            // escalado al Architect», murió en `success` sin PR, y el
            // relanzamiento gastó 43m14s re-derivando lo que el turno anterior
            // ya sabía. El canal estructurado falla precisamente en las sesiones
            // que MUEREN —que son exactamente las que este compositor rescata—:
            // 2ª omisión medida del bloque tras AP-042, con 0/8 tags de cierre en
            // la misma unidad. El comentario público ES estado materializado
            // (principio 1 de protocol.md); no leerlo y fabricar «desconocido»
            // es inferencia sobre estado disponible.
            //
            // NEUTRALIZACIÓN (la mitad que el blockquote NO cubre). Citar prosa
            // del agente re-emite el vocabulario del pipeline dentro de un
            // artefacto que otros workflows parsean — clase «regex polarity
            // blindness» del pipeline-map. Dos capas, porque los consumidores se
            // reparten en dos familias:
            //  1. `> ` por LÍNEA (blockquote) rompe los matchers ANCLADOS a
            //     inicio de línea: `^\s*\[READY-TO-MERGE\]`, `^\[ALCANCE-COMPLETO\]`,
            //     `^<!--\s*full-pr\s*-->\s*$` de este mismo helper. `>` no es
            //     `\s`, así que la cita jamás satisface el ancla.
            //  2. Escape de la sintaxis de comentario HTML (`<!--`/`-->` →
            //     `&lt;!--`/`--&gt;`) rompe los matchers SIN anclar, que el
            //     blockquote deja intactos. Este es el camino REALMENTE letal:
            //     `epic-merge.yml` lee la polaridad con `/<!--\s*full-pr\s*-->/`
            //     sobre el body ENTERO del PR, sin ancla. Un cierre que eche el
            //     body que pensaba abrir —justo lo que AP-042 le pide publicar—
            //     contiene `<!-- full-pr -->`; citado sin escapar, el parcial
            //     FORZADO se leería como FULL ⇒ issue cerrado y `launch-next`
            //     consumido con el alcance restante huérfano: la cascada exacta
            //     que AP-042 existe para evitar, reintroducida por el fix.
            //     Renderizado en PROSA, `&lt;!--` se ve `<!--` y el humano sigue
            //     leyendo el texto verbatim; sólo las regex dejan de casar.
            //     Límite declarado (review AP-054): dentro de un code span o de
            //     un bloque cercado las entidades NO se decodifican, así que un
            //     marcador que el Creator escribiera entre backticks —forma
            //     habitual— se lee `&lt;!-- ... --&gt;` en crudo. Se acepta: la
            //     capa es de SEGURIDAD, y la fuente íntegra viaja enlazada.
            //  3. Neutralización de las KEYWORDS DE CIERRE de GitHub
            //     (`Closes/Fixes/Resolves #N` → referencia en inline-code). El
            //     tercer consumidor de este body no es un workflow nuestro: es
            //     el parser NATIVO de GitHub, que enlaza el PR al issue y lo
            //     CIERRA al mergear. Un cierre que eche su body declarado trae
            //     `Closes #N` literal (AP-042 se lo pide); citarlo en un parcial
            //     FORZADO cerraría el issue con alcance sin cubrir — el mismo
            //     desenlace que la guarda `antiRef` de AP-042 rechaza en el canal
            //     estructurado, y esa coherencia hay que mantenerla también aquí.
            //     GitHub no parsea keywords dentro de inline-code; el blockquote
            //     por sí solo NO basta (verificado: la referencia sobrevive a la
            //     cita). Cinturón, no tirante único: `epic-merge` ya REABRE
            //     explícitamente todo issue de PR parcial («inmunidad a un
            //     `Closes #N` extraviado», 2026-07-06 #1097), así que el peor
            //     caso residual es un cierre transitorio, no alcance huérfano.
            //     ENMIENDA de la review de AP-054: esa inmunidad sólo cubre el
            //     issue de ESTE repo (`epic-merge` reabre con `owner`/`repo`
            //     propios), luego la forma CROSS-REPO `Closes owner/repo#N`
            //     cerraría un issue del OTRO consumidor SIN red — y el corpus de
            //     estos agentes está lleno de referencias cruzadas finplan ⇄ wmcb
            //     ⇄ central. Se cubren por tanto las TRES formas que GitHub
            //     honra: `#N`, `owner/repo#N` y la URL completa del issue; y el
            //     separador admite el `Fixes: #N` con dos puntos. La pasada
            //     respeta los code spans y los bloques cercados PREEXISTENTES
            //     (donde GitHub ya no parsea nada): sin eso, un `Closes #N` que
            //     el Creator ya escribió entre backticks producía
            //     `` `Closes `#N`` `` — markdown roto que podía DESHACER el code
            //     span y devolver la referencia al parser.
            // Efecto colateral BUSCADO: ningún marcador citado puede abrir línea,
            // así que el delimitador `cierre-sesion-muerta:*` (que epic-merge
            // extrae con ancla `^`) es inviolable desde el contenido citado.
            const CLOSE_KW_RE = /\b(clos(?:e|es|ed)|fix(?:e[sd])?|resolv(?:e|es|ed))(\s*:?\s+)((?:[\w.-]+\/[\w.-]+)?#\d+)\b/gi;
            const ISSUE_URL_RE = /\bhttps?:\/\/github\.com\/[\w.-]+\/[\w.-]+\/issues\/\d+\b/gi;
            function neutralizeCloseRefs(text) {
              let inFence = false;
              return text.split('\n').map(line => {
                if (/^\s*(?:```|~~~)/.test(line)) { inFence = !inFence; return line; }
                if (inFence) return line; // GitHub no parsea referencias en bloque cercado
                // Índices IMPARES = code spans ya existentes: se dejan intactos
                // (GitHub tampoco los parsea, y tocarlos rompería el span).
                return line.split(/(`+[^`]*`+)/).map((seg, i) => i % 2 === 1 ? seg
