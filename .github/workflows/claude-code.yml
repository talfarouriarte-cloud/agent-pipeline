              // aunque `since` no aplique (disparador sin comentario ⇒ trigTs 0).
              const cs = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: n, per_page: 100,
                ...(trigTs ? { since: new Date(trigTs).toISOString() } : {}),
              });
              const freshBots = cs.filter(c => c.user?.login === 'claude[bot]' && new Date(c.created_at).getTime() > trigTs);
