              // (lección #180: jamás un comentario de una sesión ANTERIOR al
              // disparador). Gana el más reciente con prosa real.
              for (let i = freshBots.length - 1; i >= 0; i--) {
                const raw = (freshBots[i].body || '').trim();
                if (!raw) continue;
                const truncated = raw.length > QUOTE_CAP;
                const text = truncated ? raw.slice(0, QUOTE_CAP) : raw;
                return {
                  quote: quoteProse(text) + (truncated ? '\n>\n> …(truncado)' : ''),
                  url: freshBots[i].html_url,
                  at: freshBots[i].updated_at || freshBots[i].created_at,
                  truncated,
                };
              }
              return null;
            }
            // Estado de la rama huérfana (si existe): el diagnóstico que el
            // rearm necesita ("no rehagas nada").
            let branchInfo = 'sin rama creada (muerte temprana: no hay trabajo que conservar).';
            let hasCommits = false;
            let branchRef = null;
            try {
              const { data: refs } = await github.rest.git.listMatchingRefs({ owner, repo, ref: `heads/claude/issue-${n}-` });
