                // anclada a línea propia DENTRO del par. Se retira del body que se
                // devuelve: es una instrucción para el post-step, no contenido del PR.
                const readyRe = /^[ \t]*ready:[ \t]*s[ií][ \t]*$/im;
                const ready = readyRe.test(declaredBody);
                const cleanBody = ready
                  ? declaredBody.split(/\r?\n/).filter(l => !/^[ \t]*ready:[ \t]*s[ií][ \t]*$/i.test(l)).join('\n').trim()
