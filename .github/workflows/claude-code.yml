            // inmergeable (fix review #73; el análisis previo del Riesgo 1 solo
            // consideró el edge del Reviewer, no el de CI). Por eso NO se aplica
            // `needs-review`: el `opened` ya arma la review — añadir la label
            // DOBLARÍA la sesión Opus (labeled + opened). Polaridad PARCIAL
            // forzada: el post-step no puede juzgar full/partial ⇒ `Refs #N` +
            // `partial-pr` + «Alcance restante» de texto fijo (mismo default del
            // protocolo: sin declaración = parcial). Fail-safe: si mergea,
            // epic-merge re-arma el parcial (cap 3/6) o un alcance realmente
            // completo termina en `creator-alcance-completo` (AP-020) o cierre
            // humano.
            // AP-101: si lo empujado es un WIP rescatado del árbol sucio, NO se abre
            // PR (el `opened` convocaría al Reviewer sobre un WIP sin verificar):
            // cae al residual (`stalled` + re-arm «continúa desde la rama, no rehagas»).
            if (hasCommits && branchRef && process.env.RESCUE_WIP !== 'true') {
              // AP-030 (2026-07-18, repesca finplan#1478) + AP-042 (2026-07-21,
              // repesca finplan#1547): antes de FORZAR `partial-pr`, respeta la
              // declaración de polaridad + body que el Creator dejó FRESCA. AP-030
              // la reservaba a la emergencia «App token caducado a mitad de
              // sesión»; AP-042 la GENERALIZA a cadencia de hito (el Creator
              // publica/actualiza el bloque en cada push de hito), así que la
              // declaración FIEL existe muera el Creator donde muera —agote turnos
              // o contexto en la derivación densa, no solo por credencial. Si
              // existe y es fiel (polaridad anclada única + referencia consistente:
              // `Closes #N` para full, `Refs #N` para partial), abre CON ESE body
              // y ESA polaridad — un `full-pr` fiel restituye el cierre del issue y
              // el consumo de sentinels por epic-merge (cascada cero); un
              // `partial-pr` fiel abre con «Alcance restante» REAL en vez del
              // «desconocido» forzado. Sin declaración fiel ⇒ `partial-pr` forzado
              // (camino residual para muerte-sin-bloque, comportamiento AP-023).
              const declared = await freshDeclaredPr();
              const declaredRef = declared ? (declared.polarity === 'full-pr' ? `Closes #${n}` : `Refs #${n}`) : null;
              // AP-054: sin bloque estructurado FIEL, antes de degradar a
              // «desconocido» transporta la prosa de cierre PÚBLICA de la sesión
              // muerta. Solo se consulta en el camino forzado: con declaración
              // fiel el body es del Creator y no se toca.
              const closing = declared ? null : await freshClosingProse();
              // Delimitadores en LÍNEA PROPIA: `epic-merge` extrae de aquí la
              // cita para el texto de re-arm (2ª mitad de AP-054) sin re-consultar
              // la API ni re-parsear prosa. Inviolables desde el contenido: toda
              // línea citada abre con `> `.
              const scopeSection = closing
                ? [
                    `**Transportado del cierre PÚBLICO de la sesión muerta** ([comentario](${closing.url}), ${closing.at}) — cita VERBATIM, sin interpretación del post-step. Los marcadores HTML van escapados (\`&lt;!--\`) y cada línea en blockquote: la cita NO declara polaridad ni emite tags, solo transporta estado (AP-054).`,
                    '',
                    '<!-- cierre-sesion-muerta:start -->',
                    closing.quote,
                    '<!-- cierre-sesion-muerta:end -->',
                    '',
                    '**Cómo leerlo:** la polaridad REAL de este PR es la forzada (`partial-pr`), no la que la cita pueda mencionar — el post-step no juzga full/partial. Si la cita declara alcance restante o una escalada, ESO es el resto real; si describe el trabajo como terminado, el re-arm lo re-verifica contra HEAD y emite `<!-- creator-alcance-completo -->`. **epic-merge y el Auditor: el resto de este PR es la cita, no un `desconocido`.**',
                  ].join('\n')
                : '**desconocido — parcial FORZADO por estado, NO un parcial de contenido real.** El post-step no juzga full/partial: marca `partial-pr` por seguridad porque la sesión murió antes de declarar alcance, y no dejó NINGÚN comentario fresco que citar (AP-054: el transporte de prosa no encontró fuente). Semántica del "resto" (AP-026): si esto mergea, `epic-merge` re-arma el issue con el marcador `epic-partial-relaunch-por-estado` y la sesión re-armada DEBE re-verificar contra el HEAD y declarar el TERMINAL — si NADA queda, emite `<!-- creator-alcance-completo -->` (no cierre manual en prosa); si queda alcance real, lo cubre y abre un PR full. **epic-merge y el Auditor NO deben leer este "desconocido" como una laguna de contenido real** — es un placeholder con desenlace determinista, no trabajo pendiente identificado.';
              const forcedPartialBody = [
                `Refs #${n}`,
                '',
                `PR **abierto por el post-step desde el ESTADO** (\`<!-- pr-abierto-por-estado -->\`): la sesión del Creator terminó en \`${outcome}\` con el trabajo commiteado en verde y SIN abrir el PR. La transición Creator→PR está determinada por el estado (rama \`${branchRef}\` con commits ahead + issue referenciado); el post-step la EJECUTA con el PAT en vez de re-armar otra sesión (repesca finplan#1404, AP-023). Abierto con el PAT ⇒ el evento \`opened\` dispara CI y la review (rama de agente) como cualquier PR normal.`,
                '',
                'pre-reviewer: no ejecutado — PR abierto por post-step desde estado',
                '',
                '<!-- partial-pr -->',
                '',
                '### Alcance restante (para el Architect)',
                '',
                scopeSection,
                '',
                '<!-- pr-abierto-por-estado -->',
              ].join('\n');
              const prBody = declared ? declared.body : forcedPartialBody;
              const prTitle = declared
                ? `Cierre de #${n} desde estado FIEL (Creator declaró el body por cadencia de hito pero murió antes de abrir el PR): ${branchRef}`
                : `Cierre desde estado de #${n} (Creator terminó en ${outcome} sin abrir el PR): ${branchRef}`;
              let prNum = null;
              try {
                const { data: created } = await github.rest.pulls.create({
                  owner, repo,
                  title: prTitle,
                  head: branchRef, base: process.env.IN_DEFAULT_BRANCH, body: prBody });
                prNum = created.number;
              } catch (e) {
                // Apertura imposible (rama sin diff mergeable, conflicto, carrera
                // con otra apertura): NO se pudo ejecutar la transición ⇒ cae al
                // camino RESIDUAL de abajo (stalled + serie liberada + re-arm).
                core.warning(`AP-023: apertura de PR desde estado falló para #${n}: ${e.message} — cae a residual (stalled + re-arm).`);
              }
              if (prNum) {
                // Review + CI por el `opened` del PAT (arriba). NO se aplica
                // `needs-review`: el `opened` de un PR con rama claude/* ya arma
                // la review (gate reviewer.yml, `isAgentBranch`) — la label
                // DOBLARÍA la sesión Opus (labeled + opened). Serie: el Creator
                // murió y ya NO retirará `serial-activo` al abrir su PR; lo hace
                // este step al NACER el PR (espejo del post-step «Liberar
                // serial-activo al existir PR»). NO pop de cola: el PR abierto ES
                // ahora la señal de vuelo (el guard serial bloquea con PR
                // claude/* abierto) — la serie la libera el MERGE y ahí
                // epic-merge arma la cola, como cualquier PR normal.
                await github.rest.issues.removeLabel({ owner, repo, issue_number: n, name: 'serial-activo' }).catch(() => {});
                const polarityNote = declared
                  ? `polaridad **FIEL \`${declared.polarity}\`** con el body íntegro y \`${declaredRef}\` restituidos del bloque \`pr-body-declarado\` FRESCO del Creator (cadencia de hito AP-042, generaliza AP-030); un \`full-pr\` fiel cierra el issue y consume \`launch-next\` en el propio merge (cascada cero); un \`partial-pr\` fiel abre con «Alcance restante» REAL en vez del «desconocido» forzado de AP-023`
                  : closing
                    ? `polaridad \`partial-pr\` forzada, \`Refs #${n}\`, y «Alcance restante» con la **cita VERBATIM del cierre público** de la sesión muerta ([comentario](${closing.url})${closing.truncated ? ', truncada al cap de tamaño' : ''}) en vez del \`desconocido\` — sin bloque \`pr-body-declarado\` fiel, el comentario público SIGUE siendo estado materializado (AP-054, repesca finplan#1685)`
                    : `polaridad \`partial-pr\` forzada, \`Refs #${n}\`, «Alcance restante» \`desconocido\` — ni bloque declarado ni comentario fresco que citar (residual de AP-054)`;
                await github.rest.issues.createComment({ owner, repo, issue_number: n,
                  body: `**claude-code · post-step**: la sesión del Creator terminó en \`${outcome}\` con el trabajo COMMITEADO en verde y SIN abrir el PR, pero con rama utilizable. La transición Creator→PR está DETERMINADA por el estado ⇒ el post-step la EJECUTA con el PAT — **NO** re-arma otra sesión ni declara \`stalled\` (repesca finplan#1404, AP-023):\n\n- ${branchInfo}\n- **PR #${prNum} abierto desde el estado** (${polarityNote}).\n- Abierto con el **PAT** ⇒ el \`opened\` dispara **CI** (\`ci-verde\`) y la **review** (rama de agente) como cualquier PR normal; por eso NO se aplica \`needs-review\` (doblaría la sesión Opus).\n- \`serial-activo\` retirada al nacer el PR (el PR abierto ES la señal de vuelo; la serie la libera el MERGE + arma la cola, como cualquier PR).\n\n<!-- creator-muerto-sin-pr-abierto-por-estado -->` });
                core.warning(`Creator de #${n}: muerte sin PR RESUELTA por estado — PR #${prNum} abierto (${declared ? declared.polarity + ' FIEL' : 'partial forzado'}) por PAT; CI+review por \`opened\`, sin needs-review, sin stalled ni re-arm.`);
                return;
              }
              // La apertura falló. Antes de caer al residual (stalled + pop),
              // distinguir «apertura imposible» de una CARRERA: un 422 «already
              // exists» significa que otro run abrió el PR entre el early-check
              // (L953) y este `pulls.create`. En ese caso la transición YA está
              // ejecutada ⇒ stallear/pop sobre un PR vivo sería espurio (rompe
              // la serialidad: comentario `creator-muerto-sin-pr` falso + arma
              // otro Creator desde cola). Re-consulta y, si hay PR, no-op.
              const { data: raced } = await github.rest.pulls.list({ owner, repo, state: 'open', per_page: 100 });
              if (raced.some(p => p.head.ref.startsWith(`claude/issue-${n}-`))) {
                core.notice(`AP-023: apertura desde estado falló pero YA existe PR para #${n} (carrera) — transición hecha por otro run; no se stallea.`);
                return;
              }
            }
            await github.rest.issues.createComment({ owner, repo, issue_number: n,
              body: `**claude-code · post-step**: la sesión del Creator terminó en \`${outcome}\` **sin PR abierto** y sin rama utilizable para abrirlo desde el estado (rama ausente, sin commits ahead, o apertura imposible). Estado materializado en el instante — sin esperar al tick del watchdog:\n\n- ${branchInfo}\n- \`serial-activo\` retirada y **turno pasado a la cola** (el arm de retoma de este issue no queda bloqueado).\n- \`stalled\` aplicada (señal de architect-resolve).\n\n**Para el rearm** (watchdog o humano): si hay rama con commits, NO rehacer — retomar solo el cierre (verificar rama, typecheck/tests de los ficheros afectados, abrir el PR según «PR creation» de CLAUDE.md).\n\n<!-- creator-muerto-sin-pr -->` });
            await github.rest.issues.addLabels({ owner, repo, issue_number: n, labels: ['stalled'] });
            await github.rest.issues.removeLabel({ owner, repo, issue_number: n, name: 'serial-activo' }).catch(() => {});
            // AP-014 (2026-07-15, deadlock central#44/#46/#47): TODO camino que
            // libera la serie hace pop de cola EN EL MISMO JOB. Este camino era
            // el único de los tres que no lo hacía: liberaba sin armar y la
            // cola quedaba muerta hasta un merge (armQueue de epic-merge) que
            // podía no llegar nunca.
            await popQueue(n, `muerte del Creator de #${n}`);
            core.warning(`Creator de #${n}: muerte sin PR materializada (stalled + serial-activo retirada + pop de cola).`);

      - name: Auto-label based on Creator's closing tag
        if: |
          success()
          && steps.check_pause.outputs.paused != 'true'
          && steps.check_iterations.outputs.cap_reached != 'true'
          && steps.check_chain.outputs.broken != 'true'
          && steps.check_panel.outputs.blocked != 'true'
          && steps.check_serial.outputs.blocked != 'true'
          && steps.check_flight.outputs.blocked != 'true'
          && (
            github.event_name == 'pull_request_review'
            || github.event_name == 'pull_request_review_comment'
            || (github.event_name == 'issue_comment'
                && github.event.issue.pull_request)
          )
        uses: actions/github-script@v7
        env:
          WAS_DRAFT: ${{ steps.pr_head_before.outputs.draft }}
          IN_REVIEWER_WF: ${{ inputs.reviewer_workflow_name }}
          RESCUE_WIP: ${{ steps.rescate.outputs.wip }}
        with:
          # IMPORTANTE: usar el PAT (REVIEWER_GITHUB_TOKEN), NO el GITHUB_TOKEN
          # default. Razón: este step aplica la label `needs-review` que DEBE
          # disparar el workflow del Reviewer (reviewer.yml `on: pull_request:
          # types: [labeled]`). Eventos generados por GITHUB_TOKEN default NO
          # disparan otros workflows (protección anti-loop de GitHub). Con el
          # PAT, el evento `labeled` sí se emite y el Reviewer dispara.
          # Doc: https://docs.github.com/en/actions/using-workflows/triggering-a-workflow
          github-token: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.issue?.number
              || context.payload.pull_request?.number;
            // AP-094 — dedupe de la doble convocatoria. Si el PR era DRAFT al
            // arrancar la sesión y ahora es ready, la sesión hizo `gh pr ready` y su
            // `ready_for_review` ya convocó al Reviewer (stub con el trigger nuevo):
            // un `needs-review` por PAT encima abriría una SEGUNDA sesión Opus en
            // serie (`cancel-in-progress: false`). Se cede SOLO si hay un run del
            // Reviewer para el head SHA nacido tras el disparador de esta sesión
            // (vivo o `success`) — un stub consumidor sin el trigger no tiene ese
            // run y la label se aplica como siempre. Lectura fallida ⇒ se aplica
            // (fail-open hacia la review, nunca hacia el silencio).
            const readyYaConvoca = async (num) => {
              if (process.env.WAS_DRAFT !== 'true') return false;
              try {
                const { data: cur } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: num });
                if (cur.draft) return false;
                const since = new Date(context.payload.comment?.created_at || context.payload.review?.submitted_at || 0).getTime();
                const { data: rr } = await github.rest.actions.listWorkflowRunsForRepo({ owner: context.repo.owner, repo: context.repo.repo, head_sha: cur.head.sha, per_page: 50 });
                const wf = process.env.IN_REVIEWER_WF || 'Opus Reviewer';
                return rr.workflow_runs.some(r => r.name === wf && new Date(r.created_at).getTime() >= since
                  && (r.status === 'queued' || r.status === 'in_progress' || (r.status === 'completed' && r.conclusion === 'success')));
              } catch (e) {
                core.warning(`AP-094 dedupe ready_for_review: lectura fallida (${e.message}) — se aplica needs-review.`);
                return false;
              }
            };

            // Releer comentarios (el agente acaba de añadir el suyo).
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const botComments = comments.filter(
              c => c.user.login === 'claude[bot]'
            );
            if (botComments.length === 0) return;

            const last = botComments[botComments.length - 1];

            // FRESHNESS CHECK (PR #180 fix, ADR-064 amendment).
            // El último comment de claude[bot] solo es señal válida de "el
            // Creator acaba de cerrar trabajo en este run" si fue creado
            // DESPUÉS del comment/review que disparó este job. Si es
            // anterior, este job se disparó por un trigger espurio
            // (típicamente: substring `@claude` en backticks dentro del
            // body del Reviewer documentando convergencia) y NO debemos
            // re-aplicar label porque desencadena un loop con el Reviewer.
            const triggerCreatedAtRaw =
              context.payload.comment?.created_at
              || context.payload.review?.submitted_at
              || null;
            if (triggerCreatedAtRaw) {
              const triggerCreatedAt = new Date(triggerCreatedAtRaw);
              const lastBotCreatedAt = new Date(last.created_at);
              if (lastBotCreatedAt <= triggerCreatedAt) {
                core.notice(
                  `Último comment de claude[bot] (${last.created_at}) es `
                  + `anterior o igual al comment que disparó este job `
                  + `(${triggerCreatedAtRaw}). Probablemente trigger espurio `
                  + `(p.ej. substring \`@claude\` en backticks dentro de un `
                  + `comment del Reviewer). NO re-aplico label para evitar `
                  + `loop. Ver ADR-064 amendment.`
                );
                return;
              }
            }

            const body = last.body || '';

            // Detectar tag exacto. Prioridad: NEEDS-HUMAN > READY-TO-MERGE > @reviewer.
            // (Si por error el agente pone varios, escalar gana.)
            // ANCLADO a inicio de línea (2026-07-08, PR #1133): el substring
            // crudo disparó human-needed por una MENCIÓN del tag entre
            // backticks en prosa del Creator («gatillo `[NEEDS-HUMAN]` en
            // CLAUDE.md»), congelando el PR con CI rojo fuera del radar del
            // watchdog. Mismo bug ya corregido para `@claude` (ADR-064) y
            // documentado para `ping-creator` (watchdog.md): un tag de cierre
            // es un tag solo si ABRE su línea. CLAUDE.md permite
            // `[NEEDS-HUMAN]: <razón>` con texto detrás, así que el ancla es
            // de inicio de línea, no de línea completa. Failure class #4:
            // text belts forbidden — esto acerca los tags a marcadores.
            let label = null;
            if (/^\s*\[NEEDS-HUMAN\]/m.test(body)) {
              label = 'human-needed';
            } else if (/^\s*\[READY-TO-MERGE\]/m.test(body)) {
              label = 'ready-to-merge';
            } else if (/^\s*@reviewer\b/im.test(body)) {
              label = 'needs-review';
            }

            // AP-101 (central#300): el step `rescate` pusheó un WIP del árbol que la
            // sesión dejó sin pushear y ya materializó el turno del Creator
            // (`stalled` + `estado:esperando-architect`). Ni el turn-close-failsafe
            // (vería commits posteriores al veredicto) ni un `@reviewer`/
            // `[READY-TO-MERGE]` del cierre mandan ese WIP al Reviewer. Solo
            // `[NEEDS-HUMAN]` sigue mandando. Señal: el output del step o, por
            // estado, el marcador en la ventana fresca.
            const rescFresh = (triggerCreatedAtRaw
              ? comments.filter(c => new Date(c.created_at) > new Date(triggerCreatedAtRaw))
              : comments).some(c => /<!--\s*arbol-rescatado-por-estado\s*-->/.test(c.body || ''));
            if ((process.env.RESCUE_WIP === 'true' || rescFresh) && label !== 'human-needed') {
              core.notice(`PR #${prNumber}: árbol rescatado por estado (arbol-rescatado-por-estado) — turno del Creator; Auto-label y turn-close-failsafe ceden.`);
              return;
            }

            if (!label) {
              // Cede a la escalada CON PR (creator-escalated, AP-017): si el
              // cierre lleva `<!-- creator-escalated -->`, el turno es del
              // Architect, NO del Reviewer. El Creator pudo pushear trabajo
              // parcial y LUEGO escalar; sin este guard el turn-close-failsafe
              // de abajo re-aplicaría `needs-review` (convoca al Reviewer por
              // evento) mientras el post-step creator-escalated aplica `stalled`
              // + `estado:esperando-architect` — el PR quedaría con DOS dueños a
              // la vez. La transición la materializa el post-step creator-escalated
              // (gemelo con-PR del Re-review-por-estado, que también cede). ANCLADO
              // como HTML (clase PR #1133), jamás substring de prosa. AP-028 capa 2
              // (repesca finplan#1467): el marcador viaja en un comentario SEPARADO
              // vía `gh api` (canal que conserva HTML), no en el tracking comment
              // (`last`, lossy) — grepea en TODOS los comentarios frescos de
              // claude[bot] (posteriores al trigger), no solo en el último. Los
              // tags de loop (@reviewer/[…]) sí son prosa del tracking comment y se
              // detectan arriba sobre `body`; solo la CESIÓN por marcador se abre
              // al canal separado.
              const escFresh = triggerCreatedAtRaw
                ? botComments.filter(c => new Date(c.created_at) > new Date(triggerCreatedAtRaw))
                : botComments;
              if (escFresh.some(c => /<!--\s*creator-escalated\s*-->/.test(c.body || '') || /^\[CREATOR-ESCALATED\]/m.test(c.body || ''))) {
                core.notice('Cierre del Creator es una escalada al Architect (creator-escalated) — turn-close-failsafe cede; lo materializa su post-step.');
                return;
              }
              // turn-close-failsafe (finplan#1322, 2026-07-13 — capa 1 de
              // AP-011 para la transición Creator→Reviewer). Incidente
              // finplan PR #1319: el Creator aplicó los nits, pusheó,
              // terminó `success`... sin tag de cierre. 84 min de stall
              // hasta el dispatcher (capa 2/3, latencia de cron + cap 2).
              // El estado «el Creator respondió al veredicto» ya está
              // MATERIALIZADO (push al HEAD posterior al veredicto que
              // disparó esta sesión) — este fail-safe lo consume en el
              // MISMO job, latencia cero, en vez de colgar la transición
              // de una cadena mágica en prosa. Condiciones:
              //  (a) sesión `success` — la garantiza el `if:` del step
              //      (las muertes por error son territorio del Watchdog:
              //      trabajo potencialmente incompleto);
              //  (b) el trigger fue un turno de PR-loop real: comentario
              //      con marcador `ping-creator` (veredicto del Reviewer
              //      o ping del Watchdog) — excluye comentarios humanos
              //      arbitrarios;
              //  (c) hay commits en el HEAD del PR posteriores al trigger;
              //  (d) sin tag de cierre anclado (esta rama).
              // NO es un re-trigger por push: evalúa UNA vez, al cierre de
              // la sesión. La label la aplica el PAT (mismo mecanismo que
              // la rama @reviewer): el guard anti-loop del Reviewer sobre
              // `labeled` de claude[bot] no se toca.
              const triggerBody = context.payload.comment?.body
                || context.payload.review?.body || '';
              if (triggerBody.includes('ping-creator') && triggerCreatedAtRaw) {
                const { data: pr } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                });
                const { data: headCommit } = await github.rest.repos.getCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: pr.head.sha,
                });
                const headDate = new Date(headCommit.commit.committer.date);
                if (headDate > new Date(triggerCreatedAtRaw)) {
                  try {
                    await github.rest.issues.removeLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: prNumber,
                      name: 'needs-review',
                    });
                  } catch (e) { /* puede no estar */ }
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                    labels: ['needs-review'],
                  });
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                    body: '**claude-code · turn-close-failsafe**: la sesión del Creator terminó con éxito, con commits en el HEAD posteriores al veredicto que la convocó, pero SIN tag de cierre anclado. Transición Creator→Reviewer materializada por estado (push), no por prosa: `needs-review` re-aplicada en el mismo job (finplan#1322, capa 1 de AP-011).\n\n<!-- turn-close-failsafe -->',
                  });
                  core.warning(
                    `PR #${prNumber}: cierre sin tag con push post-veredicto — `
                    + 'needs-review aplicada por turn-close-failsafe.'
                  );
                  return;
                }
                // ── Rama ELSE del turn-close-failsafe (repesca finplan#1598,
                // AP-046): gemelo con-PR de `escalada-materializada` (AP-036).
                // Llegamos aquí con el terminal NO-declarado del loop de PR
                // completamente acotado por ESTADO: sesión convocada por
                // `ping-creator` (veredicto vigente), `success`, HEAD SIN
                // commits posteriores al veredicto (este else del push — el
                // turn-close-failsafe de arriba ganó si los hubiera), SIN tag
                // de cierre anclado (estamos en `!label`) y SIN token de
                // escalada por ninguno de los dos canales (la cesión
                // `creator-escalated` de arriba ya retornó si lo hubiera). Ese
                // estado —success + cero push + cero tokens sobre un PR con
                // veredicto vigente— es HOY un «turno-de-nadie» que el
                // dispatcher del Watchdog acaba declarando zombi por cron (~20
                // min + slot del cap). Esta rama lo MATERIALIZA en el instante
                // como escalada por ESTADO (misma semántica AP-036): estado
                // visible primero + `stalled` con el PAT del step ⇒
                // architect-resolve POR EVENTO, que lee la prosa del cierre y
                // rula (escalada ⇒ resuelve/re-arma; sesión degenerada ⇒
                // humano por DOBLE REBOTE, jamás de primera línea — ninguna vía
                // nueva a humano). Estricto else-case: no solapa con
                // turn-close-failsafe (ganó el push) ni con los post-steps
                // AP-035/AP-028 (ganó el token) ni con el Auto-label (ganó el
                // tag). Idempotencia: dedupe por el marcador (publicado por PAT
                // ⇒ NO lo firma claude[bot]) sobre TODOS los comentarios
                // frescos, y huella del head SHA en el diagnóstico.
                const escMatFresh = comments.filter(
                  c => new Date(c.created_at) > new Date(triggerCreatedAtRaw));
                if (escMatFresh.some(
                  c => /<!--\s*escalada-materializada-con-pr\s*-->/.test(c.body || ''))) {
                  core.notice('escalada-materializada-con-pr: ya materializada '
                    + '(rastro presente) — no duplico.');
                  return;
                }
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  labels: ['estado:esperando-architect'],
                });
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  labels: ['stalled'],
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: '**claude-code · escalada-materializada-con-pr**: la '
                    + 'sesión del Creator (convocada por `ping-creator`, '
                    + 'veredicto vigente) terminó `success` SIN commits '
                    + 'posteriores al veredicto, SIN tag de cierre anclado y SIN '
                    + 'token de escalada por ninguno de los dos canales '
                    + '(`[CREATOR-ESCALATED]`/`<!-- creator-escalated -->`) — un '
                    + 'terminal NO-declarado dentro del loop de PR. Gemelo '
                    + 'con-PR de `escalada-materializada` (AP-046, repesca '
                    + 'finplan#1598): estado materializado por PAT en el mismo '
                    + 'job (doctrina estado-primario, protocol.md §1), sin '
                    + 'esperar a que el dispatcher lo declare `turno-de-nadie` '
                    + 'por cron. `estado:esperando-architect` (el dispatcher '
                    + 'cede) + `stalled` ⇒ architect-resolve POR EVENTO, que lee '
                    + 'la prosa del cierre y rula (misma semántica AP-036: '
                    + 'escalada ⇒ resuelve/re-arma; sesión degenerada ⇒ humano '
                    + 'por doble rebote). HEAD `' + pr.head.sha.slice(0, 7) + '`.'
                    + '\n\n<!-- escalada-materializada-con-pr -->',
                });
                core.warning(
                  `PR #${prNumber}: terminal no-declarado en loop de PR `
                  + `(success, sin push post-veredicto, sin token de escalada) `
                  + `materializado por estado — stalled + estado:esperando-architect `
                  + `(escalada-materializada-con-pr, AP-046).`
                );
                return;
              }
              core.notice(
                'El último comentario del Creator no contiene tag de cierre '
                + '([READY-TO-MERGE], [NEEDS-HUMAN], o @reviewer). '
                + 'Sin label automática aplicada.'
              );
              return;
            }

            // Para `needs-review`: quitar y re-añadir para forzar disparo
            // del Reviewer. El Reviewer se autoborra como primer paso
            // (ADR-063 self-remove pattern), así que en estado normal la
            // label NO está aquí. El remove defensivo cubre fallos
            // parciales donde el Reviewer no llegó a autoborrarse.
            if (label === 'needs-review' && await readyYaConvoca(prNumber)) {
              core.notice(`AP-094: PR #${prNumber} pasó de draft a ready en esta sesión y su ready_for_review ya convocó al Reviewer — needs-review no se duplica.`);
              return;
            }
            if (label === 'needs-review') {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  name: 'needs-review',
                });
              } catch (e) {
                // La label puede no estar; no es error.
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels: [label],
            });
            core.notice(`Label aplicada: ${label}`);

      - name: Materializar escalada del Creator con PR abierto (creator-escalated)
        # Repesca finplan#1391 (AP-017, 2026-07-15): el Creator escaló al
        # Architect el 🔴(b) del gate A3′ (ADR-210, «PARAR y escalar» del propio
        # ADR) EN PROSA (comentario del PR), pero NINGÚN estado de despacho se
        # materializó: el PR quedó `estado:esperando-creator`, el dispatcher de
        # turno (ADR-217) lo declaró `turno-de-nadie`, y architect-resolve solo
        # llegó vía el caza-anomalías del watchdog ~22 min después — una escalada
        # CORRECTA degradada a anomalía, rescatada por FALLBACK en vez de por
        # HANDOFF (violación del principio 1 de protocol.md: estado materializado,
        # no inferido). Complemento EXACTO de creator-blocked (finplan#1350), que
        # gobierna el paro limpio PRE-código SIN PR y se excluye «jamás con PR
        # abierto»: este belt cubre la escalada derivable-por-Architect DESDE
        # DENTRO del loop de PR (gate numérico de ADR tipo A3′, ambigüedad de
        # diseño). NUNCA una decisión humana (eso sigue siendo [NEEDS-HUMAN]).
        # Materializa por ESTADO en el instante: `stalled` con el PAT (⇒
        # architect-resolve POR EVENTO — watchdog `pull_request labeled stalled`,
        # sin esperar al cron) + `estado:esperando-architect` visible (el
        # dispatcher de turno cede sobre él en vez de declarar turno-de-nadie;
        # architect-resolve lo limpia al rular/re-armar). Detección ANCLADA como
        # HTML, jamás substring de prosa (clase PR #1133). Freshness-checked vs el
        # comentario disparador (lección #180): solo cuenta el cierre del Creator
        # POSTERIOR al trigger — un `@claude` en backticks en prosa del Reviewer
        # no debe materializar nada. Self-contained (mismo patrón que los demás
        # post-steps: open-review-failsafe, creator-muerto) para no destabilizar
        # el path crítico Creator→Reviewer del Auto-label.
        if: |
          success()
          && steps.check_pause.outputs.paused != 'true'
          && steps.check_iterations.outputs.cap_reached != 'true'
          && steps.check_chain.outputs.broken != 'true'
          && steps.check_panel.outputs.blocked != 'true'
          && steps.check_serial.outputs.blocked != 'true'
          && steps.check_flight.outputs.blocked != 'true'
          && (
            github.event_name == 'pull_request_review'
            || github.event_name == 'pull_request_review_comment'
            || (github.event_name == 'issue_comment'
                && github.event.issue.pull_request)
          )
        uses: actions/github-script@v7
        with:
          # PAT (REVIEWER_GITHUB_TOKEN), NO el GITHUB_TOKEN default: la label
          # `stalled` que aplica este step ES el trigger por EVENTO de
          # architect-resolve (watchdog `on: labeled`, rama stalled-autonomous-
          # resolve del scan). Con el token default el `labeled` no se emite
          # (anti-loop de GitHub) y la señal degradaría al cron — justo la latencia
          # que este belt elimina. Mismo actor/mecanismo que el creator-blocked.
          github-token: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.issue?.number
              || context.payload.pull_request?.number;
            if (!prNumber) return;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber, per_page: 100 });
            const botComments = comments.filter(c => c.user?.login === 'claude[bot]');
            if (botComments.length === 0) return;
            // FRESHNESS CHECK (lección #180): solo cuenta el cierre del Creator
            // POSTERIOR al comment/review que disparó este job. Si no hay ninguno
            // posterior, trigger espurio (típ. substring `@claude` en backticks en
            // prosa del Reviewer) ⇒ no materializar.
            const trigRaw = context.payload.comment?.created_at
              || context.payload.review?.submitted_at || null;
            const freshBots = trigRaw
              ? botComments.filter(c => new Date(c.created_at) > new Date(trigRaw))
              : botComments;
            if (freshBots.length === 0) {
              core.notice('creator-escalated: sin comentarios de claude[bot] posteriores '
                + 'al trigger — probable trigger espurio, no materializo.');
              return;
            }
            // Idempotencia (AP-028 capa 2): si el rastro `-materializado` ya está
            // (post-step previo o cinturón del Watchdog), no dupliques. El rastro
            // se publica con el PAT ⇒ NO lo firma claude[bot]: se busca sobre
            // TODOS los comentarios frescos, no solo los de claude[bot].
            const freshAll = trigRaw
              ? comments.filter(c => new Date(c.created_at) > new Date(trigRaw))
              : comments;
            if (freshAll.some(c => /<!--\s*creator-escalated-materializado\s*-->/.test(c.body || ''))) {
              core.notice('creator-escalated: ya materializado (rastro presente) — no duplico.');
              return;
            }
            // AP-028 capa 2 (repesca finplan#1467): el marcador viaja en un
            // comentario SEPARADO vía `gh api` (canal que conserva HTML), NO en el
            // tracking comment (lossy — AP-013) y rara vez es el más reciente.
            // Grepea en TODOS los comentarios frescos, no solo el último. Detección
            // ANCLADA como HTML (clase PR #1133): jamás substring de prosa.
            // AP-035: token de texto anclado en OR con el HTML separado (belt).
            if (!freshBots.some(c => /<!--\s*creator-escalated\s*-->/.test(c.body || '') || /^\[CREATOR-ESCALATED\]/m.test(c.body || ''))) return;
            // Materializa por ESTADO. Estado visible PRIMERO, `stalled` DESPUÉS:
            // así el `labeled=stalled` (con PAT) convoca a architect-resolve con
            // el `estado:esperando-architect` ya presente. `estado:*` es dinámica
            // (addLabels la auto-crea, como el resto de estados de cadena).
            await github.rest.issues.addLabels({ owner, repo, issue_number: prNumber,
              labels: ['estado:esperando-architect'] });
            await github.rest.issues.addLabels({ owner, repo, issue_number: prNumber,
              labels: ['stalled'] });
            await github.rest.issues.createComment({ owner, repo, issue_number: prNumber,
              body: '**claude-code · creator-escalated**: el Creator escaló al Architect '
                + 'una decisión derivable desde dentro del loop de PR (gate numérico de '
                + 'ADR / ambigüedad de diseño; jamás una decisión humana). Estado '
                + 'materializado por PAT en el mismo job (doctrina estado-primario, '
                + 'protocol.md §1): `stalled` ⇒ architect-resolve por evento (sin esperar '
                + 'al cron) + `estado:esperando-architect` ⇒ el dispatcher de turno del '
                + 'watchdog cede en vez de declarar `turno-de-nadie`. architect-resolve '
                + 'publica su ruling y limpia el estado al re-armar (repesca finplan#1391, '
                + 'AP-017).\n\n<!-- creator-escalated-materializado -->' });
            core.warning(`PR #${prNumber}: escalada del Creator materializada por estado `
              + `— stalled + estado:esperando-architect (creator-escalated).`);

      # ───────────────────────────────────────────────────────────────────
      # Auto-lanzamiento de épica (ADR-193). Espejo del step `Auto-label`:
      # usa el PAT (REVIEWER_GITHUB_TOKEN) porque eventos del GITHUB_TOKEN
      # default NO disparan otros workflows (anti-recursión de GitHub). El
      # Creator cierra con `<!-- launch-next: #N -->` (o `<!-- epic-done -->`);
      # este step postea `@claude` en el issue N, y ESE evento (al venir del
      # PAT) arranca la siguiente corrida del Creator.
      #
      # ADR-193 opción A (elegida): el LGTM del Reviewer sobre un PR con
      # label `epica` despierta al Creator, que verifica CI y mergea él mismo
      # (gh pr merge en allowedTools) y emite el sentinel launch-next. Este step
      # solo postea el @claude del siguiente issue desde ese sentinel.
      # ───────────────────────────────────────────────────────────────────
      - name: Re-review por estado de rama (post-step determinista)
        # finplan#1319 (2026-07-13): el Creator aplicó nits y omitió el
        # `@reviewer` de cierre — el Auto-label (gateado por prosa) no
        # re-etiquetó y la cadena quedó muda hasta el fallback del watchdog.
        # Regla materializada (AP-008): rama cambiada durante una sesión de
        # PR ⇒ hay trabajo sin veredicto ⇒ re-review, leído del ESTADO
        # (push), no de la prosa. Si el Auto-label ya actuó (el Creator SÍ
        # cerró bien), needs-review ya está y este step no duplica. Sesión
        # sin push (respondió una pregunta) ⇒ no quema al Reviewer. El
        # watchdog queda como red de segunda línea, no como camino primario.
        if: |
          success() && steps.pr_head_before.outputs.sha != ''
          && github.event_name == 'issue_comment' && github.event.issue.pull_request
        uses: actions/github-script@v7
        env:
          WAS_DRAFT: ${{ steps.pr_head_before.outputs.draft }}
          IN_REVIEWER_WF: ${{ inputs.reviewer_workflow_name }}
        with:
          # PAT: mismo motivo que el Auto-label — labeled de GITHUB_TOKEN no
          # dispara reviewer.yml (anti-loop de GitHub).
          github-token: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const n = context.payload.issue.number;
            const before = '${{ steps.pr_head_before.outputs.sha }}';
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: n });
            if (pr.state !== 'open') { core.notice('PR no abierto — nada.'); return; }
            if (!pr.head.ref.startsWith('claude/')) { core.notice('rama no-agente — nada.'); return; }
            if (pr.head.sha === before) { core.notice('sin push en la sesión — no se re-dispara review.'); return; }
            const labels = pr.labels.map(l => l.name);
            // Cede a la escalada: si el Creator pusheó trabajo parcial y LUEGO
            // escaló (creator-escalated ya materializó `estado:esperando-architect`
            // en el step anterior), el turno es del Architect, no del Reviewer —
            // re-etiquetar needs-review aquí competiría con `stalled` y mandaría el
            // PR a dos dueños a la vez (AP-017).
            if (labels.includes('estado:esperando-architect')) { core.notice('PR escalado a architect-resolve (creator-escalated) — no re-review por estado.'); return; }
            if (labels.includes('needs-review')) { core.notice('needs-review ya presente (Auto-label actuó) — sin duplicar.'); return; }
            // AP-094 — dedupe de la doble convocatoria. Si el PR era DRAFT al
            // arrancar la sesión y ahora es ready, la sesión hizo `gh pr ready` y su
            // `ready_for_review` ya convocó al Reviewer (stub con el trigger nuevo):
            // un `needs-review` por PAT encima abriría una SEGUNDA sesión Opus en
            // serie (`cancel-in-progress: false`). Se cede SOLO si hay un run del
            // Reviewer para el head SHA nacido tras el disparador de esta sesión
            // (vivo o `success`) — un stub consumidor sin el trigger no tiene ese
            // run y la label se aplica como siempre. Lectura fallida ⇒ se aplica
            // (fail-open hacia la review, nunca hacia el silencio).
            const readyYaConvoca = async (num) => {
              if (process.env.WAS_DRAFT !== 'true') return false;
              try {
                const { data: cur } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: num });
                if (cur.draft) return false;
                const since = new Date(context.payload.comment?.created_at || context.payload.review?.submitted_at || 0).getTime();
                const { data: rr } = await github.rest.actions.listWorkflowRunsForRepo({ owner: context.repo.owner, repo: context.repo.repo, head_sha: cur.head.sha, per_page: 50 });
                const wf = process.env.IN_REVIEWER_WF || 'Opus Reviewer';
                return rr.workflow_runs.some(r => r.name === wf && new Date(r.created_at).getTime() >= since
                  && (r.status === 'queued' || r.status === 'in_progress' || (r.status === 'completed' && r.conclusion === 'success')));
              } catch (e) {
                core.warning(`AP-094 dedupe ready_for_review: lectura fallida (${e.message}) — se aplica needs-review.`);
                return false;
              }
            };
            if (await readyYaConvoca(n)) { core.notice(`AP-094: PR #${n} pasó de draft a ready en esta sesión y su ready_for_review ya convocó al Reviewer — sin re-review por estado.`); return; }
            // remove+add para forzar el evento labeled aunque hubiera restos
            await github.rest.issues.removeLabel({ owner, repo, issue_number: n, name: 'needs-review' }).catch(() => {});
            await github.rest.issues.addLabels({ owner, repo, issue_number: n, labels: ['needs-review'] });
            core.notice(`re-review por estado: push detectado (${before.slice(0,7)} → ${pr.head.sha.slice(0,7)}) — needs-review aplicada.`);

      - name: Launch next epic issue (Creator's closing sentinel)
        id: launch_next
        if: |
          success()
          && steps.check_pause.outputs.paused != 'true'
          && steps.check_iterations.outputs.cap_reached != 'true'
          && steps.check_chain.outputs.broken != 'true'
          && steps.check_panel.outputs.blocked != 'true'
          && steps.check_serial.outputs.blocked != 'true'
          && steps.check_flight.outputs.blocked != 'true'
        uses: actions/github-script@v7
        with:
          # PAT, NO GITHUB_TOKEN: el @claude posteado debe disparar la
          # siguiente corrida del Creator (ver step Auto-label para el motivo).
          github-token: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.issue?.number
              || context.payload.pull_request?.number;
            if (!prNumber) return;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const botComments = comments.filter(c => c.user.login === 'claude[bot]');
            if (botComments.length === 0) return;
            const last = botComments[botComments.length - 1];

            // FRESHNESS (igual que Auto-label): solo actuar si el cierre del
            // Creator es POSTERIOR al evento que disparó este job.
            const triggerAt = context.payload.comment?.created_at
              || context.payload.review?.submitted_at || null;
            if (triggerAt && new Date(last.created_at) <= new Date(triggerAt)) {
              core.notice('Cierre del Creator no es fresco; no lanzo.');
              return;
            }

            const body = last.body || '';

            // epic-done ⇒ fin de la épica, no se lanza nada (el humano prueba).
            if (/<!--\s*epic-done\s*-->/.test(body)) {
              core.notice('Épica terminada; no hay siguiente issue.');
              return;
            }

            const m = body.match(/<!--\s*launch-next:\s*#?(\d+)\s*-->/);
            if (!m) return;
            const nextIssue = Number(m[1]);

            // central#313: cesión entre eslabones a una `prioridad:urgente`
            // (espejo de `cederAUrgente` de epic-merge). #N queda `en-cola` +
            // `eslabon-suspendido` y NO se arma; `armed` queda sin escribir, de
            // modo que el barrido de cola del cierre de este job (step
            // siguiente, fail-closed) arma la cabeza —la urgente— si la serie
            // está libre. Sin urgente o sin módulo: idéntico a antes.
            // central#313: orden de la cola por prioridad (`cola-prioridad.cjs`,
            // checkout sparse `.cola-central`; respaldo: la copia injertada en
            // `scripts/`). Sin módulo, FIFO (statu quo) — degradación, nunca peor.
            let COLA = null;
            for (const p of [`${process.env.GITHUB_WORKSPACE}/.cola-central/vendored/scripts/cola-prioridad.cjs`, `${process.env.GITHUB_WORKSPACE}/scripts/cola-prioridad.cjs`]) {
              try { COLA = require(p); break; } catch (e) { /* siguiente ubicación */ }
            }
            if (!COLA) core.warning('cola-prioridad no disponible — la cola sale FIFO (statu quo).');
            // central#314 (ruling, punto 3): en pausa, #N NO se lanza — queda
            // `en-cola` retenido (nivel 2, `COLA.retenerEslabon`, idempotente
            // con el otro consumidor del mismo `launch-next`). Sin `armed`: el
            // barrido del cierre lee la pausa y tampoco arma. Si la retención
            // falla con la pausa leída, tampoco se lanza (la pausa manda).
            if (COLA && COLA.leerPausa) {
              const pausa = await COLA.leerPausa({ github, owner: context.repo.owner, repo: context.repo.repo, warn: (m) => core.warning(m) });
              if (pausa.pausado) {
                try {
                  await COLA.retenerEslabon({ github, owner: context.repo.owner, repo: context.repo.repo,
                    siguiente: nextIssue, origen: `sentinel de cierre del Creator en #${prNumber}`, origenNum: prNumber, pausa });
                  core.notice(`Épica: #${nextIssue} RETENIDO en cola por pausa-cola (${COLA.describirPausa(pausa)}); sale por la cola al retirarla.`);
                } catch (e) { core.warning(`Épica: repo en pausa (${COLA.describirPausa(pausa)}) pero la retención de #${nextIssue} falló (${e.message}); NO se lanza.`); }
                return;
              }
            }
            if (COLA) {
              try {
                const urgente = await COLA.cederEslabon({ github, owner: context.repo.owner, repo: context.repo.repo,
                  siguiente: nextIssue, origen: `sentinel de cierre del Creator en #${prNumber}`, origenNum: prNumber });
                if (urgente) {
                  core.notice(`Épica: #${nextIssue} SUSPENDIDO (cesión a la prioridad:urgente #${urgente}); la cola lo arma después.`);
                  return;
                }
              } catch (e) { core.warning(`cesión a urgente falló (${e.message}) — #${nextIssue} se lanza por su cadena, como siempre.`); }
              // Review #315 (🟡 1): espejo de `postMerge`. Si epic-merge ya
              // suspendió #N y armó la urgente, la cesión de arriba no la ve:
              // #N NO se lanza (sale por la cola, `arm-de-cola`).
              try {
                if (await COLA.yaSuspendido({ github, owner: context.repo.owner, repo: context.repo.repo, siguiente: nextIssue })) {
                  core.notice(`Épica: launch-next #${nextIssue} consumido por suspensión previa (eslabón cedido a una prioridad:urgente); la cola lo arma después.`);
                  return;
                }
              } catch (e) { core.warning(`lectura de suspensión de #${nextIssue} falló (${e.message}) — se lanza por su cadena, como siempre.`); }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: nextIssue,
              body: '@claude',
            });
            // AP-062: el sucesor de cadena ocupa la serie ⇒ apaga el barrido
            // de cola del cierre del job (espejo del `armed` de popQueue).
            core.setOutput('armed', 'true');
            core.notice(`Épica: lanzado el siguiente issue #${nextIssue}.`);

      # ── Barrido de cola al CIERRE del job (AP-062, repesca finplan#1702) ──
      # ESPEJO del `sweepQueueAtExit` de `epic-merge.yml` (protocol.md, fila
      # `arm-de-cola`: «si tocas uno, toca el otro»). La cola serial se
      # materializa en una label MUTABLE (`en-cola`) que ESCRIBE el guard
      # serial de este mismo workflow y LEEN dos consumidores distintos
      # (`popQueue` aquí, `armQueue` en epic-merge): una lectura ÚNICA puede
      # caer dentro de la ventana de escritura del guard y no ver un encolado
      # que ya existe. Medido en el central de finplan: 74 min de serie LIBRE
      # con cola NO vacía, rescatados por el cron del watchdog en vez de por
      # el pop primario (transición de segundos degradada a tick de cron).
      #
      # Por qué un STEP y no un `finally` dentro del script de popQueue: el
      # barrido tiene que cubrir TODAS las salidas del job, no sólo las de un
      # step — incluidos los terminales que arman desde otros steps y los
      # cierres en los que `popQueue` ni siquiera corre (su `if` excluye
      # auditorías y contextos de PR). Como step `always()` al final, es la
      # SEGUNDA lectura del job tras todas sus escrituras, para todo camino.
      #
      # FAIL-CLOSED por diseño — sólo arma con identificación POSITIVA de
      # serie libre: (a) ningún step de este job armó ya (`armed`), (b) cero
      # PRs `claude/*` abiertos, (c) cero `serial-activo`, (d) ningún
      # comentario de arm RECIENTE de otro emisor. Con cualquier titular, o si
      # la API falla, no-op: el detector `cola-huerfana` del watchdog conserva
      # su cinturón. `pause-agents` lo apaga como al resto.
      #
      # Señal (d), AP-062 nit 1 — la traza (a) es INTRA-job: un arm posteado
      # por OTRO emisor segundos antes (barrido de otro job, `watchdog-rearm`,
      # sucesor de cadena, arm manual) es invisible para (b) y (c) durante la
      # VENTANA DE NACIMIENTO de su run: el comentario existe, pero el run aún
      # no corre y `serial-activo` no está escrito. Sin (d), dos barridos
      # concurrentes pueden armar DOS issues distintos — clase finplan#1298/
      # #1299, que el árbitro determinista del guard NO absorbe (arbitra dos
      # arranques del MISMO issue). Se lee el único hecho materializado que
      # existe en esa ventana: el comentario de arm.
      - name: Barrido de cola al cierre del job (segunda lectura, AP-062)
        if: |
          always()
          && steps.preflight.outputs.dead != 'true'
          && steps.check_pause.outputs.paused != 'true'
          && steps.post_muerte_sin_pr.outputs.armed != 'true'
          && steps.launch_next.outputs.armed != 'true'
          && steps.check_flight.outputs.blocked != 'true'
        uses: actions/github-script@v7
        with:
          # PAT, NO GITHUB_TOKEN: el `@claude` posteado debe disparar la
          # corrida del Creator desencolado — con el token default el evento
          # no se emite (anti-loop de GitHub) y el arm sería inerte.
          github-token: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            // central#313: orden de la cola por prioridad (`cola-prioridad.cjs`,
            // checkout sparse `.cola-central`; respaldo: la copia injertada en
            // `scripts/`). Sin módulo, FIFO (statu quo) — degradación, nunca peor.
            let COLA = null;
            for (const p of [`${process.env.GITHUB_WORKSPACE}/.cola-central/vendored/scripts/cola-prioridad.cjs`, `${process.env.GITHUB_WORKSPACE}/scripts/cola-prioridad.cjs`]) {
              try { COLA = require(p); break; } catch (e) { /* siguiente ubicación */ }
            }
            if (!COLA) core.warning('cola-prioridad no disponible — la cola sale FIFO (statu quo).');
            try {
              const { data: queued } = await github.rest.issues.listForRepo({
                owner, repo, state: 'open', labels: 'en-cola', sort: 'created', direction: 'asc', per_page: 100 });
              if (!queued.some(i => !i.pull_request)) return;
              // central#314 (ruling, punto 2): en pausa, el barrido no arma
              // (espejo de `sweepQueueAtExit`); tras el filtro de existencia.
              const pausa = (COLA && COLA.leerPausa) ? await COLA.leerPausa({ github, owner, repo, warn: (m) => core.warning(m) }) : null;
              if (pausa && pausa.pausado) {
                core.info(`barrido de cola: cola NO vacía pero RETENIDA por pausa-cola (${COLA.describirPausa(pausa)}); no armo.`);
                return;
              }
              // central#313: la cabeza por prioridad (espejo de popQueue/armQueue).
              const next = (COLA
                ? await COLA.ordenarConSuspension({ github, owner, repo, items: queued, warn: (m) => core.warning(m) })
                : queued.filter(i => !i.pull_request))[0];
              if (!next) return;
              const { data: prs } = await github.rest.pulls.list({ owner, repo, state: 'open', per_page: 100 });
              const held = prs.filter(p => p.head.ref.startsWith('claude/')).map(p => `#${p.number}`);
              if (held.length) {
                core.info(`barrido de cola: serie OCUPADA por ${held.join(', ')}; la espera de #${next.number} es legítima.`);
                return;
              }
              const { data: flagged } = await github.rest.issues.listForRepo({
                owner, repo, state: 'open', labels: 'serial-activo', per_page: 20 });
              if (flagged.length) {
                core.info(`barrido de cola: serie OCUPADA por serial-activo en ${flagged.map(i => `#${i.number}`).join(', ')}; la espera de #${next.number} es legítima.`);
                return;
              }
              // (d) arm reciente de OTRO emisor. Ventana de 5 min: cubre
              // nacimiento de run + escritura de `serial-activo` con holgura,
              // y su coste máximo es diferir el barrido un ciclo. Sólo
              // comentarios de ISSUE — en un PR el arm es turno de Creator
              // sobre una unidad ya en vuelo, que además caza la señal (b).
              const ARM_MARKERS = ['arm-de-cola', 'epic-auto-launch', 'epic-partial-relaunch', 'watchdog-rearm'];
              const corte = Date.now() - 5 * 60000;
              // `since` de este endpoint filtra por ÚLTIMA ACTUALIZACIÓN, no
              // por creación: se re-filtra por `created_at` para que la
              // EDICIÓN de un arm viejo no mute la señal.
              const { data: recientes } = await github.rest.issues.listCommentsForRepo({
                owner, repo, sort: 'created', direction: 'desc', since: new Date(corte).toISOString(), per_page: 100 });
              const armReciente = recientes.find(c => /\/issues\/\d+/.test(c.html_url || '')
                && new Date(c.created_at).getTime() >= corte
                && ARM_MARKERS.some(m => (c.body || '').includes(`<!-- ${m} -->`)));
              if (armReciente) {
                core.info(`barrido de cola: arm RECIENTE de otro emisor (${armReciente.html_url}, ${armReciente.created_at}) — serie recién adjudicada, su run aún no la delata. No armo #${next.number}.`);
                return;
              }
              await github.rest.issues.removeLabel({ owner, repo, issue_number: next.number, name: 'en-cola' }).catch(() => {});
              await github.rest.issues.removeLabel({ owner, repo, issue_number: next.number, name: 'stalled' }).catch(() => {});
              await github.rest.issues.createComment({ owner, repo, issue_number: next.number,
                body: `@claude arranca — turno de cola: la serie quedó libre (barrido de cola al cierre del job: el encolado no era visible en la lectura primaria — AP-062). ${COLA ? COLA.describir(next) : 'Eras el más antiguo en \`en-cola\`.'}\n\n<!-- arm-de-cola -->` });
              core.warning(`barrido de cola al cierre: serie LIBRE con cola NO vacía — armado #${next.number} (la lectura primaria de este job no vio el encolado).`);
            } catch (e) {
              core.warning(`barrido de cola al cierre falló: ${e.message}`);
            }
