                const trigBody = context.payload.comment?.body || '';
                const relanzadoConCita = /<!--\s*epic-partial-relaunch-por-estado-con-cita\s*-->/.test(trigBody);
                if (!relanzadoConCita && /<!--\s*epic-partial-relaunch-por-estado\s*-->/.test(trigBody)) {
                  await materializeScopeComplete({ viaState: true });
                  return;
                }
